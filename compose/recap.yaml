# compose/recap.yaml - Recap services
# Article summarization and evaluation
# Enrollment is in-process (PKI_ENROLLMENT=enabled). No pki-agent sidecar.

include:
  - base.yaml
  - pki.yaml

x-pki-cert-volume-chown: &pki-cert-volume-chown
  image: alpine:3.21
  user: "0:0"
  command:
    - sh
    - -c
    - mkdir -p /certs && chown 999:999 /certs && chmod 0750 /certs

services:
  recap-db:
    build:
      context: ../docker/postgres
      dockerfile: Dockerfile.recap-db
    container_name: recap-db
    restart: always
    mem_limit: 2048m
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${RECAP_DB_NAME}
      POSTGRES_USER: ${RECAP_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/recap_db_password
    secrets:
      - recap_db_password
    volumes:
      # PostgreSQL 18+ requires mount at /var/lib/postgresql (not /data)
      - recap_db_data:/var/lib/postgresql
      # Note: initスクリプトはAtlasマイグレーションに移行済みのため削除
      # - ../recap-worker/recap-db/init:/docker-entrypoint-initdb.d:rw
    configs:
      - source: postgres_postgresql_recap_conf
        target: /etc/postgresql/postgresql.conf
        mode: 0444
      - source: postgres_pg_hba_conf
        target: /etc/postgresql/pg_hba.conf
        mode: 0444
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECAP_DB_USER} -d ${RECAP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alt-network
    tty: true
    labels:
      - rask.group=recap-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recap-db-migrator:
    build:
      context: ../recap-migration-atlas
      dockerfile: docker/Dockerfile
    container_name: recap_db_migrator
    # Short-lived Atlas apply job; keep under worker footprints.
    mem_limit: 256m
    command: ["apply"]
    environment:
      # Database credentials - password read from secret file
      RECAP_DB_HOST: recap-db
      RECAP_DB_PORT: ${RECAP_DB_PORT}
      RECAP_DB_USER: ${RECAP_DB_USER}
      RECAP_DB_NAME: ${RECAP_DB_NAME}
      RECAP_DB_PASSWORD_FILE: /run/secrets/recap_db_password
      ATLAS_ENV: ${ATLAS_ENV:-kubernetes}
      ATLAS_REVISIONS_SCHEMA: "public"
      MIGRATE_BASELINE_VERSION: ${RECAP_MIGRATE_BASELINE_VERSION:-}
    secrets:
      - recap_db_password
    volumes:
      - ../recap-migration-atlas/migrations:/migrations:ro
    depends_on:
      recap-db:
        condition: service_healthy
    networks:
      - alt-network

  recap-worker:
    env_file:
      - ../.env
    mem_limit: 2048m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-recap-worker:${IMAGE_TAG:-main}
    build:
      context: ../recap-worker
      dockerfile: Dockerfile.recap-worker
    networks:
      - alt-network
    environment:
      # Database credentials - password read from secret file (app constructs DSN)
      - RECAP_DB_HOST=recap-db
      - RECAP_DB_PORT=${RECAP_DB_PORT}
      - RECAP_DB_USER=${RECAP_DB_USER}
      - RECAP_DB_PASSWORD_FILE=/run/secrets/recap_db_password
      - RECAP_DB_NAME=${RECAP_DB_NAME}
      - NEWS_CREATOR_BASE_URL=https://news-creator:9443
      - SUBWORKER_BASE_URL=https://recap-subworker:9443
      - ALT_BACKEND_BASE_URL=${ALT_BACKEND_BASE_URL}
      - MTLS_ENFORCE=${RECAP_WORKER_MTLS_ENFORCE:-true}
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=recap-worker
      - CERT_SANS=recap-worker,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-recap-worker
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-recap-worker-jwk
      - RENEW_AT_FRACTION=0.66
      - PKI_METRICS_BIND=0.0.0.0:9110
      # Outbound mTLS to the data plane. The recap article reads moved out of
      # alt-backend in the 3-binary split (ADR-000954); cmd/backend opens no
      # mTLS listener any more and cmd/datahub serves that surface alone, as
      # `services.datahub.v1.DataHubService` (the old
      # `services.backend.v1.BackendInternalService` and the `/v1/internal`
      # REST pair were both deleted in Wave 2-C).
      # pipeline/orchestrator.rs and pipeline/morning.rs derive SNI from this
      # URL's host, so `alt-data-hub` must be a SAN of the leaf
      # alt-data-hub mints in-process (CERT_SANS=alt-data-hub,localhost) — it
      # is. This container's leaf is CN/SAN `recap-worker`, which is in
      # alt-data-hub's DATAHUB_ALLOWED_PEERS (compose/core.yaml).
      - ALT_BACKEND_MTLS_URL=https://alt-data-hub:9443
      - TAG_GENERATOR_MTLS_URL=https://tag-generator:9443
      - TAG_LABEL_GRAPH_WINDOW=${TAG_LABEL_GRAPH_WINDOW}
      - TAG_LABEL_GRAPH_TTL_SECONDS=${TAG_LABEL_GRAPH_TTL_SECONDS}
      - HUGGING_FACE_TOKEN_PATH=/run/secrets/hugging_face_token
      # RUSTBERT_CACHE / HF_HOME は Dockerfile ENV で /opt/rustbert-cache に
      # 固定済。ホストの /opt/rustbert-cache を read-only bind-mount することで、
      # 再起動時の HF 再ダウンロード (約 130 MB) を回避し、staging と同じ
      # パス規約を使う。初回 populate は runner 側で warmup subcommand 実行。
      # Fail-closed: /opt/rustbert-cache が空だと embedding 初期化が失敗する。
      # true にすると起動時 exit 1 で refuse し subgenre-splitter 欠落による
      # 2-ジャンル崩壊 (PM-2026-038) を防ぐ。populate 経路が確立しない dev
      # stack では false に落として keyword-only fallback を許可する。
      - RECAP_WORKER_EMBEDDING_REQUIRED=${RECAP_WORKER_EMBEDDING_REQUIRED:-true}
      # Clustering timeout: relax stuck detection from 600s to 1200s for large genres
      - RECAP_CLUSTERING_STUCK_THRESHOLD_SECS=${RECAP_CLUSTERING_STUCK_THRESHOLD_SECS:-1200}
      # Batch summary chunk size: reduced to 3 to prevent batch HTTP timeout
      # (10 genres × hierarchical Map-Reduce exceeded 1800s timeout)
      - RECAP_BATCH_SUMMARY_CHUNK_SIZE=${RECAP_BATCH_SUMMARY_CHUNK_SIZE:-3}
      # Per-genre LLM summary timeout (hierarchical Map-Reduce needs sufficient margin)
      - LLM_SUMMARY_TIMEOUT_SECS=${LLM_SUMMARY_TIMEOUT_SECS:-900}
      # Evening Pulse configuration
      - PULSE_ENABLED=true
      - PULSE_ROLLOUT_PERCENT=100
      - PULSE_VERSION=v4
      - MORNING_DAEMON_ENABLED=${MORNING_DAEMON_ENABLED:-true}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=recap-worker
      # Persist-stage emit of recap.topic_snapshotted.v1 into
      # knowledge-sovereign so Surface Planner v2 can credit Loop entries
      # with topic_overlap_count / recap_cluster_momentum signals.
      # EMIT=true requires the owner id pair below — recap-worker refuses
      # to start on a half-wired combination instead of running scopeless
      # and never emitting (the producer spent months in that state).
      # Flip EMIT to false to disable without redeploying. URL stays
      # internal (port 9500) — Prometheus scrape uses 9501 separately.
      - RECAP_KNOWLEDGE_EMIT=${RECAP_KNOWLEDGE_EMIT:-true}
      - RECAP_KNOWLEDGE_SOVEREIGN_URL=${RECAP_KNOWLEDGE_SOVEREIGN_URL:-http://knowledge-sovereign:9500}
      - RECAP_KNOWLEDGE_OWNER_USER_ID=${RECAP_KNOWLEDGE_OWNER_USER_ID:-}
      - RECAP_KNOWLEDGE_OWNER_TENANT_ID=${RECAP_KNOWLEDGE_OWNER_TENANT_ID:-}
    secrets:
      - recap_db_password
      - hugging_face_token
      - pki-agent-recap-worker-jwk
    volumes:
      - recap_worker_certs:/certs
      - pki_trust_bundle:/trust:ro
      # Host-side populate (altctldeploy recap populate-cache) で焼いた
      # rust-bert キャッシュを共有。bind を :rw にしているのは rust-bert の
      # cached-path crate と hf-hub crate が cache hit 時にも lockfile /
      # meta を更新し token 存在確認で書き込みを試みるため (:ro 下では
      # "Read-only file system (os error 30)" で Embedding 初期化が失敗)。
      # populate 済前提の前提崩れに対する防御は ADR-000827 の
      # RECAP_WORKER_EMBEDDING_REQUIRED=true によるアプリ層 fail-closed に寄せる。
      - /opt/rustbert-cache:/opt/rustbert-cache:rw
    pre_start:
      - <<: *pki-cert-volume-chown
    depends_on:
      recap-db:
        condition: service_healthy
      step-ca-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 768M
    ports:
      # Same router as the mTLS listener, minus the transport: /admin/jobs/retry
      # and /v1/generate/* carry no auth extractor at all. Loopback bind.
      - "127.0.0.1:9005:9005"
    healthcheck:
      test: ["CMD", "/usr/local/bin/recap-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - rask.group=recap-worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recap-subworker:
    env_file:
      - ../.env
    mem_limit: 8192m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-recap-subworker:${IMAGE_TAG:-main}
    build:
      context: ../recap-subworker
      dockerfile: Dockerfile.recap-subworker
    networks:
      - alt-network
    environment:
      - RECAP_SUBWORKER_DB_PASSWORD_FILE=/run/secrets/recap_db_password
      - RECAP_SUBWORKER_BASE_URL=http://recap-subworker:8002
      - RECAP_SUBWORKER_MODEL_BACKEND=${RECAP_SUBWORKER_MODEL_BACKEND:-ollama-remote}
      - RECAP_SUBWORKER_MODEL_ID=${RECAP_SUBWORKER_MODEL_ID:-BAAI/bge-m3}
      - RECAP_SUBWORKER_OLLAMA_EMBED_URL=${OLLAMA_EMBED_URL:-http://knowledge-embedder-local:11434}
      - RECAP_SUBWORKER_OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - RECAP_SUBWORKER_PIPELINE_MODE=inprocess
      # Single worker for CUDA compatibility (CUDA context survives fork only in single worker mode)
      - RECAP_SUBWORKER_GUNICORN_WORKERS=1
      - RECAP_SUBWORKER_GUNICORN_WORKER_TIMEOUT=3600
      - RECAP_SUBWORKER_GUNICORN_MAX_REQUESTS=50000
      - RECAP_SUBWORKER_GUNICORN_GRACEFUL_TIMEOUT=120
      - RECAP_SUBWORKER_PROCESS_POOL_SIZE=2
      - RECAP_SUBWORKER_MAX_BACKGROUND_RUNS=2
      - RECAP_SUBWORKER_PIPELINE_WORKER_PROCESSES=2
      - RECAP_SUBWORKER_CLASSIFICATION_WORKER_PROCESSES=2
      - RECAP_SUBWORKER_CLASSIFICATION_POOL_IDLE_TIMEOUT_SECONDS=60
      # Embedding device (for sentence-transformers backend only, ignored when using ollama-remote)
      # - cuda: Use local NVIDIA GPU (requires workers=1 for CUDA compatibility)
      # - cpu: Use CPU (when using ollama-remote, set to cpu to avoid loading local GPU model)
      - RECAP_SUBWORKER_DEVICE=${RECAP_SUBWORKER_DEVICE:-cuda}
      # Increase batch size from 8 to 32 for better GPU utilization
      - RECAP_SUBWORKER_BATCH_SIZE=${RECAP_SUBWORKER_BATCH_SIZE:-32}
      # Reduce Optuna trials from 50 to 15 (TPE converges within 15-20 trials)
      - RECAP_SUBWORKER_BAYES_OPT_TRIALS=${RECAP_SUBWORKER_BAYES_OPT_TRIALS:-15}
      # Reduce UMAP dimensions from 20 to 8 for faster HDBSCAN
      - RECAP_SUBWORKER_UMAP_N_COMPONENTS=${RECAP_SUBWORKER_UMAP_N_COMPONENTS:-8}
      # HDBSCAN timeout before fallback to MiniBatchKMeans (seconds)
      - RECAP_SUBWORKER_HDBSCAN_TIMEOUT_SECS=${RECAP_SUBWORKER_HDBSCAN_TIMEOUT_SECS:-300}
      # Classification (Learning Machine) - CPU使用でOOM回避
      - RECAP_SUBWORKER_CLASSIFICATION_DEVICE=cpu
      # Numba threading: TBB is thread-safe, workqueue/omp are not
      - NUMBA_THREADING_LAYER=tbb
      - LD_LIBRARY_PATH=/app/.venv/lib
      # Wave 4: inbound TLS is in-process. Identity comes from the verified
      # client cert on :9443; never from a caller-supplied header.
      - INBOUND_MTLS=true
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - MTLS_ALLOWED_PEERS=${RECAP_SUBWORKER_MTLS_ALLOWED_PEERS:-recap-worker}
      - PEER_IDENTITY_TRUSTED=off
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=recap-subworker
      - CERT_SANS=recap-subworker,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-recap-subworker
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-recap-subworker-jwk
      - RENEW_AT_FRACTION=0.66
      - OPS_LISTEN=:9110
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=recap-subworker
    ports:
      # Plaintext twin of the in-process mTLS :9443; only recap-worker
      # should reach the TLS port. Loopback bind for cheap health.
      - "127.0.0.1:8002:8002"
    secrets:
      - recap_db_password
      - pki-agent-recap-subworker-jwk
    volumes:
      # joblib artefacts (genre_classifier*.joblib, tfidf_vectorizer*.joblib,
      # genre_thresholds*.json, golden_classification.json) live on the
      # single-machine prod host at a path outside the alt-deploy CI
      # workspace, installed once by runner bootstrap (see
      # docs/runbooks/runner-setup.md §2.6). The artefacts are gitignored
      # (large binary ML model files, OSS boundary), so any path relative
      # to this compose file would resolve into the per-job ephemeral
      # workspace and be empty on every checkout. Override
      # RECAP_SUBWORKER_DATA_HOST_PATH in a local .env to point at a dev
      # copy (e.g. ../recap-subworker/data) when running compose on a
      # workstation that keeps artefacts in the repo tree.
      #
      # Directory-scoped bind mount with create_host_path: false: Engine
      # refuses to create the container if the host source directory is
      # missing (no silent empty-directory auto-create). Short syntax
      # cannot set that flag. That is the deploy-time fail-closed
      # contract replacing the earlier named-volume + init-container
      # pattern, which was incompatible with per-service `--no-deps`
      # rolling. See ADR-000825 addendum / Wave 0 feature gate.
      - type: bind
        source: ${RECAP_SUBWORKER_DATA_HOST_PATH:-/var/lib/alt-recap-subworker-data}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      # Learning Machine model artifacts — same host-path rule as /app/data
      # above, and for the same reason: the 5.4 GB of student/teacher models
      # are gitignored, so a path relative to this compose file resolves into
      # the deploy runner's per-job checkout and is empty there. Populate the
      # host path once (docs/runbooks/runner-setup.md §2.6) and override
      # RECAP_SUBWORKER_ARTIFACTS_HOST_PATH on a workstation that keeps the
      # artefacts in the repo tree.
      - type: bind
        source: ${RECAP_SUBWORKER_ARTIFACTS_HOST_PATH:-/var/lib/alt-recap-subworker-artifacts}
        target: /app/recap_subworker/learning_machine/artifacts
        read_only: true
        bind:
          create_host_path: false
      - recap_subworker_certs:/certs
      - pki_trust_bundle:/trust:ro
    pre_start:
      - <<: *pki-cert-volume-chown
    depends_on:
      recap-worker:
        condition: service_healthy
      step-ca-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    labels:
      - rask.group=recap-subworker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    env_file:
      - ../.env
    mem_limit: 128m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-dashboard:${IMAGE_TAG:-main}
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      # Operator dashboard, no authentication of its own.
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:8502:8000"
    environment:
      # Database credentials - password read from secret file (app constructs DSN)
      - RECAP_DB_HOST=recap-db
      - RECAP_DB_PORT=5432
      - RECAP_DB_USER=${RECAP_DB_USER}
      - RECAP_DB_PASSWORD_FILE=/run/secrets/recap_db_password
      - RECAP_DB_NAME=${RECAP_DB_NAME}
      - SSE_PORT=8000
    secrets:
      - recap_db_password
    depends_on:
      recap-db:
        condition: service_healthy
    networks:
      - alt-network
    restart: unless-stopped
    labels:
      - rask.group=dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recap-evaluator:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-recap-evaluator:${IMAGE_TAG:-main}
    build:
      context: ../recap-evaluator
      dockerfile: Dockerfile
    mem_limit: 2g
    environment:
      # Database credentials - password read from secret file (app constructs DSN)
      - RECAP_DB_HOST=recap-db
      - RECAP_DB_PORT=${RECAP_DB_PORT}
      - RECAP_DB_USER=${RECAP_DB_USER}
      - RECAP_DB_PASSWORD_FILE=/run/secrets/recap_db_password
      - RECAP_DB_NAME=${RECAP_DB_NAME}
      - OLLAMA_URL=http://news-creator:11434
      - OLLAMA_MODEL=gemma4-e4b-12k
      - RECAP_WORKER_URL=http://recap-worker:9005
      - EVALUATION_SCHEDULE=0 6 * * *
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=recap-evaluator
    secrets:
      - recap_db_password
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      recap-db:
        condition: service_healthy
    networks:
      - alt-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 512M
    labels:
      - rask.group=recap-evaluator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
