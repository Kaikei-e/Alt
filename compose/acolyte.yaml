# compose/acolyte.yaml - Acolyte report generation orchestrator
# acolyte-db: dedicated PostgreSQL for report versioning tables
# acolyte-db-migrator: Atlas migration runner
# acolyte-orchestrator: Python service (Starlette + Connect-RPC + LangGraph)

include:
  - base.yaml
  - pki.yaml

# Cert lifecycle for acolyte-orchestrator is owned by
# pki-agent-acolyte-orchestrator in compose/pki.yaml.

# nginx TLS sidecar replaced by pki-agent proxy mode (ADR-000747, F-007).
# pki-agent-acolyte-orchestrator in compose/pki.yaml handles both cert lifecycle
# AND mTLS reverse proxy (:9443 → :8090) via Go certReloader hot-reload.

services:
  acolyte-db:
    image: postgres:18-alpine
    container_name: acolyte-db
    mem_limit: 192m
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_DB: ${ACOLYTE_DB_NAME:-acolyte}
      POSTGRES_USER: ${ACOLYTE_DB_USER:-acolyte_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/acolyte_db_password
    secrets:
      - acolyte_db_password
    volumes:
      - acolyte_db_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${ACOLYTE_DB_USER:-acolyte_user} -d ${ACOLYTE_DB_NAME:-acolyte}",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alt-network
    restart: unless-stopped
    labels:
      - rask.group=acolyte-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  acolyte-db-migrator:
    build:
      context: ../acolyte-migration-atlas
      dockerfile: docker/Dockerfile
    container_name: acolyte-db-migrator
    # Short-lived Atlas apply job.
    mem_limit: 256m
    command: ["apply"]
    environment:
      - ACOLYTE_DB_HOST=acolyte-db
      - ACOLYTE_DB_PORT=5432
      - ACOLYTE_DB_USER=${ACOLYTE_DB_USER:-acolyte_user}
      - ACOLYTE_DB_NAME=${ACOLYTE_DB_NAME:-acolyte}
      - ACOLYTE_DB_PASSWORD_FILE=/run/secrets/acolyte_db_password
    secrets:
      - acolyte_db_password
    depends_on:
      acolyte-db:
        condition: service_healthy
    networks:
      - alt-network
    restart: "no"
    labels:
      - rask.group=acolyte-db-migrator

  acolyte-orchestrator:
    container_name: acolyte-orchestrator
    mem_limit: 256m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-acolyte-orchestrator:${IMAGE_TAG:-main}
    build:
      context: ../acolyte-orchestrator
      dockerfile: Dockerfile
    volumes:
      - acolyte_orchestrator_certs:/certs:ro
      - pki_trust_bundle:/trust:ro
    environment:
      - ACOLYTE_DB_DSN=postgresql://${ACOLYTE_DB_USER:-acolyte_user}:placeholder@acolyte-db:5432/${ACOLYTE_DB_NAME:-acolyte}
      - ACOLYTE_DB_PASSWORD_FILE=/run/secrets/acolyte_db_password
      # LLM inference: defaults to the local news-creator proxy (HybridPrioritySemaphore);
      # override ACOLYTE_LLM_URL in .env only to route elsewhere
      - NEWS_CREATOR_URL=${ACOLYTE_LLM_URL:-http://news-creator:11434}
      - LLM_PROVIDER=${ACOLYTE_LLM_PROVIDER:-ollama}
      - VLLM_API_KEY=${ACOLYTE_VLLM_API_KEY:-}
      - SEARCH_INDEXER_URL=${ACOLYTE_SEARCH_URL:-http://search-indexer:9300}
      - DEFAULT_MODEL=${ACOLYTE_MODEL:-gemma4-e4b-12k}
      # Must match the shared Ollama runner's num_ctx (compose/ai.yaml LLM_NUM_CTX)
      # or the runner reloads on each alternation between acolyte and news-creator.
      - LLM_NUM_CTX=${LLM_NUM_CTX:-12288}
      - LOG_LEVEL=info
      - CHECKPOINT_ENABLED=true
      # HyDE cross-lingual expansion: Gemma4 Q4 generate typically takes
      # 10-20s for 400 tokens, so keep timeout well above the short 8s
      # default. None return if exceeded.
      - HYDE_ENABLED=${ACOLYTE_HYDE_ENABLED:-true}
      - HYDE_TIMEOUT_S=${ACOLYTE_HYDE_TIMEOUT_S:-30.0}
      - HYDE_MAX_CHARS=${ACOLYTE_HYDE_MAX_CHARS:-600}
      - HYDE_NUM_PREDICT=${ACOLYTE_HYDE_NUM_PREDICT:-400}
      # Now defaults on: the notification relay is an outbound mTLS client of
      # alt-data-hub, and with MTLS_ENFORCE off acolyte/infra/mtls_client.py
      # presents no client certificate at all — the data plane's peer allowlist
      # is its entire authorisation decision, so the relay would simply be
      # refused, quietly, on every tick.
      - MTLS_ENFORCE=${ACOLYTE_ORCHESTRATOR_MTLS_ENFORCE:-true}
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      # --- notification outbox relay ---------------------------------------
      # acolyte-db carries no owner column on reports, report_runs or
      # report_briefs, so there is no row to derive a recipient from and the
      # user has to be supplied. Unset means the relay logs
      # notification_outbox_relay_disabled and does not run; a malformed value
      # is a startup failure rather than a relay that forwards to nobody.
      - NOTIFICATIONS_ENABLED=${ACOLYTE_NOTIFICATIONS_ENABLED:-false}
      - NOTIFICATION_USER_ID=${ALT_NOTIFICATION_USER_ID:-}
      - DATAHUB_URL=https://alt-data-hub:9443
      # trust X-Alt-Peer-Identity header iff the perimeter sidecar
      # enforces client certs. Must track VERIFY_CLIENT above.
      - PEER_IDENTITY_TRUSTED=${ACOLYTE_ORCHESTRATOR_VERIFY_CLIENT:-on}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=acolyte-orchestrator
    secrets:
      - acolyte_db_password
    extra_hosts:
      - "llm-external:${ACOLYTE_LLM_HOST:-127.0.0.1}"
    ports:
      # Plaintext twin of the mTLS :9443 that pki-agent-acolyte-orchestrator
      # serves from this container's netns. AcolyteService authenticates
      # nobody on it, so publishing it on every NIC is a second entrance the
      # sidecar cannot see (ADR-000757 rejected exactly this). Loopback bind.
      - "127.0.0.1:8090:8090"
    networks:
      - alt-network
    depends_on:
      acolyte-db:
        condition: service_healthy
      acolyte-db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - rask.group=acolyte-orchestrator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  acolyte_db_data:
