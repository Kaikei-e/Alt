# compose/acolyte.yaml - Acolyte report generation orchestrator
# acolyte-db: dedicated PostgreSQL for report versioning tables
# acolyte-db-migrator: Atlas migration runner
# acolyte-orchestrator: Python service (Starlette + Connect-RPC + LangGraph)
# Enrollment is in-process (PKI_ENROLLMENT=enabled). No pki-agent sidecar.
# Wave 4: inbound mTLS lives in-process on :9443. Plaintext :8090 stays
# loopback-only for cheap health; it is not an external mTLS fallback.

include:
  - base.yaml
  - pki.yaml

x-pki-cert-volume-chown: &pki-cert-volume-chown
  image: alpine:3.21
  user: "0:0"
  command:
    - sh
    - -c
    - mkdir -p /certs && chown -R 1000:1000 /certs && chmod 0750 /certs

services:
  acolyte-db:
    image: postgres:18-alpine
    container_name: acolyte-db
    mem_limit: 192m
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_DB: ${ACOLYTE_DB_NAME:-acolyte}
      POSTGRES_USER: ${ACOLYTE_DB_USER:-acolyte_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/acolyte_db_password
    secrets:
      - acolyte_db_password
    volumes:
      - acolyte_db_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${ACOLYTE_DB_USER:-acolyte_user} -d ${ACOLYTE_DB_NAME:-acolyte}",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alt-network
    restart: unless-stopped
    labels:
      - rask.group=acolyte-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  acolyte-db-migrator:
    build:
      context: ../acolyte-migration-atlas
      dockerfile: docker/Dockerfile
    container_name: acolyte-db-migrator
    # Short-lived Atlas apply job.
    #
    # This is a `restart: "no"` one-shot that acolyte-orchestrator gates on
    # with `service_completed_successfully`, which is the shape PM-2026-037
    # burned us on: a per-service roll runs `up -d --no-deps
    # acolyte-orchestrator` and the migrator is never started, so a pending
    # migration stays pending while the deploy reports success. It is the same
    # shape as `migrate` in core.yaml, and it is not self-healing — the
    # migrator has to be invoked by name (`make acolyte-migrate`) whenever
    # acolyte-migration-atlas/migrations/ gains a file. The bind mount below
    # is what makes that invocation sufficient on its own.
    mem_limit: 256m
    command: ["apply"]
    environment:
      - ACOLYTE_DB_HOST=acolyte-db
      - ACOLYTE_DB_PORT=5432
      - ACOLYTE_DB_USER=${ACOLYTE_DB_USER:-acolyte_user}
      - ACOLYTE_DB_NAME=${ACOLYTE_DB_NAME:-acolyte}
      - ACOLYTE_DB_PASSWORD_FILE=/run/secrets/acolyte_db_password
      - ATLAS_REVISIONS_SCHEMA=public
      # Empty means "no baseline". migrate.sh exits non-zero rather than
      # guessing when it meets a non-clean database with this unset.
      - MIGRATE_BASELINE_VERSION=${ACOLYTE_MIGRATE_BASELINE_VERSION:-}
    secrets:
      - acolyte_db_password
    volumes:
      # Serve the migration set from the working tree, as `migrate` and
      # recap-db-migrator do. The Dockerfile also COPYs it, so without this
      # mount the image is the only carrier and a new .sql file needs an
      # image rebuild before it can be applied.
      - ../acolyte-migration-atlas/migrations:/migrations:ro
    depends_on:
      acolyte-db:
        condition: service_healthy
    networks:
      - alt-network
    restart: "no"
    labels:
      - rask.group=acolyte-db-migrator

  acolyte-orchestrator:
    container_name: acolyte-orchestrator
    mem_limit: 256m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-acolyte-orchestrator:${IMAGE_TAG:-main}
    build:
      context: ../acolyte-orchestrator
      dockerfile: Dockerfile
    volumes:
      - acolyte_orchestrator_certs:/certs
      - pki_trust_bundle:/trust:ro
    pre_start:
      - <<: *pki-cert-volume-chown
    environment:
      - ACOLYTE_DB_DSN=postgresql://${ACOLYTE_DB_USER:-acolyte_user}:placeholder@acolyte-db:5432/${ACOLYTE_DB_NAME:-acolyte}
      - ACOLYTE_DB_PASSWORD_FILE=/run/secrets/acolyte_db_password
      # LLM inference: defaults to the local news-creator proxy (HybridPrioritySemaphore);
      # override ACOLYTE_LLM_URL in .env only to route elsewhere
      - NEWS_CREATOR_URL=${ACOLYTE_LLM_URL:-http://news-creator:11434}
      - LLM_PROVIDER=${ACOLYTE_LLM_PROVIDER:-ollama}
      - VLLM_API_KEY=${ACOLYTE_VLLM_API_KEY:-}
      - SEARCH_INDEXER_URL=${ACOLYTE_SEARCH_URL:-http://search-indexer:9300}
      - DEFAULT_MODEL=${ACOLYTE_MODEL:-gemma4-e4b-12k}
      # Must match the shared Ollama runner's num_ctx (compose/ai.yaml LLM_NUM_CTX)
      # or the runner reloads on each alternation between acolyte and news-creator.
      - LLM_NUM_CTX=${LLM_NUM_CTX:-12288}
      - LOG_LEVEL=info
      - CHECKPOINT_ENABLED=true
      # HyDE cross-lingual expansion: Gemma4 Q4 generate typically takes
      # 10-20s for 400 tokens, so keep timeout well above the short 8s
      # default. None return if exceeded.
      - HYDE_ENABLED=${ACOLYTE_HYDE_ENABLED:-true}
      - HYDE_TIMEOUT_S=${ACOLYTE_HYDE_TIMEOUT_S:-30.0}
      - HYDE_MAX_CHARS=${ACOLYTE_HYDE_MAX_CHARS:-600}
      - HYDE_NUM_PREDICT=${ACOLYTE_HYDE_NUM_PREDICT:-400}
      # Now defaults on: the notification relay is an outbound mTLS client of
      # alt-data-hub, and with MTLS_ENFORCE off acolyte/infra/mtls_client.py
      # presents no client certificate at all — the data plane's peer allowlist
      # is its entire authorisation decision, so the relay would simply be
      # refused, quietly, on every tick.
      - MTLS_ENFORCE=${ACOLYTE_ORCHESTRATOR_MTLS_ENFORCE:-true}
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      # --- notification outbox relay ---------------------------------------
      # acolyte-db carries no owner column on reports, report_runs or
      # report_briefs, so there is no row to derive a recipient from and the
      # user has to be supplied. Unset means the relay logs
      # notification_outbox_relay_disabled and does not run; a malformed value
      # is a startup failure rather than a relay that forwards to nobody.
      - NOTIFICATIONS_ENABLED=${ACOLYTE_NOTIFICATIONS_ENABLED:-false}
      - NOTIFICATION_USER_ID=${ALT_NOTIFICATION_USER_ID:-}
      - DATAHUB_URL=https://alt-data-hub:9443
      # Wave 4: inbound TLS is in-process. Identity comes from the verified
      # client cert on :9443; never from a caller-supplied header.
      - INBOUND_TLS_ENABLED=true
      - MTLS_ALLOWED_PEERS=${ACOLYTE_ORCHESTRATOR_MTLS_ALLOWED_PEERS:-alt-butterfly-facade}
      - PEER_IDENTITY_TRUSTED=off
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=acolyte-orchestrator
      - CERT_SANS=acolyte-orchestrator,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-acolyte-orchestrator
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-acolyte-orchestrator-jwk
      - RENEW_AT_FRACTION=0.66
      - OPS_LISTEN=:9110
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=acolyte-orchestrator
    secrets:
      - acolyte_db_password
      - pki-agent-acolyte-orchestrator-jwk
    extra_hosts:
      - "llm-external:${ACOLYTE_LLM_HOST:-127.0.0.1}"
    ports:
      # Plaintext twin of the in-process mTLS :9443. AcolyteService
      # authenticates nobody on it, so publishing it on every NIC is a
      # second entrance the TLS listener cannot see. Loopback bind.
      - "127.0.0.1:8090:8090"
    networks:
      - alt-network
    depends_on:
      acolyte-db:
        condition: service_healthy
      acolyte-db-migrator:
        condition: service_completed_successfully
      step-ca-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - rask.group=acolyte-orchestrator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  acolyte_db_data:
