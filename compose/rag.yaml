# compose/rag.yaml - RAG extension services
# RAG database and orchestrator
# Enrollment is in-process (PKI_ENROLLMENT=enabled). No pki-agent sidecar.

include:
  - base.yaml
  - pki.yaml

x-pki-cert-volume-chown: &pki-cert-volume-chown
  image: alpine:3.21
  user: "0:0"
  command:
    - sh
    - -c
    - mkdir -p /certs && chown -R 65532:65532 /certs && chmod 0750 /certs

services:
  rag-db:
    build:
      context: ../rag-db
      dockerfile: Dockerfile
    container_name: rag-db
    restart: always
    mem_limit: 4096m
    shm_size: "2g"
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-rag_db}
      POSTGRES_USER: ${RAG_DB_USER:-rag_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/rag_db_password
    secrets:
      - rag_db_password
    volumes:
      - rag_db_data:/var/lib/postgresql
    configs:
      - source: postgres_postgresql_rag_conf
        target: /etc/postgresql/postgresql.conf
        mode: 0444
      - source: postgres_pg_hba_conf
        target: /etc/postgresql/pg_hba.conf
        mode: 0444
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${RAG_DB_USER:-rag_user} -d ${RAG_DB_NAME:-rag_db}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alt-network
    labels:
      - rask.group=rag-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rag-db-migrator:
    build:
      context: ../rag-migration-atlas
      dockerfile: docker/Dockerfile
    container_name: rag_db_migrator
    # Short-lived Atlas apply job; keep under worker footprints.
    mem_limit: 256m
    command: ["apply"]
    environment:
      DB_HOST: rag-db
      DB_PORT: 5432
      DB_USER: ${RAG_DB_USER:-rag_user}
      DB_NAME: ${RAG_DB_NAME:-rag_db}
      DB_PASSWORD_FILE: /run/secrets/rag_db_password
      ATLAS_ENV: ${ATLAS_ENV:-kubernetes}
      ATLAS_REVISIONS_SCHEMA: "public"
      MIGRATE_BASELINE_VERSION: ${RAG_MIGRATE_BASELINE_VERSION:-}
    secrets:
      - rag_db_password
    volumes:
      - ../rag-migration-atlas/migrations:/migrations:ro
    depends_on:
      rag-db:
        condition: service_healthy
    networks:
      - alt-network

  rag-orchestrator:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-rag-orchestrator:${IMAGE_TAG:-main}
    build:
      context: ../rag-orchestrator
      dockerfile: Dockerfile
    mem_limit: 128m
    environment:
      - ENV=production
      - PORT=9010
      - CONNECT_PORT=9011
      - DB_HOST=rag-db
      - DB_PORT=5432
      - DB_USER=${RAG_DB_USER:-rag_user}
      - DB_PASSWORD_FILE=/run/secrets/rag_db_password
      - DB_NAME=${RAG_DB_NAME:-rag_db}
      - EMBEDDER_EXTERNAL=${EMBEDDER_EXTERNAL:-http://knowledge-embedder-local:11434}
      # CPU embedder needs headroom: ~250-300ms/chunk, long articles reach
      # 50+ chunks per /api/embed call (measured 9.7s for 53 chunks).
      - EMBEDDER_TIMEOUT=60
      # RAG answer generation: routed through news-creator semaphore (ADR-565 follow-up)
      # Ask Augur chat uses HIGH PRIORITY to preempt batch summarization
      # Override AUGUR_EXTERNAL in .env to route to remote Mac if needed
      - AUGUR_EXTERNAL=${AUGUR_EXTERNAL:-http://news-creator:11434}
      - AUGUR_KNOWLEDGE_MODEL=${AUGUR_KNOWLEDGE_MODEL:-gemma4-e4b-12k}
      - SEARCH_INDEXER_URL=http://search-indexer:9300
      - QUERY_EXPANSION_URL=http://news-creator:11434
      - QUERY_EXPANSION_TIMEOUT=30
      - RERANK_ENABLED=true
      # Local ONNX int8 reranker (rerank-local service); the remote
      # rerank-external route is retired.
      - RERANK_URL=http://rerank-local:8080
      - RERANK_TIMEOUT=12
      - RAG_DEFAULT_MAX_TOKENS=${RAG_DEFAULT_MAX_TOKENS:-3072}
      - MORNING_LETTER_MAX_TOKENS=${MORNING_LETTER_MAX_TOKENS:-4096}
      - RAG_MAX_PROMPT_TOKENS=${RAG_MAX_PROMPT_TOKENS:-6000}
      - RAG_PROMPT_VERSION=${RAG_PROMPT_VERSION:-alpha-v2}
      - HYBRID_BM25_SOURCE=${HYBRID_BM25_SOURCE:-meilisearch}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      # Knowledge Loop Wave 4-A emit (ADR-000855). When true, the augur
      # handler publishes augur.conversation_linked.v1 into knowledge-
      # sovereign so Surface Planner v2's resolver can credit Loop entries
      # with HasAugurLink. Defaults to false-equivalent when unset, which
      # keeps live behavior unchanged.
      - RAG_ORCHESTRATOR_KNOWLEDGE_EVENT_EMIT=${RAG_ORCHESTRATOR_KNOWLEDGE_EVENT_EMIT:-true}
      - RAG_ORCHESTRATOR_KNOWLEDGE_SOVEREIGN_URL=${RAG_ORCHESTRATOR_KNOWLEDGE_SOVEREIGN_URL:-http://knowledge-sovereign:9500}
      # Outbound to the data plane (ADR-000954 D7, Wave 2-B). ALT_BACKEND_URL
      # and ALT_BACKEND_CONNECT_URL used to sit here, both pointed at
      # http://alt-backend:9102, and both had been dead since the 3-binary
      # split: :9102 is alt-backend's admin-only operator listener now, and
      # neither /v1/internal/articles/recent nor any data-plane RPC is served
      # there. alt-data-hub is the sole owner of alt_db and answers
      # services.datahub.v1.DataHubService behind mutual TLS. (The
      # `services.backend.v1.BackendInternalService` namespace that used to
      # carry these RPCs was deleted in Wave 2-C.)
      #
      # config.loadDataHub fail-fasts on an unset or non-https value, so a
      # forgotten line here is a container that does not start rather than one
      # that starts and 404s every tag-cloud and morning-letter query.
      - DATAHUB_MTLS_URL=${RAG_ORCHESTRATOR_DATAHUB_MTLS_URL:-https://alt-data-hub:9443}
      # Pins tls.Config.ServerName. Leaving it empty would also work here —
      # crypto/tls derives it from the URL host, and `alt-data-hub` is a SAN of
      # the leaf alt-data-hub mints in-process (CERT_SANS=alt-data-hub,localhost)
      # — but naming it keeps the URL and the identity independently editable.
      - DATAHUB_MTLS_SERVER_NAME=alt-data-hub
      - DATAHUB_TIMEOUT=${RAG_ORCHESTRATOR_DATAHUB_TIMEOUT:-30}
      # Required inbound peer-auth mode for the Connect-RPC listener (:9011).
      # mtls: terminate TLS with the in-process leaf and only admit allowlisted
      # client-cert CNs. Override to "disabled" to fall back to plaintext h2c.
      - PEER_IDENTITY_MODE=${RAG_ORCHESTRATOR_PEER_IDENTITY_MODE:-mtls}
      # One in-process leaf serves both directions: presented to
      # inbound callers by the listener above, and presented AS a client
      # certificate to alt-data-hub. Its CN/SAN is `rag-orchestrator`, which is
      # in alt-data-hub's DATAHUB_ALLOWED_PEERS (compose/core.yaml). These
      # three paths are required by the data-hub client regardless of
      # PEER_IDENTITY_MODE — there is no plaintext route to alt_db to fall
      # back to.
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - PEER_IDENTITY_ALLOWED_PEERS=${RAG_ORCHESTRATOR_ALLOWED_PEERS:-alt-backend}
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=rag-orchestrator
      - CERT_SANS=rag-orchestrator,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-rag-orchestrator
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-rag-orchestrator-jwk
      - RENEW_AT_FRACTION=0.66
      - OPS_LISTEN=:9110
    secrets:
      - rag_db_password
      - pki-agent-rag-orchestrator-jwk
    volumes:
      - rag_orchestrator_certs:/certs
      - pki_trust_bundle:/trust:ro
    pre_start:
      - <<: *pki-cert-volume-chown
    ports:
      # East-west only. With PEER_IDENTITY_MODE=disabled the Connect listener
      # is plaintext h2c and augur/handler.go trusts X-Alt-User-Id from the
      # caller, so the host must not be able to reach it.
      - "127.0.0.1:9010:9010"
      - "127.0.0.1:9011:9011"
    depends_on:
      rag-db:
        condition: service_healthy
      step-ca-bootstrap:
        condition: service_completed_successfully
    networks:
      - alt-network
    restart: unless-stopped
    labels:
      - rask.group=rag-orchestrator
    extra_hosts:
      - "embedder-external:${EMBEDDER_EXTERNAL_HOST:-127.0.0.1}"
      - "augur-external:${AUGUR_EXTERNAL_HOST:-127.0.0.1}"
      - "rerank-external:${RERANK_EXTERNAL_HOST:-127.0.0.1}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Local embedding service. Replaces the retired remote embedder route —
  # reuses the knowledge-embedder image, which is
  # device-agnostic (GPU wiring lives in compose env/devices, not the
  # Dockerfile) and self-pulls bge-m3 on boot. Runs as a SEPARATE
  # Ollama instance so the shared news-creator-backend scheduler can never
  # evict the generation model to fit this one (thrashing root cause);
  # bge-m3 needs ~1.2GB VRAM and Ollama falls back to CPU on its
  # own when VRAM is unavailable at load time. This is an optional
  # dependency of rag-orchestrator (BM25-only degrade contract), so it is
  # intentionally not wired via depends_on.
  knowledge-embedder-local:
    build:
      context: ../knowledge-embedder
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '12.0'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/home/ollama-user/.ollama
      - OLLAMA_KEEP_ALIVE=24h
      # One embedding model stays resident: bge-m3 serves every consumer
      # (rag-orchestrator, recap-subworker, Meilisearch hybrid search). Three
      # models did not fit alongside the generation model on an 8GB GPU, so the
      # bge-m3 load failed under VRAM pressure and took the daily Recap
      # classification with it. This list must match what consumers actually
      # request: a model missing here is still loaded on demand and then holds
      # VRAM that news-creator's generation model needs to fit entirely on the
      # GPU.
      - OLLAMA_MAX_LOADED_MODELS=1
      - EMBEDDING_MODELS=bge-m3
      # Ollama allocates each model's context once per parallel slot, so the
      # image default of 8 multiplies resident VRAM on a GPU shared with the
      # generation model. Embedding calls are short; 2 slots absorb the bursts.
      - OLLAMA_NUM_PARALLEL=2
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # /usr/lib/ollama must come first: libggml-cuda.so links against
      # libggml-base.so.0 there; without it the CUDA backend fails to dlopen
      # and Ollama silently falls back to CPU (same fix as news-creator-backend).
      - LD_LIBRARY_PATH=/usr/lib/ollama:/usr/lib/ollama/cuda_v12:/usr/lib/ollama/cuda_v13:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      - knowledge_embedder_local_models:/home/ollama-user/.ollama
    # Wave 1b / P2-13: chown the named volume before uid 2000 starts.
    # alpine is the chown image (not the ollama runtime). Idempotent.
    # Shares the service mounts, so rolling `up --no-deps --force-recreate`
    # still runs the hook (PM-2026-037).
    pre_start:
      - image: alpine:3.21
        user: "0:0"
        command:
          - sh
          - -c
          - mkdir -p /home/ollama-user/.ollama && chown -R 2000:2000 /home/ollama-user/.ollama
    ports:
      - "127.0.0.1:11437:11434"
    networks:
      - alt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    labels:
      - rask.group=knowledge-embedder-local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Local CPU reranker (ONNX int8 dynamic quantization, avx2). Replaces the
  # remote Mac reranker for local deployments — rag-orchestrator still points
  # RERANK_URL at rerank-external (see above) until that cutover happens.
  # Optional dependency of rag-orchestrator (skip-degrade contract), so it is
  # intentionally not wired via depends_on. First boot downloads
  # BAAI/bge-reranker-v2-m3 (~2.3GB) and quantizes it into the mounted
  # volume; subsequent restarts load the cached quantized model.
  rerank-local:
    build:
      context: ../rerank-server
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          # One-time ONNX export at first boot peaks >4G (torch tracing of the
          # fp32 checkpoint); steady-state serving needs ~2G.
          memory: 6G
          cpus: '16.0'
    volumes:
      - rerank_local_models:/models
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - alt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    labels:
      - rask.group=rerank-local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  knowledge_embedder_local_models:
  rerank_local_models:
