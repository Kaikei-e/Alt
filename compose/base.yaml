# compose/base.yaml - Shared resources for Alt platform
# This file contains secrets, networks, volumes, and YAML anchors
# Used by all other compose files via 'include' directive

name: alt

secrets:
  backend_token_secret:
    file: ../secrets/backend_token_secret.txt
  # The shared bearer auth-hub's /internal group compares X-Internal-Auth
  # against. Deliberately a different value from backend_token_secret: that one
  # is the HS256 key auth-hub signs browser tokens with, and it used to do both
  # jobs — which put the signing key in a plaintext header on every
  # alt-data-hub GetSystemUser call, and from there into nginx access logs and
  # OTel span attributes. auth-hub refuses to start when the two match.
  # Unrelated to internal_auth_token below, which is auth-token-manager's.
  auth_hub_internal_secret:
    file: ../secrets/auth_hub_internal_secret.txt
  postgres_password:
    file: ../secrets/postgres_password.txt
  db_password:
    file: ../secrets/db_password.txt
  pre_processor_sidecar_db_password:
    file: ../secrets/pre_processor_sidecar_db_password.txt
  recap_db_password:
    file: ../secrets/recap_db_password.txt
  sovereign_db_password:
    file: ../secrets/sovereign_db_password.txt
  sovereign_admin_token:
    file: ../secrets/sovereign_admin_token.txt
  rag_db_password:
    file: ../secrets/rag_db_password.txt
  kratos_db_password:
    file: ../secrets/kratos_db_password.txt
  kratos_cookie_secret:
    file: ../secrets/kratos_cookie_secret.txt
  kratos_cipher_secret:
    file: ../secrets/kratos_cipher_secret.txt
  meili_master_key:
    file: ../secrets/meili_master_key.txt
  meili_search_key:
    file: ../secrets/meili_search_key.txt
  clickhouse_password:
    file: ../secrets/clickhouse_password.txt
  csrf_secret:
    file: ../secrets/csrf_secret.txt
  hugging_face_token:
    file: ../secrets/hugging_face_token.txt
  inoreader_client_id:
    file: ../secrets/inoreader_client_id.txt
  inoreader_client_secret:
    file: ../secrets/inoreader_client_secret.txt
  grafana_admin_password:
    file: ../secrets/grafana_admin_password.txt
  restic_password:
    file: ../secrets/restic_password.txt
  acolyte_db_password:
    file: ../secrets/acolyte_db_password.txt
  pp_db_password:
    file: ../secrets/pp_db_password.txt
  image_proxy_secret:
    file: ../secrets/image_proxy_secret.txt
  # VAPID signing key for Web Push. Mounted into alt-notifier and nowhere else:
  # it is the only process that talks to a push service, and rotating this key
  # invalidates every existing browser subscription with no server-side
  # migration (RFC 8292 §4.2), so its blast radius is worth keeping to one
  # container. The matching public key is not a secret — it is handed to every
  # browser — and reaches alt-backend as ordinary config.
  vapid_private_key:
    file: ../secrets/vapid_private_key.txt
  # Not actually secret — it is handed to every browser that subscribes, and it
  # rides in the `k=` parameter of every push request. It uses the secrets
  # mechanism only because that mechanism is how a file gets into a container,
  # and keeping the pair in one place is what stops the halves drifting: a
  # public key that does not match the signing key invalidates every
  # subscription created under it, silently, from the browser's side.
  vapid_public_key:
    file: ../secrets/vapid_public_key.txt
  step_ca_root_password:
    file: ../secrets/step_ca_root_password.txt
  # Wave 4 first Go in-process cohort. Operator-created, gitignored.
  # Bootstrap with pki-agent/scripts/bootstrap-pki-provisioner.sh BEFORE
  # cutting the parents over: compose `file:` fail-fasts on a missing path
  # (no secret bytes in the repo). Never reuse step_ca_root_password here.
  pki-agent-alt-backend-jwk:
    file: ../secrets/pki-agent-alt-backend-jwk.txt
  pki-agent-alt-harvester-jwk:
    file: ../secrets/pki-agent-alt-harvester-jwk.txt
  pki-agent-alt-data-hub-jwk:
    file: ../secrets/pki-agent-alt-data-hub-jwk.txt
  pki-agent-alt-notifier-jwk:
    file: ../secrets/pki-agent-alt-notifier-jwk.txt
  pki-agent-alt-butterfly-facade-jwk:
    file: ../secrets/pki-agent-alt-butterfly-facade-jwk.txt
  pki-agent-auth-hub-jwk:
    file: ../secrets/pki-agent-auth-hub-jwk.txt
  pki-agent-search-indexer-jwk:
    file: ../secrets/pki-agent-search-indexer-jwk.txt
  pki-agent-rag-orchestrator-jwk:
    file: ../secrets/pki-agent-rag-orchestrator-jwk.txt
  pki-agent-pre-processor-jwk:
    file: ../secrets/pki-agent-pre-processor-jwk.txt
  pki-agent-tag-generator-jwk:
    file: ../secrets/pki-agent-tag-generator-jwk.txt
  pki-agent-recap-worker-jwk:
    file: ../secrets/pki-agent-recap-worker-jwk.txt
  pki-agent-acolyte-orchestrator-jwk:
    file: ../secrets/pki-agent-acolyte-orchestrator-jwk.txt
  pki-agent-recap-subworker-jwk:
    file: ../secrets/pki-agent-recap-subworker-jwk.txt
  pki-agent-news-creator-jwk:
    file: ../secrets/pki-agent-news-creator-jwk.txt
  pact_broker_basic_auth_password:
    file: ../secrets/pact_broker_basic_auth_password.txt
  # Separate from broker basic-auth so DB credentials are not shared with
  # the HTTP auth password (see compose/pact.yaml). Existing pact-db volumes
  # were initialized with the old shared secret — set pact_db_password to that
  # value (or recreate the volume) when rotating.
  pact_db_password:
    file: ../secrets/pact_db_password.txt
  internal_auth_token:
    file: ../secrets/internal_auth_token.txt
  # Pushover delivery credentials for Alertmanager. Two values, not one, and
  # not interchangeable: the token identifies the application, the user key
  # identifies the destination device set. Both are read from these files at
  # notify time (pushover_config's user_key_file / token_file) so neither ever
  # appears in alertmanager.yml or in the container environment.
  pushover_user_key:
    file: ../secrets/pushover_user_key.txt
  pushover_token:
    file: ../secrets/pushover_token.txt

# In-repo static files. Compose `configs:` refuse a missing source at
# `up` (unlike short-syntax file binds, which become empty directories —
# PM-2026-036). Shared here because db / kratos-db / rag-db / recap-db
# all include this file.
configs:
  postgres_postgresql_conf:
    file: ../docker/postgres/postgresql.conf
  postgres_pg_hba_conf:
    file: ../docker/postgres/pg_hba.conf
  postgres_postgresql_rag_conf:
    file: ../docker/postgres/postgresql-rag.conf
  postgres_postgresql_recap_conf:
    file: ../docker/postgres/postgresql-recap.conf

networks:
  alt-network:

volumes:
  db_data_17:
  kratos_db_data:
  meili_data:
  rask_log_aggregator_data:
  clickhouse_data:
  news_creator_models:
  recap_db_data:
  rag_db_data:
  oauth_token_data:
  prometheus_data:
  grafana_data:
  # Alertmanager's silences and notification log. Losing it means a restart
  # re-notifies every firing alert and forgets every active silence.
  alertmanager_data:
  pre_processor_db_data:
  redis-streams-data:
  step_ca_data:
  pki_trust_bundle:
  alt_backend_certs:
  # alt-backend's 3-binary split (alt-backend / alt-harvester / alt-data-hub).
  # One cert volume per subject: a shared volume would mean one leaf cert for
  # three CNs, and MTLS_ALLOWED_PEERS could no longer tell the callers apart.
  alt_harvester_certs:
  alt_data_hub_certs:
  alt_notifier_certs:
  auth_hub_certs:
  pre_processor_certs:
  search_indexer_certs:
  alt_butterfly_facade_certs:
  tag_generator_certs:
  acolyte_orchestrator_certs:
  recap_worker_certs:
  recap_subworker_certs:
  news_creator_certs:
  rag_orchestrator_certs:

x-rask-env: &rask-env
  environment:
    RASK_CONFIG: |
      endpoint = "http://rask-log-aggregator:9600/v1/aggregate"
      batch_size = 1
      flush_interval_ms = 500
      buffer_capacity = 100000
      log_level = "info"

# Forwarder shared env lives in compose/logging.yaml (x-rask-forwarder-env)
# so YAML anchors stay in the same file as <<: merges (include does not
# export anchors across files).

x-shared-env-file: &shared-env-file
  env_file:
    - ../.env

x-logging-config: &logging-config
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
