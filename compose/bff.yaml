# compose/bff.yaml - Backend for Frontend service
# Transparent proxy between alt-frontend-sv and alt-backend.
# Cert lifecycle is owned by pki-agent-alt-butterfly-facade in compose/pki.yaml.

include:
  - base.yaml
  - pki.yaml

services:
  alt-butterfly-facade:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-alt-butterfly-facade:${IMAGE_TAG:-main}
    build:
      context: ../alt-butterfly-facade
      dockerfile: Dockerfile
    environment:
      - BFF_PORT=9250
      - BACKEND_CONNECT_URL=http://alt-backend:9101
      # Admin Connect-RPC services live on alt-backend's internal listener.
      - BACKEND_INTERNAL_CONNECT_URL=http://alt-backend:9102
      - BACKEND_REST_URL=http://alt-backend:9000
      - AUTH_HUB_INTERNAL_URL=http://auth-hub:8888
      - BACKEND_TOKEN_SECRET_FILE=/run/secrets/backend_token_secret
      - BACKEND_TOKEN_ISSUER=auth-hub
      - BACKEND_TOKEN_AUDIENCE=alt-backend
      - BFF_REQUEST_TIMEOUT=30s
      - BFF_STREAMING_TIMEOUT=40m
      - TTS_CONNECT_URL=${TTS_CONNECT_URL:-}
      - ACOLYTE_CONNECT_URL=http://acolyte-orchestrator:8090
      - MTLS_LISTEN=${MTLS_LISTEN:-true}
      - MTLS_PORT=9443
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - MTLS_CLIENT_AUTH=${ALT_BUTTERFLY_FACADE_MTLS_CLIENT_AUTH:-}
      - MTLS_ALLOWED_PEERS=${ALT_BUTTERFLY_FACADE_MTLS_ALLOWED_PEERS:-}
      # Outbound mTLS is OFF, and that is an explicit value rather than an
      # unset one (rule 9): main.go logs `mtls_enforce_disabled` with every
      # upstream it resolved, so the state is visible at startup.
      #
      # Why it is off after the 3-binary split (ADR-000954): this service
      # proxies alt-backend's *browser* Connect services and its *admin*
      # Connect services, and neither moved to alt-data-hub. cmd/datahub
      # registers exactly one handler — `alt.datahub.v1.DataHubService`
      # (ADR-000954 D7) — and its
      # dataHubHandler 404s everything else, so repointing this hop at
      # https://alt-data-hub:9443 would connect and then 404 every RPC.
      # cmd/backend, meanwhile, no longer opens an mTLS listener at all
      # (config.RejectBackendMTLSListenerEnv makes re-adding one a startup
      # error), so https://alt-backend:9443 has nothing behind it either.
      # The only reachable targets are the plaintext BACKEND_CONNECT_URL /
      # BACKEND_INTERNAL_CONNECT_URL / BACKEND_REST_URL above.
      #
      # Turning this back on needs an mTLS target that serves the browser and
      # admin surfaces; ADR-000954 schedules that peer repoint for Wave 2.
      # Setting ALT_BUTTERFLY_FACADE_MTLS_ENFORCE=true today makes every
      # Connect RPC fail: newMTLSBackendTransport hands the backend client an
      # http2.Transport with AllowHTTP unset, which refuses an http:// URL.
      #
      # BACKEND_CONNECT_MTLS_URL / BACKEND_MTLS_SERVER_NAME are deliberately
      # absent. The first pointed at the removed alt-backend :9443; the second
      # was never read by this binary at all (newMTLSBackendTransport leaves
      # ServerName empty on purpose so SNI follows each request's URL host).
      - MTLS_ENFORCE=${ALT_BUTTERFLY_FACADE_MTLS_ENFORCE:-false}
      # Acolyte and TTS each run an nginx mTLS sidecar on :9443. Read only
      # when MTLS_ENFORCE is true, so they are inert with the default above.
      - ACOLYTE_CONNECT_MTLS_URL=https://acolyte-orchestrator:9443
      - TTS_CONNECT_MTLS_URL=${TTS_CONNECT_MTLS_URL:-}
    extra_hosts:
      - "tts-external:${TTS_EXTERNAL_HOST:-127.0.0.1}"
    secrets:
      - backend_token_secret
    ports:
      # The frontend calls the BFF over the container network; browsers reach
      # it through plecto. Loopback bind keeps local curl / e2e working.
      - "127.0.0.1:9250:9250"
      # mTLS :9443 intentionally not published (internal east-west only)
    volumes:
      - alt_butterfly_facade_certs:/certs:ro
      - pki_trust_bundle:/trust:ro
    depends_on:
      alt-backend:
        condition: service_healthy
      auth-hub:
        condition: service_healthy
      pki-agent-alt-butterfly-facade:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/alt-butterfly-facade", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - alt-network
    deploy:
      resources:
        reservations:
          memory: 64M
    labels:
      - rask.group=alt-bff
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
