# compose/workers.yaml - Background worker services
# pre-processor-sidecar, search-indexer, tag-generator, auth-token-manager

include:
  - base.yaml
  - pki.yaml

# Cert lifecycle for search-indexer / tag-generator is owned by
# pki-agent-search-indexer / pki-agent-tag-generator in compose/pki.yaml.

services:
  pre-processor-sidecar:
    env_file:
      - ../.env
    mem_limit: 128m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-pre-processor-sidecar:${IMAGE_TAG:-main}
    build:
      context: ../pre-processor-sidecar
      dockerfile: Dockerfile
    depends_on:
      oauth-token-init:
        condition: service_completed_successfully
      pre-processor-db:
        condition: service_healthy
      pre-processor-db-migrator:
        condition: service_completed_successfully
    environment:
      - DB_HOST=pre-processor-db
      - DB_PORT=5432
      - DB_NAME=${PP_DB_NAME:-pre_processor}
      - PRE_PROCESSOR_SIDECAR_DB_USER=${PP_DB_USER:-pp_user}
      - PRE_PROCESSOR_SIDECAR_DB_PASSWORD_FILE=/run/secrets/pp_db_password
      - INOREADER_CLIENT_ID_FILE=/run/secrets/inoreader_client_id
      - INOREADER_CLIENT_SECRET_FILE=/run/secrets/inoreader_client_secret
      - LOG_LEVEL=info
      - SERVICE_NAME=pre-processor-sidecar
      - TOKEN_STORAGE_TYPE=file
      - TOKEN_STORAGE_PATH=/app/secrets/oauth2_token.env
      - INOREADER_REFRESH_TOKEN_FILE=/app/secrets/oauth2_token.env
      - INTERNAL_AUTH_TOKEN_FILE=/run/secrets/internal_auth_token
    secrets:
      - pp_db_password
      - inoreader_client_id
      - inoreader_client_secret
      - internal_auth_token
    volumes:
      - oauth_token_data:/app/secrets
    restart: always
    networks:
      - alt-network
    tty: true
    labels:
      - rask.group=pre-processor-sidecar
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  search-indexer:
    env_file:
      - ../.env
    # Meilisearch batch indexer + Connect-RPC; aligned with other Go workers.
    mem_limit: 512m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-search-indexer:${IMAGE_TAG:-main}
    build:
      context: ../search-indexer
      dockerfile: Dockerfile.search-indexer
    restart: always
    depends_on:
      redis-streams:
        condition: service_healthy
      pki-agent-search-indexer:
        condition: service_healthy
    environment:
      - MTLS_LISTEN=${MTLS_LISTEN:-true}
      - MTLS_PORT=9443
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - MTLS_CLIENT_AUTH=${SEARCH_INDEXER_MTLS_CLIENT_AUTH:-}
      - MTLS_ALLOWED_PEERS=${SEARCH_INDEXER_MTLS_ALLOWED_PEERS:-}
      # Outbound mTLS to the data plane. BackendInternalService moved out of
      # alt-backend in the 3-binary split (ADR-000954) — cmd/backend opens no
      # mTLS listener at all now, cmd/datahub serves that surface and nothing
      # else. This container's leaf is CN/SAN `search-indexer`, which is in
      # alt-data-hub's DATAHUB_ALLOWED_PEERS (compose/core.yaml).
      - MTLS_ENFORCE=${SEARCH_INDEXER_MTLS_ENFORCE:-true}
      - BACKEND_API_MTLS_URL=https://alt-data-hub:9443
      # bootstrap/drivers.go pins tls.Config.ServerName from this, so it must
      # be a SAN of the alt-data-hub leaf (pki-agent-alt-data-hub mints
      # CERT_SANS=alt-data-hub,localhost).
      - BACKEND_MTLS_SERVER_NAME=alt-data-hub
      # Plaintext fallback used only when MTLS_ENFORCE is off. :9102 is
      # alt-backend's operator listener and no longer carries
      # BackendInternalService — see the note in compose/core.yaml.
      - BACKEND_API_URL=http://alt-backend:9102
      - MEILISEARCH_HOST=${MEILISEARCH_HOST}
      - MEILISEARCH_API_KEY_FILE=/run/secrets/meili_master_key
      - MEILISEARCH_SEARCH_API_KEY_FILE=/run/secrets/meili_search_key
      - MEILI_MASTER_KEY_FILE=/run/secrets/meili_master_key
      - MEILI_HYBRID_EMBEDDER=${MEILI_HYBRID_EMBEDDER:-qwen3}
      - MEILI_HYBRID_SEMANTIC_RATIO=${MEILI_HYBRID_SEMANTIC_RATIO:-0.7}
      - REDIS_STREAMS_URL=redis://redis-streams:6379
      - CONSUMER_ENABLED=true
      - CONSUMER_GROUP=search-indexer-group
      - CONSUMER_NAME=search-indexer-1
      # Recap indexing (polls recap-worker for Meilisearch indexing)
      - RECAP_WORKER_URL=http://recap-worker:9005
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=search-indexer
    secrets:
      - meili_master_key
      - meili_search_key
    networks:
      - alt-network
    volumes:
      - search_indexer_certs:/certs:ro
      - pki_trust_bundle:/trust:ro
    ports:
      # The peer-identity allowlist lives on the mTLS :9443 listener only, so
      # these two are the unguarded twins. Loopback bind.
      - "127.0.0.1:9300:9300"   # REST API
      - "127.0.0.1:9301:9301"   # Connect-RPC
      # mTLS :9443 intentionally not published (internal east-west only)
    healthcheck:
      test: ["CMD", "/search-indexer", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    tty: true
    labels:
      - rask.group=search-indexer
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # nginx TLS sidecar replaced by pki-agent proxy mode (ADR-000747, F-007).
  # pki-agent-tag-generator in compose/pki.yaml handles both cert lifecycle
  # AND mTLS reverse proxy (:9443 → :9400).

  tag-generator:
    env_file:
      - ../.env
    mem_limit: 3g
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-tag-generator:${IMAGE_TAG:-main}
    build:
      context: ../tag-generator
      dockerfile: Dockerfile.tag-generator
    depends_on:
      redis-streams:
        condition: service_healthy
    networks:
      - alt-network
    ports:
      # /extract-tags and /health carry no @require_auth, and verify_service_token
      # is a no-op that assumes the sidecar already rejected the caller — which
      # only holds for traffic that actually went through :9443. Loopback bind.
      - "127.0.0.1:9400:9400"
      # mTLS :9443 served by pki-agent-tag-generator (shares net ns via network_mode)
    environment:
      # Plaintext fallback used only when MTLS_ENFORCE is off. :9102 is
      # alt-backend's operator listener and no longer carries
      # BackendInternalService — see the note in compose/core.yaml. The data
      # plane has no plaintext listener (ADR-000954), so MTLS_ENFORCE defaults
      # to on; flipping it off breaks tag persistence, it is not a fallback.
      - BACKEND_API_URL=http://alt-backend:9102
      - MTLS_ENFORCE=${TAG_GENERATOR_MTLS_ENFORCE:-true}
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      # trust X-Alt-Peer-Identity header iff the sidecar above
      # enforces client certs. Must track TAG_GENERATOR_VERIFY_CLIENT.
      - PEER_IDENTITY_TRUSTED=${TAG_GENERATOR_VERIFY_CLIENT:-on}
      # Outbound mTLS to the data plane. BackendInternalService moved out of
      # alt-backend in the 3-binary split (ADR-000954); cmd/datahub serves it.
      # driver/connect_client_factory.py derives SNI from this URL's host, so
      # `alt-data-hub` must be a SAN of the leaf pki-agent-alt-data-hub mints
      # (CERT_SANS=alt-data-hub,localhost) — it is. This container's own leaf
      # is CN/SAN `tag-generator`, which is in DATAHUB_ALLOWED_PEERS.
      - BACKEND_API_MTLS_URL=https://alt-data-hub:9443
      - PORT=9400
      - CUDA_VISIBLE_DEVICES=""
      - REDIS_STREAMS_URL=redis://redis-streams:6379
      - CONSUMER_ENABLED=true
      - CONSUMER_GROUP=tag-generator-group
      - CONSUMER_NAME=tag-generator-1
      # PyTorch thread limiting (prevent CPU explosion)
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TORCH_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=tag-generator
    volumes:
      - ../scripts:/scripts:ro
      - ../tag-generator/models/onnx:/models/onnx:ro
      - tag_generator_certs:/certs:ro
      - pki_trust_bundle:/trust:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9400/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    tty: true
    restart: unless-stopped
    labels:
      - rask.group=tag-generator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  oauth-token-init:
    image: alpine:3.21
    volumes:
      - oauth_token_data:/data
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod 755 /data"]
    restart: "no"
    networks:
      - alt-network

  auth-token-manager:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-auth-token-manager:${IMAGE_TAG:-main}
    build:
      context: ../auth-token-manager
      dockerfile: Dockerfile
    mem_limit: 128m
    depends_on:
      oauth-token-init:
        condition: service_completed_successfully
    volumes:
      - oauth_token_data:/app/secrets
    environment:
      - INOREADER_CLIENT_ID_FILE=/run/secrets/inoreader_client_id
      - INOREADER_CLIENT_SECRET_FILE=/run/secrets/inoreader_client_secret
      - INOREADER_REDIRECT_URI=http://127.0.0.1:9201/callback
      - TOKEN_STORAGE_PATH=/app/secrets/oauth2_token.env
      - LOG_LEVEL=info
      - INTERNAL_AUTH_TOKEN_FILE=/run/secrets/internal_auth_token
    secrets:
      - internal_auth_token
      - inoreader_client_id
      - inoreader_client_secret
    restart: always
    ports:
      - "127.0.0.1:9201:9201"
    networks:
      - alt-network
    healthcheck:
      test: ["CMD", "/bin/deno", "run",
        "--allow-read=/app,/run/secrets",
        "--allow-write=/app/secrets",
        # OTEL_* stays a wildcard, matching the ENTRYPOINT in
        # auth-token-manager/Dockerfile. The OTLP exporter reads env names this
        # list does not know about (OTEL_EXPORTER_OTLP_LOGS_TIMEOUT among them),
        # and Deno turns an unpermitted read into an uncaught NotCapable — so
        # enumerating them made this probe fail on every run since boot while
        # the service itself was healthy.
        "--allow-env=CONNECTIVITY_CHECK,CONNECTIVITY_TIMEOUT,DENO_ENV,DEPLOYMENT_ENV,HTTP_PROXY,HTTPS_PROXY,HTTP_TIMEOUT,INOREADER_CLIENT_ID,INOREADER_CLIENT_ID_FILE,INOREADER_CLIENT_SECRET,INOREADER_CLIENT_SECRET_FILE,INOREADER_REDIRECT_URI,INTERNAL_AUTH_TOKEN,INTERNAL_AUTH_TOKEN_FILE,LOG_INCLUDE_STACK_TRACE,LOG_INCLUDE_TIMESTAMP,LOG_LEVEL,NETWORK_FALLBACK_TO_DIRECT,NODE_ENV,OTEL_*,RETRY_BACKOFF_FACTOR,RETRY_BASE_DELAY,RETRY_MAX_ATTEMPTS,RETRY_MAX_DELAY,SERVICE_VERSION,TOKEN_STORAGE_PATH",
        "main.ts", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
