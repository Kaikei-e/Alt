# compose/backup.yaml - Backup services for Alt platform
# Provides Restic-based backup with 3-2-1 strategy
#
# Usage:
#   docker compose -f compose/compose.yaml -p alt --profile backup up -d restic-backup
#   docker compose -f compose/compose.yaml -p alt exec restic-backup restic snapshots

include:
  - base.yaml


services:
  restic-backup:
    build:
      context: ../docker/backup
      dockerfile: Dockerfile
    container_name: alt-backup
    env_file:
      - ../scripts/backup/alt-backup.env
    environment:
      - IN_CONTAINER=1
      - RESTIC_REPOSITORY=/backups/restic-repo
      - RESTIC_PASSWORD_FILE=/run/secrets/restic_password
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-rask_user}

      # Healthchecks.io integration (optional)
      - HEALTHCHECK_HOURLY_URL=${HEALTHCHECK_HOURLY_URL:-}
      - HEALTHCHECK_DAILY_URL=${HEALTHCHECK_DAILY_URL:-}
      - HEALTHCHECK_OFFSITE_URL=${HEALTHCHECK_OFFSITE_URL:-}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
    secrets:
      - restic_password
      - postgres_password
      - db_password
      - kratos_db_password
      - recap_db_password
      - rag_db_password
      - pact_db_password
      - clickhouse_password
      - meili_master_key

    volumes:
      # Configured SSH keys for remote sync. Host-only files: a path relative
      # to this compose file follows the `secrets` symlink on an operator host
      # and resolves into the deploy runner's per-job checkout, where the
      # gitignored files are absent. Same host-path rule as recap-subworker
      # artefacts. Override RESTIC_SSH_*_HOST_PATH in a local .env to point at
      # ../secrets/ssh/... on a workstation that keeps the keys in the repo
      # tree. Long-syntax bind + create_host_path: false so a missing key
      # refuses rather than mounting as an empty directory (PM-2026-036).
      - type: bind
        source: ${RESTIC_SSH_KEY_HOST_PATH:-/var/lib/alt-restic/ssh/id_ed25519_backup}
        target: /root/.ssh/id_ed25519
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTIC_SSH_KNOWN_HOSTS_HOST_PATH:-/var/lib/alt-restic/ssh/known_hosts}
        target: /root/.ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false
      # Backup destination
      - ../backups:/backups
      # Auxiliary raw volume copies (read-only)
      # WARNING: Live scans of mutable database volumes without filesystem snapshot
      # exclude pg_wal and cannot guarantee crash-consistency or physical recovery / PITR.
      # These volume copies are strictly auxiliary/best-effort copies. Authoritative database
      # recovery relies on logical dumps (pg_dump custom format, ClickHouse native BACKUP,
      # and Meilisearch snapshots).
      - db_data_17:/data/db_data_17:ro
      - kratos_db_data:/data/kratos_db_data:ro
      - recap_db_data:/data/recap_db_data:ro
      - rag_db_data:/data/rag_db_data:ro
      - meili_data:/data/meili_data:ro
      - clickhouse_data:/data/clickhouse_data:ro
      - redis-streams-data:/data/redis-streams-data:ro
      - oauth_token_data:/data/oauth_token_data:ro
      - prometheus_data:/data/prometheus_data:ro
      - grafana_data:/data/grafana_data:ro
      - pact_db_data:/data/pact_db_data:ro
      # Backup scripts
      - ../scripts/backup:/scripts:ro
    networks:
      - alt-network
    profiles:
      - backup
    labels:
      rask.group: backup
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "restic", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
