# compose/mq.yaml - Message Queue services
# Redis Streams (8.4) and mq-hub event broker

include:
  - base.yaml

services:
  # Redis 8.4 for event streaming with multi-threaded I/O
  #
  # Pinned to a patch level, not the floating 8.4 tag: 8.4.0–8.4.3 carry an
  # upstream defect where approximate trimming (`MAXLEN ~`) combined with the
  # ACKED strategy deletes nothing at all, silently. The producer trims that
  # way on every XADD, so the articles stream grew past its cap unchecked until
  # the instance hit maxmemory under noeviction — at which point XADD is
  # rejected, and because trimming only runs as part of a successful XADD the
  # stream can no longer shrink itself. Fixed in 8.4.4; 8.4.5 is the published
  # alpine patch.
  redis-streams:
    image: redis:8.4.5-alpine
    container_name: redis-streams
    # docker/redis/entrypoint.sh (the redis_entrypoint config) hashes the
    # redis_streams_password and redis_limiter_password secrets into an ACL
    # file under /tmp and execs `redis-server --aclfile`: `default` is off and
    # the `streams` and `limiter` users are each held to their own keys and
    # commands. It replaces the official docker-entrypoint.sh, so nothing
    # chowns /data or drops root via gosu — the user is stated here, and /data
    # on the existing named volume must already belong to redis.
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /entrypoint.sh
      - streams
    command:
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --io-threads
      - "4"
      - --io-threads-do-reads
      - "yes"
    volumes:
      - redis-streams-data:/data
    configs:
      - source: redis_entrypoint
        target: /entrypoint.sh
        mode: 0555
    networks:
      - alt-network
    secrets:
      - redis_streams_password
      - redis_limiter_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_streams_password)\" redis-cli --user streams ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    labels:
      - rask.group=redis-streams
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # mq-hub event broker service
  mq-hub:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-mq-hub:${IMAGE_TAG:-main}
    build:
      context: ../mq-hub
      dockerfile: Dockerfile
    container_name: mq-hub
    mem_limit: 128m
    environment:
      - REDIS_URL=redis://streams@redis-streams:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_streams_password
      - CONNECT_PORT=9500
      - MQHUB_AUTH_TOKEN_FILE=/run/secrets/mqhub_auth_token
      - LOG_LEVEL=info
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=mq-hub
      - REDIS_POOL_SIZE=50
      - STREAM_MAX_LEN=10000
      # Backstop for the case STREAM_MAX_LEN cannot cover: trimming carried on
      # XADD only runs as part of a successful XADD, and XADD is rejected once
      # the instance is at maxmemory under noeviction — so the streams could not
      # shrink back under their cap without an operator. XTRIM is not denyoom,
      # so a periodic pass keeps working precisely then. The ceiling sits well
      # above STREAM_MAX_LEN because it ignores consumer references: it firing at
      # all means the publish-time trim failed to keep up, and it logs loudly.
      - STREAM_HARD_MAX_LEN=${MQ_HUB_STREAM_HARD_MAX_LEN:-50000}
      - STREAM_TRIM_INTERVAL_SECONDS=${MQ_HUB_STREAM_TRIM_INTERVAL_SECONDS:-60}
    depends_on:
      redis-streams:
        condition: service_healthy
    networks:
      - alt-network
    ports:
      # Authenticated RPC access remains loopback-only on the host.
      - "127.0.0.1:9500:9500"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9500/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - redis_streams_password
      - mqhub_auth_token
    restart: unless-stopped
    labels:
      - rask.group=mq-hub
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-streams-data:
