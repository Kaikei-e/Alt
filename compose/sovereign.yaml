# compose/sovereign.yaml - Knowledge Sovereign service + DB

services:
  knowledge-sovereign-db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - POSTGRES_DB=knowledge_sovereign
      - POSTGRES_USER=sovereign
      - POSTGRES_PASSWORD_FILE=/run/secrets/sovereign_db_password
    volumes:
      - knowledge-sovereign-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5438:5432"
    secrets:
      - sovereign_db_password
    networks:
      - alt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d knowledge_sovereign"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Atlas migrator for knowledge-sovereign-db
  knowledge-sovereign-db-migrator:
    build:
      context: ../knowledge-sovereign
      dockerfile: docker/Dockerfile.migrator
    # Short-lived Atlas apply job.
    mem_limit: 256m
    command: ["apply"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        DB_PASS=$$(cat /run/secrets/sovereign_db_password)
        export DATABASE_URL="postgres://$${DB_USER}:$${DB_PASS}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=disable"
        exec /scripts/migrate.sh "$$@"
      - --
    environment:
      DB_HOST: knowledge-sovereign-db
      DB_PORT: "5432"
      DB_USER: sovereign
      DB_NAME: knowledge_sovereign
      ATLAS_REVISIONS_SCHEMA: "public"
    secrets:
      - sovereign_db_password
    volumes:
      - ../knowledge-sovereign/migrations:/migrations:ro
    depends_on:
      knowledge-sovereign-db:
        condition: service_healthy
    networks:
      - alt-network
    restart: "no"

  knowledge-sovereign:
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-knowledge-sovereign:${IMAGE_TAG:-main}
    build:
      context: ../knowledge-sovereign
      dockerfile: Dockerfile.sovereign
    restart: unless-stopped
    mem_limit: 512m
    # DATABASE_URL is assembled at runtime from the sovereign_db_password secret
    # (same entrypoint-wrapper pattern as knowledge-sovereign-db-migrator
    # above) instead of being interpolated into `environment:`, where it
    # would leak the plaintext password via `docker inspect`. The app's
    # config.Load() (knowledge-sovereign/app/config/config.go) only reads
    # os.Getenv("DATABASE_URL"), so no Go code changes are needed — the
    # shell wrapper builds the same value the process would have received.
    entrypoint:
      - /bin/sh
      - -c
      - |
        DB_PASS=$$(cat /run/secrets/sovereign_db_password)
        export DATABASE_URL="postgres://sovereign:$${DB_PASS}@knowledge-sovereign-db:5432/knowledge_sovereign?sslmode=disable"
        exec /server
    environment:
      - LISTEN_ADDR=:9500
      - METRICS_ADDR=:9501
      # Bearer token for /admin/* on the metrics port (snapshot writer,
      # retention exporter, storage stats). Startup fails if this file is
      # missing — running the admin surface open requires ADMIN_AUTH=disabled.
      - ADMIN_TOKEN_FILE=/run/secrets/sovereign_admin_token
      # deploy order: clients (alt-backend ×3, rag-orchestrator, recap-worker) first with the token, then enable the provider
      - EVENT_TOKEN_FILE=/run/secrets/sovereign_event_token
      - EVENT_AUTH=${SOVEREIGN_EVENT_AUTH_MODE:-}
      - EVENT_AUTH_POLICY_FILE=/config/event-auth-policy.json
      - USER_JWT_INTROSPECTION_URL=https://auth-hub:9443/internal/token/introspect
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - SNAPSHOT_DIR=/tmp/snapshots
      - KNOWLEDGE_SOVEREIGN_PLANNER_BATCH_SIZE=${KNOWLEDGE_SOVEREIGN_PLANNER_BATCH_SIZE:-8192}
      - KNOWLEDGE_SOVEREIGN_PLANNER_MAX_BATCHES_PER_TICK=${KNOWLEDGE_SOVEREIGN_PLANNER_MAX_BATCHES_PER_TICK:-8}
      # ADR-000914 §Δ5: Knowledge Loop projector throughput. Defaults are
      # 500 events / batch × 4 batches per 5 s tick = 400 events / sec.
      # Bump KNOWLEDGE_SOVEREIGN_LOOP_PROJECTOR_MAX_BATCHES_PER_TICK to ~20
      # during a reproject to hit ~2 000 events / sec without a code
      # change; revert after the run so steady-state stays bounded.
      - KNOWLEDGE_SOVEREIGN_LOOP_PROJECTOR_BATCH_SIZE=${KNOWLEDGE_SOVEREIGN_LOOP_PROJECTOR_BATCH_SIZE:-500}
      - KNOWLEDGE_SOVEREIGN_LOOP_PROJECTOR_MAX_BATCHES_PER_TICK=${KNOWLEDGE_SOVEREIGN_LOOP_PROJECTOR_MAX_BATCHES_PER_TICK:-4}
    ports:
      # :9500 serves the event-log RPC (ListKnowledgeEvents /
      # AppendKnowledgeEvent) with bearer token auth (EVENT_TOKEN_FILE), and :9501 the
      # admin surface. Both are east-west only; loopback bind keeps altctl
      # working from this host without publishing them on every NIC.
      - "127.0.0.1:9510:9500"
      - "127.0.0.1:9511:9501"
    volumes:
      # Projection snapshots (knowledge_home_items / today_digest_view /
      # recall_candidate_view as .jsonl.gz). Same host-path rule as
      # recap-subworker's /app/data: a path relative to this compose file
      # resolves into the deploy runner's per-job checkout, which the next
      # job deletes — and retention only checks the snapshot *row*, so it
      # would keep archiving events against a payload that is gone. No
      # read_only: this is the write sink. A bind rather than a named volume
      # because the image's /tmp/snapshots is root:root 0755 while the
      # process runs as nonroot ([[000585]] / [[000765]]).
      - type: bind
        source: ${KNOWLEDGE_SOVEREIGN_SNAPSHOTS_HOST_PATH:-/var/lib/alt-knowledge-sovereign-snapshots}
        target: /tmp/snapshots
        bind:
          create_host_path: false
      - type: bind
        source: ../knowledge-sovereign/config/event-auth-policy.json
        target: /config/event-auth-policy.json
        read_only: true
        bind:
          create_host_path: false
      - knowledge_sovereign_certs:/certs:ro
      - pki_trust_bundle:/trust:ro
    secrets:
      - sovereign_db_password
      - sovereign_admin_token
      - sovereign_event_token
      - sovereign_backend_token
      - sovereign_operator_token
      - sovereign_datahub_token
      - sovereign_harvester_token
      - sovereign_rag_token
      - sovereign_recap_token
    depends_on:
      knowledge-sovereign-db:
        condition: service_healthy
      knowledge-sovereign-db-migrator:
        condition: service_completed_successfully
      pki-agent-knowledge-sovereign:
        condition: service_healthy
    networks:
      - alt-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9501/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  pki-agent-knowledge-sovereign:
    build:
      context: ../pki-agent
      dockerfile: Dockerfile
    user: "root"
    entrypoint: ["/usr/local/bin/pki-agent"]
    environment:
      CERT_SUBJECT: knowledge-sovereign
      CERT_SANS: "knowledge-sovereign,localhost"
      STEP_CA_URL: https://step-ca:9000
      STEP_CA_ROOT_FILE: /trust/ca-bundle.pem
      STEP_CA_PROVISIONER: pki-agent-knowledge-sovereign
      STEP_CA_PROVISIONER_PASSWORD_FILE: /run/secrets/pki-agent-knowledge-sovereign-jwk
      CERT_PATH: /certs/svc-cert.pem
      KEY_PATH: /certs/svc-key.pem
      CERT_OWNER_UID: "65532"
      CERT_OWNER_GID: "65532"
      RENEW_AT_FRACTION: "0.66"
      TICK_INTERVAL: "5m"
      METRICS_ADDR: ":9510"
    volumes:
      - knowledge_sovereign_certs:/certs
      - pki_trust_bundle:/trust:ro
    secrets:
      - pki-agent-knowledge-sovereign-jwk
    depends_on:
      step-ca:
        condition: service_healthy
      step-ca-bootstrap:
        condition: service_completed_successfully
    networks:
      - alt-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/pki-agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  knowledge-sovereign-db-data:
