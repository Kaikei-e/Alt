# compose/ai.yaml - AI/LLM services
# news-creator (FastAPI app), news-creator-backend (Ollama), pre-processor, redis-cache
# Enrollment is in-process (PKI_ENROLLMENT=enabled). No pki-agent sidecar.

include:
  - base.yaml
  - pki.yaml

x-pki-cert-volume-chown-distroless: &pki-cert-volume-chown-distroless
  image: alpine:3.21
  user: "0:0"
  command:
    - sh
    - -c
    - mkdir -p /certs && chown -R 65532:65532 /certs && chmod 0750 /certs

x-pki-cert-volume-chown-appuser: &pki-cert-volume-chown-appuser
  image: alpine:3.21
  user: "0:0"
  command:
    - sh
    - -c
    - mkdir -p /certs && chown -R 1000:1000 /certs && chmod 0750 /certs

services:
  # Redis cache for news-creator recap summaries
  redis-cache:
    image: redis:8.0.2-alpine
    container_name: redis-cache
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    networks:
      - alt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - rask.group=redis-cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama server (separated from news-creator for faster deployments)
  news-creator-backend:
    container_name: news-creator-backend
    mem_limit: 8g
    env_file:
      - ../.env
    build:
      context: ../news-creator
      dockerfile: Dockerfile.backend
    # GPU Configuration: runtime + deploy.resources for maximum compatibility
    # See: https://docs.docker.com/compose/how-tos/gpu-support/
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # /usr/lib/ollama must come first: libggml-cuda.so (in cuda_v12/cuda_v13) links
      # against libggml-base.so.0, which lives in /usr/lib/ollama itself. Without it on
      # the path, the CUDA backend fails to dlopen and Ollama silently falls back to CPU.
      - LD_LIBRARY_PATH=/usr/lib/ollama:/usr/lib/ollama/cuda_v12:/usr/lib/ollama/cuda_v13:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      - OLLAMA_HOME=/home/ollama-user/.ollama
      - OLLAMA_MODELS=/home/ollama-user/.ollama
      - OLLAMA_HOST=0.0.0.0:11435
      # Gemma4:E4B — 4.5B effective, Google QAT Q4_0 (~5.15GB), 128K context
      # Set OLLAMA_BASE_MODEL=gemma3:4b-it-qat for rollback to Gemma3
      # FORCE_MODEL_REFRESH=1 is a destructive one-shot (ollama rm + re-download).
      # Always return to 0 after a successful refresh — leaving it at 1 wipes models on every restart.
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-gemma4-e4b-q4km}
      - FORCE_MODEL_REFRESH=${FORCE_MODEL_REFRESH:-0}
      # Optional: pin expected GGUF digest (Google QAT Q4_0). Empty = log-only verify.
      - GGUF_SHA256_EXPECTED=${GGUF_SHA256_EXPECTED:-676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee}
      # Same pin for the ggml-org MTP draft head that drives speculative decoding.
      - MTP_SHA256_EXPECTED=${MTP_SHA256_EXPECTED:-d19a11e4fd5019967d9296f77f4d3e139c8903909f70c3a9cf009c9af4b9b88d}
      # KV cache precision. q8_0 saves only 134 MiB here — Gemma 4 E4B keeps KV on
      # just 24 of 42 layers and sizes 20 of those by the 512-token sliding window
      # — and measured 21% SLOWER generation on CUDA (108 -> 131 tok/s switching to
      # f16), because the dequantization cost outweighs the bandwidth saved at this
      # cache size. f16 also keeps the MTP draft cache unquantized, which llama.cpp
      # #25725 reports as an acceptance-rate hazard.
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-f16}
      # RAG-dedicated mode: favor a single larger context slot over dual-slot concurrency
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # Allow the RAG generation model and the Meilisearch hybrid-search embedding
      # model to stay resident at the same time. The prior limit of 1 forced an
      # evict-and-reload cycle every time /search embedded the query, adding
      # several seconds of latency. Operators with tight GPU headroom can override
      # back to 1 via the .env value if the combined footprint does not fit.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      # Hold loaded models in VRAM until eviction, instead of unloading on idle.
      # With MAX_LOADED_MODELS=2 the qwen3-embedding model can stay co-resident
      # with the generation model, preventing the ~1.1s cold-start every time a
      # global search after a quiet period hits the embedder.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      # OLLAMA_FLASH_ATTENTION is deliberately left unset. On 0.32.14 an unset
      # value makes the runner pass `--flash-attn auto` whenever every GPU
      # supports it (CUDA compute >= 6.0, which this host's GPU satisfies) and lets
      # llama.cpp decide per model; setting it to 1 only replaces that check
      # with a forced "on".
    volumes:
      - news_creator_models:/home/ollama-user/.ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11435"
    networks:
      - alt-network
    # Wave 1b / P2-13: chown the named volume before the non-root
    # ollama-user (uid 2000) starts. alpine runs as root; idempotent.
    # Shares the service mounts, so rolling `up --no-deps --force-recreate`
    # still runs the hook (PM-2026-037).
    pre_start:
      - image: alpine:3.21
        user: "0:0"
        command:
          - sh
          - -c
          - mkdir -p /home/ollama-user/.ollama && chown -R 2000:2000 /home/ollama-user/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - rask.group=news-creator-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI application (lightweight, separated from Ollama)
  # Startup warms BAAI/bge-reranker-v2-m3 (~568M) on CPU; observed peak ~2.0GiB during
  # cold load (torch + HF fetch). 128m/512m/1g/2g all cgroup-OOM'd (die 137) on first
  # boot and broke on-the-fly summarize; steady-state settles ~0.9GiB after warmup.
  news-creator:
    container_name: news-creator
    mem_limit: 3g
    env_file:
      - ../.env
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-news-creator:${IMAGE_TAG:-main}
    build:
      context: ../news-creator
      dockerfile: Dockerfile
    environment:
      - LLM_SERVICE_URL=http://news-creator-backend:11435
      - LLM_MODEL=gemma4-e4b-12k
      - MODEL_ROUTING_ENABLED=false
      - LLM_KEEP_ALIVE_8K=24h
      - LLM_NUM_PREDICT=${LLM_NUM_PREDICT:-1200}
      - SUMMARY_NUM_PREDICT=${SUMMARY_NUM_PREDICT:-1200}
      # Concurrency: sync with OLLAMA_NUM_PARALLEL in news-creator-backend
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # LLM context window size. Must match the num_ctx baked into the
      # gemma4-e4b-12k Modelfile: every client of the shared Ollama runner
      # (news-creator, Ask Augur proxy, acolyte-orchestrator) must send the
      # same num_ctx or the runner reloads on each alternation (ADR-579).
      - LLM_NUM_CTX=${LLM_NUM_CTX:-12288}
      # 8K-only mode: disable 60K model, use hierarchical map-reduce for large documents
      - MODEL_60K_ENABLED=${MODEL_60K_ENABLED:-false}
      # Hierarchical summarization thresholds: chunking trigger and max chunk size for map-reduce
      - HIERARCHICAL_THRESHOLD_CHARS=${HIERARCHICAL_THRESHOLD_CHARS:-8000}
      - HIERARCHICAL_CHUNK_MAX_CHARS=${HIERARCHICAL_CHUNK_MAX_CHARS:-6000}
      # Cache settings
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_REDIS_URL=redis://redis-cache:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      # Hybrid RT/BE scheduling for TTFT optimization
      # RT slot reserved for streaming requests, BE slot for batch processing
      - SCHEDULING_RT_RESERVED_SLOTS=${SCHEDULING_RT_RESERVED_SLOTS:-1}
      - SCHEDULING_AGING_THRESHOLD_SECONDS=${SCHEDULING_AGING_THRESHOLD_SECONDS:-60}
      - SCHEDULING_PRIORITY_PROMOTION_THRESHOLD_SECONDS=${SCHEDULING_PRIORITY_PROMOTION_THRESHOLD_SECONDS:-120}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-10}
      # LIFO scheduling: newest summary requests processed first (swipe-feed optimization)
      - SCHEDULING_RT_MODE=${SCHEDULING_RT_MODE:-lifo}
      # Distributed BE dispatch: offload batch summarization to remote Ollama instances
      - DISTRIBUTED_BE_ENABLED=${DISTRIBUTED_BE_ENABLED:-false}
      - DISTRIBUTED_BE_REMOTES=${DISTRIBUTED_BE_REMOTES:-}
      - DISTRIBUTED_BE_HEALTH_INTERVAL_SECONDS=${DISTRIBUTED_BE_HEALTH_INTERVAL_SECONDS:-30}
      - DISTRIBUTED_BE_TIMEOUT_SECONDS=${DISTRIBUTED_BE_TIMEOUT_SECONDS:-300}
      - DISTRIBUTED_BE_COOLDOWN_SECONDS=${DISTRIBUTED_BE_COOLDOWN_SECONDS:-60}
      - DISTRIBUTED_BE_REMOTE_MODEL=${DISTRIBUTED_BE_REMOTE_MODEL:-gemma4-e4b-q4km}
      - DISTRIBUTED_BE_MODEL_OVERRIDES=${DISTRIBUTED_BE_MODEL_OVERRIDES:-}
      # Wave 4: inbound TLS is in-process on news-creator FastAPI :11434
      # (Ollama on :11435 is an upstream, not the mTLS parent). Identity
      # comes from the verified client cert; never from a caller-supplied
      # header.
      - INBOUND_MTLS=true
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - MTLS_ALLOWED_PEERS=${NEWS_CREATOR_MTLS_ALLOWED_PEERS:-recap-worker,acolyte-orchestrator,rag-orchestrator,recap-evaluator}
      - PEER_IDENTITY_TRUSTED=off
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=news-creator
      - CERT_SANS=news-creator,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-news-creator
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-news-creator-jwk
      - RENEW_AT_FRACTION=0.66
      - OPS_LISTEN=:9110
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=news-creator
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - alt-network
    secrets:
      - pki-agent-news-creator-jwk
    volumes:
      - news_creator_certs:/certs
      - pki_trust_bundle:/trust:ro
    pre_start:
      - <<: *pki-cert-volume-chown-appuser
    depends_on:
      news-creator-backend:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      step-ca-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cross-encoder warmup (+ optional HF fetch) routinely exceeds 30s.
      start_period: 180s
    labels:
      - rask.group=news-creator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pre-processor:
    env_file:
      - ../.env
    mem_limit: 128m
    image: ghcr.io/${GHCR_OWNER:-kaikei-e}/alt-pre-processor:${IMAGE_TAG:-main}
    build:
      context: ../pre-processor
      dockerfile: Dockerfile
    depends_on:
      redis-streams:
        condition: service_healthy
      pre-processor-db:
        condition: service_healthy
      pre-processor-db-migrator:
        condition: service_completed_successfully
      step-ca-bootstrap:
        condition: service_completed_successfully
    environment:
      - MTLS_LISTEN=${MTLS_LISTEN:-true}
      - MTLS_PORT=9443
      - MTLS_CERT_FILE=/certs/svc-cert.pem
      - MTLS_KEY_FILE=/certs/svc-key.pem
      - MTLS_CA_FILE=/trust/ca-bundle.pem
      - MTLS_CLIENT_AUTH=${PRE_PROCESSOR_MTLS_CLIENT_AUTH:-}
      - MTLS_ALLOWED_PEERS=${PRE_PROCESSOR_MTLS_ALLOWED_PEERS:-}
      - PKI_ENROLLMENT=enabled
      - CERT_SUBJECT=pre-processor
      - CERT_SANS=pre-processor,localhost
      - CERT_PATH=/certs/svc-cert.pem
      - KEY_PATH=/certs/svc-key.pem
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_ROOT_FILE=/trust/ca-bundle.pem
      - STEP_CA_PROVISIONER=pki-agent-pre-processor
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/run/secrets/pki-agent-pre-processor-jwk
      - RENEW_AT_FRACTION=0.66
      - OPS_LISTEN=:9110
      # Outbound mTLS to the data plane. The data plane and /v1/internal
      # moved out of alt-backend in the 3-binary split
      # (ADR-000954): cmd/backend opens no mTLS listener at all, and
      # cmd/datahub is the only process serving that surface, as
      # `services.datahub.v1.DataHubService`. The leaf this
      # container presents has CN/SAN `pre-processor`, which is in
      # alt-data-hub's DATAHUB_ALLOWED_PEERS (compose/core.yaml).
      - MTLS_ENFORCE=${PRE_PROCESSOR_MTLS_ENFORCE:-true}
      - BACKEND_API_MTLS_URL=https://alt-data-hub:9443
      # bootstrap/wire.go pins tls.Config.ServerName from this, so it must be
      # the SAN alt-data-hub mints in-process (CERT_SANS=alt-data-hub,localhost).
      - BACKEND_MTLS_SERVER_NAME=alt-data-hub
      # Plaintext fallback used only when MTLS_ENFORCE is off. :9102 is
      # alt-backend's operator listener and carries no data plane at all —
      # `services.datahub.v1.DataHubService` is alt-data-hub's, over mTLS only.
      # See the note in compose/core.yaml.
      - BACKEND_API_URL=http://alt-backend:9102
      - ALT_BACKEND_HOST=http://alt-backend:9102
      # Pre-processor dedicated DB (ADR-000246)
      - PP_DB_HOST=pre-processor-db
      - PP_DB_PORT=5432
      - PP_DB_NAME=${PP_DB_NAME:-pre_processor}
      - PP_DB_USER=${PP_DB_USER:-pp_user}
      - PP_DB_PASSWORD_FILE=/run/secrets/pp_db_password
      - LOG_LEVEL=info
      - SERVICE_NAME=pre-processor
      - REDIS_STREAMS_URL=redis://redis-streams:6379
      - CONSUMER_ENABLED=true
      - CONSUMER_GROUP=pre-processor-group
      - CONSUMER_NAME=pre-processor-1
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rask-log-aggregator:4318
      - OTEL_SERVICE_NAME=pre-processor
    secrets:
      - pp_db_password
      - pki-agent-pre-processor-jwk
    restart: always
    ports:
      # East-west surfaces. Loopback bind so the only cross-host entrance is
      # the mTLS :9443, which is what enforces the peer identity; east-west
      # callers reach these over the container DNS name, not the host.
      - "127.0.0.1:9200:9200" # REST API
      - "127.0.0.1:9202:9202" # Connect-RPC
      # mTLS :9443 intentionally not published (internal east-west only)
    networks:
      - alt-network
    volumes:
      - pre_processor_certs:/certs
      - pki_trust_bundle:/trust:ro
    pre_start:
      - <<: *pki-cert-volume-chown-distroless
    healthcheck:
      test: ["CMD", "/pre-processor", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - rask.group=pre-processor
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-cache-data:
