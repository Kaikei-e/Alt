# PostgreSQL configuration for RAG database
# pgvector extension only (no pg_cron)

# SSLはローカル環境では無効化
ssl = off

# 基本設定 (pg_cron なし - pgvector のみ使用)
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB

# ログ設定
log_connections = on
log_disconnections = on
log_statement = 'all'

# Idle-in-transaction timeout. The index upsert holds its transaction open
# while the embedder call runs (EMBEDDER_TIMEOUT=60s), so this must stay
# above that ceiling or large articles abort with SQLSTATE 25P03.
idle_in_transaction_session_timeout = '120s'
