# PostgreSQL configuration for RAG database
# pgvector extension only (no pg_cron)

# SSLはローカル環境では無効化
ssl = off

# 基本設定 (pg_cron なし - pgvector のみ使用)
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory. The container is capped at mem_limit 4096m (compose/rag.yaml), so
# every value below is sized against 4GB rather than host RAM.
# 25% of the container limit — the dedicated-server starting point in the PostgreSQL docs.
shared_buffers = 1GB
# Planner hint only: cache reachable from this cgroup, so below PG 18's 4GB default.
effective_cache_size = 3GB
# RRF sorts and the iterative-scan buffer (hnsw.scan_mem_multiplier x work_mem); the app pool caps concurrency at DB_MAX_CONNS=20.
work_mem = 32MB
# HNSW builds are much faster while the graph fits here, and the parallel build allocates it in shared memory (shm_size 2g).
maintenance_work_mem = 1GB
# Without this each autovacuum worker inherits maintenance_work_mem, and three of them would blow the container limit.
autovacuum_work_mem = 128MB
# pgvector's recommended HNSW build parallelism (PostgreSQL default is 2); max_parallel_workers stays at its default 8.
max_parallel_maintenance_workers = 7

# pgvector search defaults. Both GUCs are PGC_USERSET, so PostgreSQL holds them
# as placeholders here and converts them when the extension loads.
# HNSW returns at most ef_search rows, so the default 40 truncated every query whose LIMIT was higher (Search() asks for up to 500).
hnsw.ef_search = 100
# Keeps scanning past ef_search until the LIMIT is satisfied; relaxed order is safe because every caller re-sorts by distance.
hnsw.iterative_scan = 'relaxed_order'

# ログ設定
log_connections = on
log_disconnections = on
# rag-db は記事本文とそのチャンクを持つ。'all' はそれをリテラルごとコンテナログに
# 落とし、rask forwarder 群が /var/lib/docker/containers から読める。db / kratos-db
# 側 (postgresql.conf) と同じ判断で、スキーマ変更の追跡だけ残す。遅いクエリの
# 可視性は次行の閾値で担保する（閾値超過分は文面が出るので完全な遮断ではない）。
log_statement = 'ddl'
log_min_duration_statement = 200

# Idle-in-transaction timeout. The index upsert now embeds BEFORE opening
# its transaction, so no code path holds a transaction across network I/O
# and the strict guard is safe again.
idle_in_transaction_session_timeout = '30s'
