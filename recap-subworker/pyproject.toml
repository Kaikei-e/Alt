[project]
name = "recap-subworker"
version = "0.1.0"
description = "Alt recap evidence clustering subworker"
requires-python = ">=3.14"
readme = "README.md"
authors = [{ name = "Alt Engineering" }]
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=22.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.3.0",
  "orjson>=3.11.6",
  "prometheus-fastapi-instrumentator>=8.0.0",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-logging>=0.66b2",
  "fastjsonschema==2.21.2",
  "sentence-transformers>=5.3.0",
  "pyyaml>=6.0.1",
  "sentencepiece>=0.2.0",
  "numpy>=2.0.0",
  # Pinned to the trained minor of the shipped genre_classifier joblib
  # artefacts (data/genre_classifier_ja.meta.json: sklearn_version 1.8.0).
  # recap_subworker.services.classifier._guard_metadata_against_runtime
  # fail-closes at startup on a minor-version mismatch (ADR-000835 stage 3);
  # bump this only together with retraining the artefacts.
  "scikit-learn>=1.8.0,<1.9.0",
  "scikit-optimize>=0.10.2",
  "pandas>=2.2.2",
  "umap-learn>=0.5.6",
  "scipy>=1.13.1",
  "hdbscan>=0.8.41",
  "optuna>=3.6.0",
  "structlog>=24.2.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  # In-process step-ca enrollment (Wave 4): JWE unwrap of the subject JWK + CSR.
  "cryptography>=44.0.0,<51",
  "jwcrypto>=1.5.6,<2",
  # >=3.10.4: CVE-2026-109956 WekaClassifier model path bypass, on top of
  # CVE-2026-79675 Stanford JVM argument injection and the 3.10.x batch.
  "nltk>=3.10.4",
  "spacy>=3.7.5",
  "janome>=0.5.0",
  "xxhash>=3.4.1",
  "statsmodels>=0.14.2",
  "trafilatura>=1.10.0",
  # 0.6.11 is the first release with pyo3 0.27 + Python 3.14 wheels.
  # 0.6.10 caps at cp310 and its source build pulls pyo3 0.23, which
  # rejects interpreters >= 3.14. Keep the floor here so uv can't
  # drift back down to 0.6.10 on a lock refresh.
  "sudachipy>=0.6.11",
  "sudachidict-core>=20240409",
  "transformers>=5.0.0",
  "torch>=2.3.0",
  "fugashi>=1.3.2",
  "unidic-lite>=1.0.8",
  "deepeval>=0.21.0",
  # gensim 4.4.0 has C extensions incompatible with Python 3.14 (PyLongObject ABI change)
  # Usage is optional (try/except in services/coherence.py) — re-add when gensim releases 3.14 wheels
  # "gensim>=4.3.0",
  "faiss-cpu>=1.7.4",
  "tbb>=2022.0",
]

[project.optional-dependencies]
distill = ["sentence-transformers>=5.3.0"]
onnx = ["onnxruntime>=1.19.0", "onnxruntime-tools>=1.7.0"]
train = [
  "cleanlab>=2.6.6",
  "datasets>=3.0.0",
  "imbalanced-learn>=0.12.3",
]
eval = [
  "bert-score>=0.3.13",
]

[project.scripts]
recap-subworker = "recap_subworker.__main__:main"

[tool.uv]
package = true
# numba floor prevents the resolver backtracking to pre-0.56 releases whose
# llvmlite pin predates Python 3.14 wheels when numpy is newer than numba's cap.
constraint-dependencies = ["certifi>=2026.10.19", "wheel>=0.46.2", "protobuf>=6.33.5", "Pillow>=13.0.0", "lxml-html-clean>=0.4.4", "aiohttp>=3.14.5", "cryptography>=50.0.0", "Pygments>=2.20.0", "onnx>=1.22.0", "numba>=0.64.0", "urllib3>=2.8.0", "multidict>=6.9.1", "Mako>=1.4.2", "fsspec>=2026.6.0", "pyasn1>=0.6.5"]

# Route torch to the PyTorch CPU wheel index. Without this, uv.lock resolves
# torch from PyPI and pulls cuda-bindings + nvidia-*-cu12 + triton (~5 GB) on
# linux/x86_64, which are useless in our CPU-only runtime image.
# Ref: https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.setuptools]
packages = ["recap_subworker"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pyrefly>=0.42.0",
  "ruff>=0.6.0",
  "pact-python>=3.2.1",
  "uvicorn>=0.32.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I",      # pycodestyle / pyflakes / isort
  "B",                     # flake8-bugbear
  "UP",                    # pyupgrade
  "SIM",                   # flake8-simplify
  "N",                     # pep8-naming
  "ANN",                   # flake8-annotations
  "S",                     # bandit
  "PTH",                   # pathlib
  "C4",                    # flake8-comprehensions
  "BLE",                   # blind-except
  "ASYNC",                 # async best practices
  "TRY",                   # tryceratops
  "RUF",                   # ruff-specific
  "PL",                    # pylint
  "DTZ",                   # flake8-datetimez
  "PT",                    # flake8-pytest-style
  "LOG",                   # flake8-logging
  "G",                     # flake8-logging-format
  "T20",                   # flake8-print
  "A",                     # flake8-builtins
  "RET",                   # flake8-return
  "PERF",                  # perflint
  "FAST",                  # fastapi
]
ignore = [
  "E501",                  # line length (formatter で扱う)
  "RUF001", "RUF002", "RUF003",  # 日本語 docstring/comment の confusable 警告は誤検出
]

[tool.ruff.lint.isort]
# learning_machine/data/ is gitignored, so it exists on a training host and
# not in a CI checkout. Without this, isort infers first-party membership
# from what happens to be on disk and classifies
# recap_subworker.learning_machine.data.* as third-party in CI only — the
# same source then passes locally and fails I001 on the runner.
known-first-party = ["recap_subworker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest uses bare assert
"**/test_*.py" = ["S101"]

[tool.pyrefly]
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist", "**/*.egg-info", "tests/**"]
python-version = "3.14"
replace-imports-with-any = [
    "torch.*", "transformers.*", "sentence_transformers.*",
    "sklearn.*", "scipy.*", "numpy.*", "pandas.*",
    "hdbscan.*", "umap.*", "optuna.*", "gensim.*",
    "faiss.*", "datasets.*", "spacy.*", "janome.*",
    "sudachipy.*", "fugashi.*", "deepeval.*",
    "imblearn.*", "statsmodels.*", "trafilatura.*",
    "cleanlab.*", "bert_score.*", "fastjsonschema.*",
]

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["perf: performance tests", "slow: slow smoke and end-to-end tests"]
