[project]
name = "utilizer"
version = "0.1.0"
description = "Real-time resource monitoring for Recap Job"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
    "websockets>=16.0",
    "psutil>=7.2.2",
]

[project.scripts]
utilizer = "utilizer.cli:main"
utilizer-web = "utilizer.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "S",     # bandit (security)
    "N",     # pep8-naming
    "ANN",   # annotations
    "PTH",   # use-pathlib
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
    "FAST",  # FastAPI
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "RUF001", # ambiguous unicode chars — intentional full-width Japanese punctuation
    "RUF002", # ambiguous unicode chars in docstrings — intentional Japanese text
    "RUF003", # ambiguous unicode chars in comments — intentional Japanese text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest uses bare assert
