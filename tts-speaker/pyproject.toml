[project]
name = "tts-speaker"
version = "0.1.0"
description = "Connect streaming gateway in front of Irodori-TTS-Server"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1,<0.29",
    "cryptography>=44.0.0,<51",
    "jwcrypto>=1.5.6,<2",
    "prometheus-client>=0.21.0",
    # Connect-RPC (typed service boundary)
    "connect-python>=0.9.0",
    "protobuf>=6.33.5,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pyrefly>=0.42.0",
    "ruff>=0.14.3,<0.15",
    "bandit>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyrefly]
project-includes = ["tts_speaker"]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist", "**/*.egg-info", "tests", "tests/**", "tts_speaker/gen/**"]
python-version = "3.14"

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info", "tts_speaker/gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
]
ignore = [
    "S101", # Use of assert detected (OK in tests)
    "E501", # Line too long (handled by formatter when possible)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S104", "S105", "S106", "S603", "S607", "S110"]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607", "S110"]
"tts_speaker/config/settings.py" = ["S104"]


[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__", "*.egg-info", "build", "dist"]
skips = ["B101", "B104"]
