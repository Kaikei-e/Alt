[project]
name = "tts-speaker"
version = "0.1.0"
description = "Connect streaming gateway in front of Irodori-TTS-Server"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1,<0.29",
    "cryptography>=44.0.0,<51",
    "jwcrypto>=1.5.6,<2",
    "prometheus-client>=0.21.0",
    # Connect-RPC (typed service boundary)
    "connect-python>=0.9.0",
    "protobuf>=6.33.5,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pyrefly>=0.42.0",
    "ruff>=0.14.3,<0.15",
    "bandit>=1.8.0",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19", "opentelemetry-api>=1.45.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyrefly]
project-includes = ["tts_speaker"]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist", "**/*.egg-info", "tests", "tests/**", "tts_speaker/gen/**"]
python-version = "3.14"

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info", "tts_speaker/gen"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "N",     # pep8-naming
    "ANN",   # annotations
    "S",     # bandit (security)
    "PTH",   # use-pathlib
    "C4",    # flake8-comprehensions
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
    "FAST",  # FastAPI
]
ignore = [
    "E501",   # Line too long (handled by formatter when possible)
    "RUF001", # ambiguous unicode chars in strings — intentional Japanese text
    "RUF002", # ambiguous unicode chars in docstrings — intentional Japanese text
    "RUF003", # ambiguous unicode chars in comments — intentional Japanese text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]


[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__", "*.egg-info", "build", "dist"]
skips = ["B101", "B104"]
