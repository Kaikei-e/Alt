      - "/recap-subworker"
      - "/recap-worker"
      - "/rerank-server"
      - "/search-indexer"
      - "/tag-generator"
      - "/tts-speaker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
