# Weekly version updates; minor and patch bumps arrive as one PR per ecosystem.
# Security updates are not grouped, so each advisory gets its own PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/alt-backend/app"
      - "/alt-backend/sidecar-proxy"
      - "/alt-butterfly-facade"
      - "/alt-perf/k6/mock-rss-server"
      - "/altctl"
      - "/auth-hub"
      - "/docker/inference-proxy"
      - "/docker/otel-relay"
      - "/docker/readonly-proxy"
      - "/knowledge-sovereign/app"
      - "/mq-hub/app"
      - "/pki-agent"
      - "/pre-processor-sidecar/app"
      - "/pre-processor-sidecar/cmd/credential-health-checker"
      - "/pre-processor/app"
      - "/proto/tools/protovis"
      - "/rag-orchestrator"
      - "/search-indexer/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # pgx v5.12.0 added Tx() to pgx.BatchResults. pgxmock v5.2.0, the newest
      # release, is built against pgx v5.11.0 and does not implement it, so
      # every module that uses pgxmock stops compiling. Drop this once a
      # pgxmock release implements BatchResults.Tx.
      - dependency-name: "github.com/jackc/pgx/v5"
        versions: [">= 5.12.0"]
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directories:
      - "/plecto"
      - "/rask-log-aggregator/app"
      - "/rask-log-forwarder/app"
      - "/recap-worker/recap-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "uv"
    directories:
      - "/acolyte-orchestrator"
      - "/dashboard"
      - "/metrics"
      - "/monitors/utilizer"
      - "/news-creator/app"
      - "/recap-evaluator"
      - "/recap-subworker"
      - "/rerank-server"
      - "/scripts"
      - "/tag-generator/app"
      - "/tts-speaker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      uv:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "bun"
    directory: "/alt-frontend-sv"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # @playwright/test is pinned in three places that must move together:
      # alt-frontend-sv/package.json, e2e/playwright/package.json and
      # PLAYWRIGHT_IMAGE in .github/workflows/alt-frontend-sv.yml. Dependabot
      # can bump only one of them per PR, and the browsers baked into the
      # image then no longer match, so every such PR fails. Bump all three by
      # hand in one commit.
      - dependency-name: "@playwright/test"
    groups:
      bun:
        applies-to: version-updates
        patterns:
          - "*"
        # Biome minor releases promote and retune lint rules, so each one
        # needs `biome migrate` plus a pass over the new findings. Keep it in
        # its own PR so it cannot fail the rest of the group.
        exclude-patterns:
          - "@biomejs/biome"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/e2e/playwright"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # @playwright/test is pinned in three places that must move together:
      # alt-frontend-sv/package.json, e2e/playwright/package.json and
      # PLAYWRIGHT_IMAGE in .github/workflows/alt-frontend-sv.yml. Dependabot
      # can bump only one of them per PR, and the browsers baked into the
      # image then no longer match, so every such PR fails. Bump all three by
      # hand in one commit.
      - dependency-name: "@playwright/test"
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "deno"
    directories:
      - "/alt-perf"
      - "/auth-token-manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      deno:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directories:
      - "/acolyte-migration-atlas/docker"
      - "/acolyte-orchestrator"
      - "/alt-backend"
      - "/alt-backend/sidecar-proxy"
      - "/alt-butterfly-facade"
      - "/alt-frontend-sv"
      - "/alt-frontend-sv/tests/e2e/infra"
      - "/alt-perf"
      - "/alt-perf/k6/mock-rss-server"
      - "/auth-hub"
      - "/auth-token-manager"
      - "/compose/news-creator-ollama-stub"
      - "/dashboard"
      - "/db"
      - "/docker/backup"
      - "/docker/inference-proxy"
      - "/docker/otel-relay"
      - "/docker/postgres"
      - "/docker/readonly-proxy"
      - "/e2e/stubs/alt-backend-deps-stub"
      - "/e2e/stubs/recap-pipeline-stub"
      - "/irodori-tts"
      - "/knowledge-augur"
      - "/knowledge-embedder"
      - "/knowledge-sovereign"
      - "/knowledge-sovereign/docker"
      - "/migrations-atlas/docker"
      - "/mq-hub"
      - "/news-creator"
      - "/pki-agent"
      - "/pre-processor"
      - "/pre-processor-migration-atlas/docker"
      - "/pre-processor-sidecar"
      - "/rag-db"
      - "/rag-migration-atlas/docker"
      - "/rag-orchestrator"
      - "/rask-log-aggregator"
      - "/rask-log-forwarder"
      - "/recap-evaluator"
      - "/recap-migration-atlas/docker"
      - "/recap-subworker"
      - "/recap-worker"
      - "/rerank-server"
      - "/search-indexer"
      - "/tag-generator"
      - "/tts-speaker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directory: "/compose"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
