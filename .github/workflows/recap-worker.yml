name: Recap Worker CI

on:
  push:
    branches: [main, master]
    paths:
      - "recap-worker/**"
  pull_request:
    branches: [main, master]
    paths:
      - "recap-worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # large-packages does an apt-get remove/purge sweep (~2min); android/dotnet/haskell rm -rf already free most of the space
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # GitHub-hosted runner: dtolnay/rust-toolchain を使用
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable branch head, 2026-07-31
        with:
          toolchain: stable
          components: clippy

      # GitHub-hosted runner: Swatinem/rust-cache を使用
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: recap-worker/recap-worker
          shared-key: recap-worker
          cache-on-failure: true

      - name: Rust version info
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Run clippy
        working-directory: recap-worker/recap-worker
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: false

      - name: Run unit tests
        working-directory: recap-worker/recap-worker
        run: |
          cargo test --all --verbose -- --nocapture
        env:
          RUST_BACKTRACE: full
