name: CodeQL (Meta)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show CodeQL workflows
        run: |
          echo "CodeQL workflows are split by language:"
          echo "  - .github/workflows/codeql-go.yaml      # Go"
          echo "  - .github/workflows/codeql-ts.yaml      # TypeScript/JavaScript"
          echo "  - .github/workflows/codeql-python.yaml  # Python"
