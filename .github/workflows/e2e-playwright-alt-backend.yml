# alt-backend Playwright API E2E.
#
# Replaces the `alt-backend` job that lived in e2e-hurl.yml. It gets its own
# workflow rather than a job in that one because it is the only suite in the
# tree that fans out across a shard matrix, and a matrix job mixed into a file
# of one-job-per-service reads as an exception rather than as the shape.
#
# Like e2e-hurl.yml, this runs on every PR and every push to main with no path
# filtering: selective skipping by touched path lets a shared-wiring regression
# (compose.staging.yaml, fixtures, an upstream Go package, proto) land green
# because it matches no service path. Cost is bounded by building the images
# once and by importing the registry layer cache, not by skipping the suite.
#
# Shape:
#
#   build ──┬── shard 1/4 ──┐
#           ├── shard 2/4 ──┤
#           ├── shard 3/4 ──┼── merge-reports
#           └── shard 4/4 ──┘
#
# The build job runs buildx once and hands the three images to the shards as a
# single artifact. Before this split each shard would have repeated the same
# three builds — the dominant cost of the job, and one that does not
# parallelise away.

name: E2E Playwright (alt-backend)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-playwright-alt-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ci
  GHCR_OWNER: kaikei-e
  # No spec in this suite touches `page`/`browser`/`context`, so Playwright
  # never launches a browser. A node image is ~150MB against the Playwright
  # image's ~1.7GB, and skipping the browser download removes the largest
  # single item from cold-start.
  NODE_IMAGE: node:22-bookworm-slim
  SHARD_TOTAL: 4

jobs:
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `:buildcache` is the registry layer cache published by
      # docker-build.yaml on pushes to main. Importing it keeps this job from
      # rebuilding from scratch on each PR.
      #
      # BINARY selects ./cmd/<BINARY>; the Dockerfile fails the build when it
      # is unset rather than guessing. All three images come from the same Go
      # module and Dockerfile, and the dependency layers sit above
      # `ARG BINARY`, so builds 2 and 3 are nearly free once build 1 is warm.
      - name: Build alt-backend (cmd/backend)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            --build-arg BINARY=backend \
            -t ghcr.io/kaikei-e/alt-alt-backend:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-data-hub (cmd/datahub)
        # The slice runs the real data plane, not a stub: ADR-000954 Wave 3
        # made alt-data-hub the only owner of alt_db, so cmd/backend reaches
        # every row through it over mutual TLS.
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            --build-arg BINARY=datahub \
            -t ghcr.io/kaikei-e/alt-alt-data-hub:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-backend-deps-stub
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-alt-backend-deps-stub:ci \
            e2e/stubs/alt-backend-deps-stub

      - name: Export images
        run: |
          docker save \
            ghcr.io/kaikei-e/alt-alt-backend:ci \
            ghcr.io/kaikei-e/alt-alt-data-hub:ci \
            ghcr.io/kaikei-e/alt-alt-backend-deps-stub:ci \
            | zstd -T0 -3 -o /tmp/alt-backend-e2e-images.tar.zst

      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-backend-e2e-images
          path: /tmp/alt-backend-e2e-images.tar.zst
          retention-days: 1
          compression-level: 0  # already zstd-compressed

  test:
    name: shard ${{ matrix.shard }}/4
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: alt-backend-e2e-images
          path: /tmp

      - name: Load images
        run: zstd -dc /tmp/alt-backend-e2e-images.tar.zst | docker load

      - name: Pre-pull node image
        run: docker pull "$NODE_IMAGE"

      - name: Run shard
        env:
          # A distinct compose project per shard: the network is named after
          # the project, so this is what stops four shards from fighting over
          # the `alt-staging` network name if they ever share a daemon.
          STAGING_PROJECT_NAME: alt-staging-alt-backend-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/4
          # Blob reports merge into one HTML + one JUnit in the job below.
          PW_BLOB: 1
          RUN_ID: shard-${{ matrix.shard }}
          # Leave the stack up on failure so the dump step below can reach it;
          # the runner VM is discarded after the job anyway.
          KEEP_STACK: 1
        run: bash e2e/playwright/alt-backend/run.sh

      - name: Dump staging logs on failure
        if: failure()
        run: |
          # The suite runs against a rendered slice under mktemp -d that is
          # gone by now, so go through docker logs on the container names
          # compose derived from the project name.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-alt-backend-${{ matrix.shard }}" || true
          for svc in alt-backend alt-data-hub alt-backend-db alt-backend-db-migrator alt-backend-deps-stub; do
            echo "===== alt-staging-alt-backend-${{ matrix.shard }}-$svc-1 (tail=500) ====="
            docker logs --tail=500 "alt-staging-alt-backend-${{ matrix.shard }}-$svc-1" 2>&1 || true
          done

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-backend-blob-${{ matrix.shard }}
          path: e2e/reports/alt-backend-shard-${{ matrix.shard }}/blob
          retention-days: 3
          if-no-files-found: ignore

      - name: Wipe throwaway mTLS fixtures
        # run.sh's own trap skips this under KEEP_STACK=1 (the certificates are
        # still bind-mounted into a live container). The runner is ephemeral,
        # but private keys under the workspace would otherwise be in scope for
        # the artifact upload step of any later job.
        if: always()
        run: rm -rf e2e/fixtures/alt-backend/pki

      - name: Tear down staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml \
            -p alt-staging-alt-backend-${{ matrix.shard }} \
            --profile alt-backend down -v --remove-orphans || true

  merge-reports:
    name: Merge shard reports
    # `always()` so a failing shard still produces a merged report — that
    # report is the primary debugging artifact, and it is needed exactly when
    # the run is red.
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: alt-backend-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML + JUnit report
        run: |
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "no blob reports to merge (every shard failed before running)" >&2
            exit 0
          fi
          # The output locations are set through the reporters' own env vars
          # rather than through playwright.config.ts: merge-reports does not
          # load the config unless it is passed `-c`, so relying on the config
          # here would silently write to the defaults instead.
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD/e2e/playwright/alt-backend" \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report \
            -e PLAYWRIGHT_HTML_OPEN=never \
            -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml \
            "$NODE_IMAGE" \
            sh -euc '
              npm ci --no-audit --no-fund
              npx playwright merge-reports \
                --reporter html,junit \
                ../../../all-blob-reports
            '

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-backend-playwright-report
          path: |
            e2e/playwright/alt-backend/playwright-report
            e2e/playwright/alt-backend/results.xml
          retention-days: 7
          if-no-files-found: ignore
