name: BFF Tests

on:
  push:
    branches: [main]
    paths: ['alt-butterfly-facade/**', '.github/workflows/alt-butterfly-facade-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', 'scripts/altharness/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  pull_request:
    branches: [main]
    paths: ['alt-butterfly-facade/**', '.github/workflows/alt-butterfly-facade-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', 'scripts/altharness/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The BFF is the only authenticated hop between the browser and the
  # backend's internal surfaces, so its allowlist tests decide whether a
  # /services.* path can be proxied. They ran in no workflow.
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'alt-butterfly-facade'
      coverage-flags: 'alt-butterfly-facade'
      use-oidc: false
      sparse-checkout: 'alt-butterfly-facade'

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'alt-butterfly-facade'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
