name: TTS Speaker Quality Gates
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "tts-speaker/**"
      - ".github/workflows/tts-speaker.yml"
  pull_request:
    branches: [main]
    paths:
      - "tts-speaker/**"
      - ".github/workflows/tts-speaker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scope: tests/unit. tests/integration is marked @pytest.mark.integration and
  # downloads model weights, and tests/contract is covered by
  # proto-contract.yaml, which documents at its head why tts-speaker's provider
  # verification is deliberately excluded there.
  tests:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "tts-speaker"
      python-version: "3.12"
      sparse-checkout: "tts-speaker"
      coverage-flags: "tts-speaker"
      upload-coverage: true
      job-type: "test"
      test-command: "pytest -v tests/unit --cov=tts_speaker --cov-report=xml --junit-xml=tests/results.xml"
    permissions:
      contents: read
    secrets: inherit

  # NOTE: `lint`, `security` and `typecheck` job-types are deliberately absent,
  # and this records what is NOT gated rather than omitting it silently:
  #   - lint: `ruff check .` is clean, but the reusable job also runs
  #     `ruff format --check .`, where 6 files are unformatted. Enable this job
  #     in the same PR that reformats them.
  #   - typecheck: `pyrefly check` reports one pre-existing error
  #     (tts_speaker/infra/config.py:26, a Literal/Field inference limitation).
  #     Enable once that is resolved or explicitly suppressed.
  #   - security: bandit is not in tts-speaker's dependency group. ruff's `S`
  #     ruleset is not selected either, so no bandit rules run today.

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::tts-speaker tests failed"
            exit 1
          fi
          echo "tts-speaker quality gates passed"
