name: Search Indexer Tests

on:
  push:
    branches: [ main ]
    paths: [ 'search-indexer/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md' ]
  pull_request:
    branches: [ main ]
    paths: [ 'search-indexer/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'search-indexer/app'
      coverage-flags: 'search-indexer'
      use-oidc: false
      sparse-checkout: 'search-indexer'
