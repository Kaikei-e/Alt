name: Search Indexer Tests

on:
  push:
    branches: [ main ]
    paths: [ 'search-indexer/**', '.github/workflows/search-indexer.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md' ]
  pull_request:
    branches: [ main ]
    paths: [ 'search-indexer/**', '.github/workflows/search-indexer.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'search-indexer/app'
      coverage-flags: 'search-indexer'
      use-oidc: false
      sparse-checkout: 'search-indexer'

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'search-indexer/app'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
