name: MQ Hub Tests

on:
  push:
    branches: [main]
    paths: ['mq-hub/**', '.github/workflows/mq-hub-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', 'scripts/altharness/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  pull_request:
    branches: [main]
    paths: ['mq-hub/**', '.github/workflows/mq-hub-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', 'scripts/altharness/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # mq-hub publishes into the Redis Streams every downstream worker reads,
  # and its 14 test files ran in no workflow: it appeared in CI only via
  # proto-contract.yaml's Pact matrix, which does not run its unit tests.
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'mq-hub/app'
      coverage-flags: 'mq-hub'
      use-oidc: false
      sparse-checkout: 'mq-hub'

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'mq-hub/app'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
