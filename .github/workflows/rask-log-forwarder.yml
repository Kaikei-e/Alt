name: Rask Log Forwarder Tests
on:
  push:
    branches: [ main, master ]
    paths:
      - 'rask-log-forwarder/**'
      - 'compose/logging.yaml'
      - '.github/workflows/rask-log-forwarder.yml'
      - '.github/workflows/reusable-test-rust.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'rask-log-forwarder/**'
      - 'compose/logging.yaml'
      - '.github/workflows/rask-log-forwarder.yml'
      - '.github/workflows/reusable-test-rust.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-rust.yaml
    with:
      working-directory: 'rask-log-forwarder/app'
      coverage-flags: 'rask-log-forwarder'