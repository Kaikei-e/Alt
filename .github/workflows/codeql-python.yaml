name: CodeQL (Python)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "tag-generator/**"
      - "recap-subworker/**"
      - "monitors/utilizer/**"
      - "news-creator/**"
      - "dashboard/**"
      - "tts-speaker/**"
      - ".github/workflows/codeql-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main, master]
    paths:
      - "tag-generator/**"
      - "recap-subworker/**"
      - "monitors/utilizer/**"
      - "news-creator/**"
      - "dashboard/**"
      - "tts-speaker/**"
      - ".github/workflows/codeql-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: true

jobs:
  analyze-python:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Mask sensitive paths and git information
        run: |
          echo "::group::Masking Configuration"

          # Mask Runner Identity
          echo "::add-mask::$(hostname)"
          echo "::add-mask::$(whoami)"

          # Mask Absolute Paths
          [ -n "$HOME" ] && echo "::add-mask::$HOME"
          [ -n "$GITHUB_WORKSPACE" ] && echo "::add-mask::$GITHUB_WORKSPACE"
          [ -n "$RUNNER_TEMP" ] && echo "::add-mask::$RUNNER_TEMP"

          # Mask Git PII
          if command -v git >/dev/null 2>&1; then
            echo "::add-mask::$(git log -1 --pretty=format:'%an')"
            echo "::add-mask::$(git log -1 --pretty=format:'%ae')"
            echo "::add-mask::$(git log -1 --pretty=format:'%cn')"
            echo "::add-mask::$(git log -1 --pretty=format:'%ce')"
          fi

          echo "::endgroup::"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: python
          # 解析対象をさらに絞りたい場合は、paths/paths-ignore を調整してください
          # paths: tag-generator,recap-subworker,monitors/utilizer,news-creator,dashboard
          # paths-ignore: tmp,dist,.venv

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:python"
