name: Rag-orchestrator Quality Gates
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "rag-orchestrator/**"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "rag-orchestrator/**"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: "rag-orchestrator"
      coverage-flags: "rag-orchestrator"
      sparse-checkout: "rag-orchestrator"
      upload-coverage: true
    permissions:
      contents: read

  quality-gates:
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: "rag-orchestrator"
      upload-sarif: false
    permissions:
      contents: read
      security-events: write
