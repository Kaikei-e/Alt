name: News-Creator Quality Gates
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "news-creator/**"
      - "compose/ai.yaml"
      - "scripts/lint/**"
      - ".github/workflows/news-creator.yml"
      - ".github/workflows/reusable-test-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "news-creator/**"
      - "compose/ai.yaml"
      - "scripts/lint/**"
      - ".github/workflows/news-creator.yml"
      - ".github/workflows/reusable-test-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "news-creator/app"
      python-version: "3.14"
      sparse-checkout: |
        news-creator
        compose
      coverage-flags: "news-creator"
      job-type: "test"
      test-command: "pytest -v --cov=news_creator --cov-report=xml --junit-xml=tests/results.xml"
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "news-creator/app"
      python-version: "3.14"
      sparse-checkout: "news-creator"
      job-type: "lint"
    permissions:
      contents: read

  # NOTE: Pact CDC tests are handled in proto-contract.yaml
  # - Consumer tests trigger on contract/** changes
  # - Provider verification runs in pact-publish-and-verify job

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, lint]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
