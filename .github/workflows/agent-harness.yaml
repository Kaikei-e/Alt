name: agent-harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch origin/main
        run: git fetch --no-tags origin main

      - name: Run agent harness tests
        run: python3 scripts/tests/test-agent-harness.py

      - name: Run postmortem ledger tests
        run: python3 scripts/tests/test-postmortem-ledger.py

      - name: Run migration destructive gate tests
        run: python3 scripts/tests/test-migration-destructive-gate.py

      - name: Run agent harness checks
        env:
          TARGET: harness
        run: ./scripts/lint/run.sh "$TARGET"
