name: agent-harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: false

      - name: Resolve pinned buf version
        id: buf_version
        run: |
          buf_version="$(sed -n 's/^readonly BUF_VERSION="\([^"]*\)"/\1/p' scripts/lint/proto.sh | head -n 1)"
          test -n "$buf_version"
          echo "version=$buf_version" >> "$GITHUB_OUTPUT"

      - name: Set up Buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6  # v1.7.0
        with:
          setup_only: true
          version: ${{ steps.buf_version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install corpus and harness check tools
        # The Go race tests below run the real corpus (ast-grep, pyrefly) and
        # the pytest-rand runner (pytest), so these must be installed first.
        # Remove any adjacent `sg` shim installed by ast-grep-cli so /usr/bin/sg
        # is never shadowed.
        run: |
          python -m pip install --quiet 'pyrefly==1.1.1' 'ast-grep-cli==0.42.1' 'pytest==9.1.1'
          if ast_grep_bin="$(command -v ast-grep)"; then
            rm -f "$(dirname "$ast_grep_bin")/sg"
          elif [ -x "$HOME/.local/bin/ast-grep" ]; then
            rm -f "$HOME/.local/bin/sg"
          else
            echo "ast-grep binary not found after install" >&2
            exit 1
          fi

      - name: Run Go altharness race tests
        run: go -C scripts/altharness test -race -count=1 ./...

      - name: Resolve lint base
        id: lint_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "base=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent harness checks
        env:
          TARGET: harness
          LINT_BASE: ${{ steps.lint_base.outputs.base }}
        run: ./scripts/lint/run.sh "$TARGET"
