name: agent-harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Run agent harness tests
        run: python3 scripts/tests/test-agent-harness.py

      - name: Run postmortem ledger tests
        run: python3 scripts/tests/test-postmortem-ledger.py

      - name: Run migration destructive gate tests
        run: python3 scripts/tests/test-migration-destructive-gate.py

      - name: Install corpus check tools
        run: python -m pip install --quiet 'pyrefly==1.1.1'

      - name: Run agent harness checks
        env:
          TARGET: harness
          LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./scripts/lint/run.sh "$TARGET"
