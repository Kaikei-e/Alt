name: altctl Tests

on:
  push:
    branches: [main]
    paths: ['altctl/**', 'compose/**', 'kratos/**', 'pki-agent/scripts/bootstrap-pki-provisioner.sh', '.github/workflows/altctl-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  pull_request:
    branches: [main]
    paths: ['altctl/**', 'compose/**', 'kratos/**', 'pki-agent/scripts/bootstrap-pki-provisioner.sh', '.github/workflows/altctl-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # altctl is one of the two writers to the durable event store (ADR-000834)
  # and had 55 test files that no workflow referenced at all — grepping the
  # whole .github/workflows tree for its name returned nothing.
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'altctl'
      coverage-flags: 'altctl'
      use-oidc: false
      # altctl derives its stack registry and secret specs from the real
      # compose/*.yaml rather than a hardcoded table, and the tests assert
      # against those files by walking up to the repo root. A checkout of
      # altctl/ alone fails on the missing compose dir. (.altctl.yaml is also
      # read; cone mode checks out every root-level file already.) The secret
      # tests also read the PKI bootstrap script's SUBJECTS list.
      sparse-checkout: |
        altctl
        compose
        kratos
        pki-agent/scripts

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'altctl'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
