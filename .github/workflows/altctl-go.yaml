name: altctl Tests

on:
  push:
    branches: [main]
    paths: ['altctl/**', '.github/workflows/altctl-go.yaml']
  pull_request:
    branches: [main]
    paths: ['altctl/**', '.github/workflows/altctl-go.yaml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # altctl is one of the two writers to the durable event store (ADR-000834)
  # and had 55 test files that no workflow referenced at all — grepping the
  # whole .github/workflows tree for its name returned nothing.
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'altctl'
      coverage-flags: 'altctl'
      use-oidc: false
      # altctl derives its stack registry and secret specs from the real
      # compose/*.yaml rather than a hardcoded table, and the tests assert
      # against those files by walking up to the repo root. A checkout of
      # altctl/ alone fails on the missing compose dir. (.altctl.yaml is also
      # read; cone mode checks out every root-level file already.)
      sparse-checkout: |
        altctl
        compose
    secrets: inherit
