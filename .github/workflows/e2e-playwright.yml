# End-to-end Playwright suites, one job per service.
#
# Replaces e2e-hurl.yml (nine hand-written per-service jobs) and
# e2e-playwright-alt-backend.yml (the pilot's own file). Every suite under
# e2e/playwright/ now runs here.
#
# Shape
# -----
#
#   check ──────────────────────────────────────────────────────────────────┐
#                                                                           ▼
#   plan ──┬── single    (matrix over the unsharded suites: build + run) ──┬─> merge ──> verdict
#          │                                                               │
#          └── build ──> sharded (matrix over suite × shard)             ──┘
#
# `plan` derives all three matrices from e2e/playwright/suites.yaml, so the
# shard count lives next to the suite it describes rather than being duplicated
# here where it would drift. `plan` runs in parallel with `check` so image
# builds and suite execution do not wait on `npm ci` + static checks; `verdict`
# gates the workflow on `check` alongside the suite results.
#
# A suite that fans out gets its images built once and handed to its shards as
# an artifact; an unsharded suite builds in the job that runs it. Without that
# split a four-shard suite repeats the same three image builds four times —
# the dominant cost of the job, and one that does not parallelise away.
#
# No per-service path filtering, deliberately
# -------------------------------------------
# Every suite runs on every non-docs PR and push to main. Selective skipping by
# touched service path lets a shared-wiring regression (compose.staging.yaml, a
# fixture, an upstream Go package, proto) land green because it matched no
# service path. The single exception is the `paths-ignore` list on the triggers
# below for documentation and agent-config files, which never reach an image,
# fixture or test.

name: E2E Playwright

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - '**/README.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - '**/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ci
  GHCR_OWNER: kaikei-e
  # No spec in any of these suites touches `page`/`browser`/`context`, so
  # Playwright never launches a browser. A node image is ~150MB against the
  # Playwright image's ~1.7GB, and skipping the browser download removes the
  # largest single item from cold start.
  NODE_IMAGE: node:26-bookworm-slim

jobs:
  # Fast static check across every suite. Runs in parallel with `plan` and the
  # suite jobs (and gates `verdict`): it needs no Docker daemon, no compose
  # slice and no stack startup. It typechecks every suite and runs
  # `playwright test --list`, which loads each config, imports every spec,
  # resolves every fixture and reports the test tree. That catches a bad
  # import, an invalid project matcher, a missing fixture and a duplicate
  # title — everything except whether the assertions are true.
  check:
    name: Typecheck + load every suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json

      - name: Install
        working-directory: e2e/playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      - name: Check
        run: bash e2e/playwright/_lib/check-suites.sh

      - name: Check staging authentication fixtures offline
        run: |
          python3 e2e/playwright/_lib/security-wiring.test.py
          python3 e2e/playwright/_lib/auth-introspection.test.py
          node e2e/playwright/_lib/search-auth.test.cjs
          python3 e2e/playwright/_lib/staging-pki.test.py

  plan:
    name: Plan matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      single: ${{ steps.matrix.outputs.single }}
      shardedBuild: ${{ steps.matrix.outputs.shardedBuild }}
      shardedRun: ${{ steps.matrix.outputs.shardedRun }}
      hasSingle: ${{ steps.matrix.outputs.hasSingle }}
      hasSharded: ${{ steps.matrix.outputs.hasSharded }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Derive matrices from e2e/playwright/suites.yaml
        id: matrix
        run: python3 e2e/playwright/_lib/ci-matrix.py --github

  # ---------------------------------------------------------------------------
  # Unsharded suites: build the images and run the suite in one job.
  # ---------------------------------------------------------------------------
  single:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.hasSingle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.single) }}
    env:
      SUITE: ${{ matrix.suite }}
      # A distinct compose project per suite: the network is named after the
      # project, so this is what stops two jobs from fighting over a network
      # name if they ever share a daemon.
      STAGING_PROJECT_NAME: alt-staging-${{ matrix.suite }}
      # Leave the stack up on failure so the dump step below can reach it; the
      # runner VM is discarded after the job anyway.
      KEEP_STACK: 1
      PW_BLOB: 1
      RUN_ID: ${{ matrix.suite }}
      # suite.sh honours REPORT_DIR when it is already set. Pinning it here
      # keeps the upload path below from having to reconstruct the
      # `<suite>-<RUN_ID>` name suite.sh would otherwise derive.
      REPORT_DIR: ${{ github.workspace }}/e2e/reports/${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        # Reads suites.yaml for which images, services.yaml for how to build
        # each. The same command reproduces a CI build locally, which is the
        # point of it being a script rather than a workflow step.
        run: python3 e2e/playwright/_lib/build-images.py "$SUITE"

      - name: Warm the rust-bert model cache
        # recap-worker only. The staging stack runs on an `internal: true`
        # network, so rust-bert cannot reach HuggingFace from inside it.
        # Populate /opt/rustbert-cache on the runner host first; compose mounts
        # the same path read-only. recap's uid/gid are pinned to 999 in the
        # image, so the host directory must be chown'd to 999:999 for the
        # warmup container to write to it.
        if: matrix.suite == 'recap-worker'
        run: |
          sudo mkdir -p /opt/rustbert-cache
          sudo chown -R 999:999 /opt/rustbert-cache
          docker run --rm \
            -v /opt/rustbert-cache:/opt/rustbert-cache \
            "ghcr.io/${GHCR_OWNER}/alt-recap-worker:${IMAGE_TAG}" warmup

      - name: Pre-pull node image
        run: |
          for attempt in 1 2 3; do
            if docker pull "$NODE_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "docker pull $NODE_IMAGE attempt ${attempt}/3 failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
            fi
          done
          echo "docker pull $NODE_IMAGE failed after 3 attempts" >&2
          exit 1

      - name: Run suite
        run: bash "e2e/playwright/${SUITE}/run.sh"

      - name: Dump staging logs on failure
        if: failure()
        run: bash e2e/_lib/dump-project-logs.sh "$STAGING_PROJECT_NAME"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: blob-${{ matrix.suite }}
          path: e2e/reports/${{ matrix.suite }}/blob
          retention-days: 3
          compression-level: 0
          overwrite: true
          # `warn`, not `ignore`. A suite that ran and produced no blob is a
          # broken report pipeline, and `ignore` is what let exactly that stay
          # invisible: every suite wrote to a path the upload did not look at,
          # nine of them green, and the only symptom was a merge job cheerfully
          # reporting "no blob reports to merge".
          if-no-files-found: warn

      - name: Wipe throwaway mTLS fixtures
        # run.sh's own trap skips this under KEEP_STACK=1 (the certificates are
        # still bind-mounted into a live container). The runner is ephemeral,
        # but private keys under the workspace would otherwise be in scope for
        # the artifact upload step of any later job.
        if: always()
        run: rm -rf "e2e/fixtures/${SUITE}/pki"

      - name: Tear down staging stack
        if: always()
        run: bash e2e/_lib/teardown-project.sh "$STAGING_PROJECT_NAME"

  # ---------------------------------------------------------------------------
  # Sharded suites: build once, hand the images to every shard.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.suite }} images
    needs: plan
    if: needs.plan.outputs.hasSharded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.shardedBuild) }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: python3 e2e/playwright/_lib/build-images.py "$SUITE"

      - name: Export images
        run: |
          # The image list comes back out of the same manifest that drove the
          # build, so a suite that grows a fourth image needs no edit here for
          # that image to reach its shards.
          images="$(python3 e2e/playwright/_lib/build-images.py "$SUITE" --print-images)"
          echo "exporting: $images"
          # shellcheck disable=SC2086  # splitting the list into args is the point
          docker save $images | zstd -T0 -3 -o "/tmp/${SUITE}-images.tar.zst"

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: images-${{ matrix.suite }}
          path: /tmp/${{ matrix.suite }}-images.tar.zst
          retention-days: 1
          compression-level: 0  # already zstd-compressed
          overwrite: true

  sharded:
    name: ${{ matrix.suite }} shard ${{ matrix.shard }}
    needs: [plan, build]
    if: needs.plan.outputs.hasSharded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shardedRun) }}
    env:
      SUITE: ${{ matrix.suite }}
      STAGING_PROJECT_NAME: alt-staging-${{ matrix.suite }}-${{ matrix.index }}
      KEEP_STACK: 1
      PW_BLOB: 1
      SHARD: ${{ matrix.shard }}
      RUN_ID: ${{ matrix.suite }}-shard-${{ matrix.index }}
      REPORT_DIR: ${{ github.workspace }}/e2e/reports/${{ matrix.suite }}-shard-${{ matrix.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: images-${{ matrix.suite }}
          path: /tmp

      - name: Load images
        run: zstd -dc "/tmp/${SUITE}-images.tar.zst" | docker load

      - name: Pre-pull node image
        run: |
          for attempt in 1 2 3; do
            if docker pull "$NODE_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "docker pull $NODE_IMAGE attempt ${attempt}/3 failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
            fi
          done
          echo "docker pull $NODE_IMAGE failed after 3 attempts" >&2
          exit 1

      - name: Run shard
        run: bash "e2e/playwright/${SUITE}/run.sh"

      - name: Dump staging logs on failure
        if: failure()
        run: bash e2e/_lib/dump-project-logs.sh "$STAGING_PROJECT_NAME"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: blob-${{ matrix.suite }}-${{ matrix.index }}
          path: e2e/reports/${{ matrix.suite }}-shard-${{ matrix.index }}/blob
          retention-days: 3
          compression-level: 0
          overwrite: true
          # `warn`, not `ignore`. A suite that ran and produced no blob is a
          # broken report pipeline, and `ignore` is what let exactly that stay
          # invisible: every suite wrote to a path the upload did not look at,
          # nine of them green, and the only symptom was a merge job cheerfully
          # reporting "no blob reports to merge".
          if-no-files-found: warn

      - name: Wipe throwaway mTLS fixtures
        if: always()
        run: rm -rf "e2e/fixtures/${SUITE}/pki"

      - name: Tear down staging stack
        if: always()
        run: bash e2e/_lib/teardown-project.sh "$STAGING_PROJECT_NAME"

  # ---------------------------------------------------------------------------
  # One report for the whole fleet.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge reports
    # `always()` so a failing suite still produces a merged report — that
    # report is the primary debugging artifact, and it is needed exactly when
    # the run is red.
    if: always()
    needs: [single, sharded]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download every blob report
        # Degrades to a warning on download error because a report-merge failure must not mask passing suites.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p all-blob-reports-raw
          if ! gh run download "$GITHUB_RUN_ID" --pattern 'blob-*' --dir all-blob-reports-raw; then
            echo "::warning::Failed to download blob-* artifacts via gh run download; skipping HTML/JUnit report merge."
            echo "- :warning: **Report merge**: Failed to download \`blob-*\` artifacts; HTML/JUnit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Merge into one HTML + JUnit report
        run: |
          mkdir -p all-blob-reports
          if [ -d all-blob-reports-raw ]; then
            idx=0
            while IFS= read -r archive; do
              [ -n "$archive" ] || continue
              idx=$((idx + 1))
              parent="$(basename "$(dirname "$archive")")"
              if [ "$parent" = "all-blob-reports-raw" ]; then
                prefix="blob-single"
              else
                prefix="$parent"
              fi
              cp "$archive" "all-blob-reports/${prefix}-${idx}-$(basename "$archive")"
            done < <(find all-blob-reports-raw -type f -name '*.zip' | sort)
          fi
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "::warning::No Playwright blob reports found to merge."
            echo "- :warning: **Report merge**: No Playwright blob reports found to merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for attempt in 1 2 3; do
            if docker pull "$NODE_IMAGE"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "docker pull $NODE_IMAGE attempt ${attempt}/3 failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
            else
              echo "::warning::Failed to pull $NODE_IMAGE after 3 attempts; skipping HTML/JUnit report merge."
              echo "- :warning: **Report merge**: Failed to pull \`$NODE_IMAGE\` after 3 attempts; HTML/JUnit report was not generated." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # Two separate things make a fleet-wide merge work.
          #
          # `tag: '@<service>'` in each suite's config (Playwright 1.57+) plus
          # the `<prefix>-<idx>-` prefix staged above keep every blob filename
          # distinct when flattened into `all-blob-reports/`.
          #
          # `-c merge.config.ts` handles the other half: merge-reports refuses
          # blobs "recorded with different test directories", which assumes
          # blobs from shards of ONE config. Multiple suites have distinct
          # testDirs, so the merge needs a config naming where the tests really
          # live. Without it this job fails outright — as it did the first time
          # the blob uploads actually worked.
          #
          # The `github` reporter is emitted HERE and nowhere else. Playwright's
          # docs advise against it under a matrix strategy: with a dozen suites
          # in the matrix, one shared-fixture breakage would emit dozens of
          # duplicate inline annotations on the same lines. Merging first yields
          # exactly one annotation per real failure.
          #
          # Output locations go through the reporters' own env vars rather than
          # a config file: merge-reports does not load a config unless passed
          # `-c`, so relying on one here would silently write to the defaults.
          if ! docker run --rm \
            -v "$PWD:$PWD" -w "$PWD/e2e/playwright" \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report \
            -e PLAYWRIGHT_HTML_OPEN=never \
            -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml \
            -e PLAYWRIGHT_JUNIT_STRIP_ANSI=1 \
            "$NODE_IMAGE" \
            sh -euc '
              npm ci --no-audit --no-fund
              npx playwright merge-reports \
                -c merge.config.ts \
                --reporter html,junit,github \
                ../../all-blob-reports
            '; then
            echo "::warning::playwright merge-reports failed; HTML/JUnit report could not be built."
            echo "- :warning: **Report merge**: \`playwright merge-reports\` failed; HTML/JUnit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright/playwright-report
            e2e/playwright/results.xml
          retention-days: 3
          overwrite: true
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Final gate: fails the workflow if `check`, `plan`, or any suite/shard
  # failed or was cancelled.
  # ---------------------------------------------------------------------------
  verdict:
    name: Verdict
    if: ${{ !cancelled() }}
    needs: [check, plan, single, build, sharded, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHECK_RESULT: ${{ needs.check.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
      SINGLE_RESULT: ${{ needs.single.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      SHARDED_RESULT: ${{ needs.sharded.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
      HAS_SINGLE: ${{ needs.plan.outputs.hasSingle }}
      HAS_SHARDED: ${{ needs.plan.outputs.hasSharded }}
    steps:
      - name: Evaluate suite and check results
        run: |
          {
            echo "### E2E Playwright Verdict"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| check | \`${CHECK_RESULT}\` |"
            echo "| plan | \`${PLAN_RESULT}\` |"
            echo "| single | \`${SINGLE_RESULT}\` |"
            echo "| build | \`${BUILD_RESULT}\` |"
            echo "| sharded | \`${SHARDED_RESULT}\` |"
            echo "| merge | \`${MERGE_RESULT}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MERGE_RESULT" != "success" ]; then
            echo "::warning::Playwright report merge job ended with status '${MERGE_RESULT}'."
            echo "- :warning: **Report merge (\`${MERGE_RESULT}\`)**: Merge job did not succeed." >> "$GITHUB_STEP_SUMMARY"
          fi

          failed=0

          if [ "$CHECK_RESULT" != "success" ]; then
            echo "::error::check job did not succeed (result: ${CHECK_RESULT})"
            failed=1
          fi

          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan job did not succeed (result: ${PLAN_RESULT})"
            failed=1
          fi

          if [ "$HAS_SINGLE" = "true" ]; then
            if [ "$SINGLE_RESULT" != "success" ]; then
              echo "::error::single suites job did not succeed (result: ${SINGLE_RESULT})"
              failed=1
            fi
          elif [ "$SINGLE_RESULT" != "skipped" ] && [ "$SINGLE_RESULT" != "success" ]; then
            echo "::error::single suites job ended with unexpected result: ${SINGLE_RESULT}"
            failed=1
          fi

          if [ "$HAS_SHARDED" = "true" ]; then
            if [ "$BUILD_RESULT" != "success" ]; then
              echo "::error::sharded image build job did not succeed (result: ${BUILD_RESULT})"
              failed=1
            fi
            if [ "$SHARDED_RESULT" != "success" ]; then
              echo "::error::sharded suites job did not succeed (result: ${SHARDED_RESULT})"
              failed=1
            fi
          else
            if [ "$BUILD_RESULT" != "skipped" ] && [ "$BUILD_RESULT" != "success" ]; then
              echo "::error::sharded image build job ended with unexpected result: ${BUILD_RESULT}"
              failed=1
            fi
            if [ "$SHARDED_RESULT" != "skipped" ] && [ "$SHARDED_RESULT" != "success" ]; then
              echo "::error::sharded suites job ended with unexpected result: ${SHARDED_RESULT}"
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "- :x: **Verdict**: One or more E2E suites, builds, or static checks failed or were cancelled." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "- :white_check_mark: **Verdict**: All E2E suites and static checks passed." >> "$GITHUB_STEP_SUMMARY"
