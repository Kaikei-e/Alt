name: Rask Log Aggregator

on:
  push:
    branches: [main]
    paths:
      - 'rask-log-aggregator/**'
      - '.github/workflows/rask-log-aggregator.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'rask-log-aggregator/**'
      - '.github/workflows/rask-log-aggregator.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable branch head, 2026-07-31
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        working-directory: rask-log-aggregator/app
        run: cargo fmt --all -- --check

  test:
    needs: fmt
    uses: ./.github/workflows/reusable-test-rust.yaml
    with:
      working-directory: 'rask-log-aggregator/app'
      toolchain: 'stable'
      coverage-flags: 'rask-log-aggregator'
      runner: 'ubuntu-latest'
