name: Rask Log Aggregator

on:
  push:
    branches: [main]
    paths:
      - 'rask-log-aggregator/**'
      - 'scripts/lint/**'
      - 'scripts/altharness/**'
      - '.github/workflows/rask-log-aggregator.yaml'
      - '.github/workflows/reusable-test-rust.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  pull_request:
    branches: [main]
    paths:
      - 'rask-log-aggregator/**'
      - 'scripts/lint/**'
      - 'scripts/altharness/**'
      - '.github/workflows/rask-log-aggregator.yaml'
      - '.github/workflows/reusable-test-rust.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-rust.yaml
    with:
      working-directory: 'rask-log-aggregator/app'
      coverage-flags: 'rask-log-aggregator'
