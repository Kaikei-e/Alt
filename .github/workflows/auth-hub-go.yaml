name: Auth Hub Tests

on:
  push:
    branches: [main]
    paths: ['auth-hub/**', '.github/workflows/auth-hub-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  pull_request:
    branches: [main]
    paths: ['auth-hub/**', '.github/workflows/auth-hub-go.yaml', '.github/workflows/reusable-test-go.yaml', '.github/workflows/reusable-go-quality-gates.yaml', '.golangci.yml', 'scripts/lint/**', '!**/CLAUDE.md', '!**/AGENTS.md', '!**/README.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # auth-hub owns session validation and the Kratos gateway, and until now its
  # 19 test files ran in no workflow — it appeared in CI only as one Pact
  # consumer directory under proto-contract.yaml. A fall-open in
  # auth-hub/middleware/ would have reached main green, because the Hurl suite
  # only exercises the happy path.
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'auth-hub'
      coverage-flags: 'auth-hub'
      use-oidc: false
      sparse-checkout: 'auth-hub'

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'auth-hub'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
