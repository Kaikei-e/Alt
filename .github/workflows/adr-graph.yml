name: ADR supersedes graph

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".claude/skills/adr-preflight/**"
      - "scripts/lint/**"
      - "scripts/altharness/**"
      - ".github/workflows/adr-graph.yml"
  pull_request:
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".claude/skills/adr-preflight/**"
      - "scripts/lint/**"
      - "scripts/altharness/**"
      - ".github/workflows/adr-graph.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The append-only check diffs against the merge base, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - name: Cache DocDag binary
        id: cache-docdag
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin/docdag
          key: docdag-${{ runner.os }}-${{ hashFiles('scripts/lint/adr.sh') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"  # DocDag v0.4.0+ declares go 1.27
          cache: false
      - name: Install DocDag
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/go/bin/docdag" ]; then
            docdag_version="$(sed -n 's/^readonly DOCDAG_VERSION="\([^"]*\)"/\1/p' scripts/lint/adr.sh | head -n 1)"
            test -n "$docdag_version"
            go install "github.com/Kaikei-e/DocDag/cmd/docdag@${docdag_version}"
          fi
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Run ADR graph checks
        env:
          TARGET: adr
          LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./scripts/lint/run.sh "$TARGET"
      - name: Resolve ADR gate base
        id: adr_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "base=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ADR supersede gate
        env:
          ADR_BASE: ${{ steps.adr_base.outputs.base }}
        run: ./scripts/altharness/alt-harness adr-gate --base "$ADR_BASE"
      - name: ADR preflight and supersede gate Go tests
        run: go -C scripts/altharness test -race -count=1 ./internal/preflight ./internal/ledgers
