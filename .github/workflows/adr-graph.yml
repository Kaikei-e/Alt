name: ADR supersedes graph

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".claude/skills/adr-preflight/**"
      - "scripts/agent-harness/adr_supersede_gate.py"
      - "scripts/tests/test-adr-supersede-gate.py"
      - "scripts/lint/**"
      - ".github/workflows/adr-graph.yml"
  pull_request:
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".claude/skills/adr-preflight/**"
      - "scripts/agent-harness/adr_supersede_gate.py"
      - "scripts/tests/test-adr-supersede-gate.py"
      - "scripts/lint/**"
      - ".github/workflows/adr-graph.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The append-only check diffs against the merge base, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - name: Cache DocDag binary
        id: cache-docdag
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin/docdag
          key: docdag-${{ runner.os }}-${{ hashFiles('scripts/lint/adr.sh') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"  # DocDag v0.4.0+ declares go 1.27
          cache: false
      - name: Install DocDag
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/go/bin/docdag" ]; then
            docdag_version="$(sed -n 's/^readonly DOCDAG_VERSION="\([^"]*\)"/\1/p' scripts/lint/adr.sh | head -n 1)"
            test -n "$docdag_version"
            go install "github.com/Kaikei-e/DocDag/cmd/docdag@${docdag_version}"
          fi
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Run ADR graph checks
        env:
          TARGET: adr
          LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./scripts/lint/run.sh "$TARGET"
      - name: ADR preflight gate tests
        run: python3 .claude/skills/adr-preflight/scripts/test_adr_preflight.py
      - name: ADR supersede gate tests
        run: python3 scripts/tests/test-adr-supersede-gate.py
