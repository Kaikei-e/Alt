name: ADR supersedes graph

on:
  push:
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".github/workflows/adr-graph.yml"
  pull_request:
    paths:
      - "docs/ADR/**"
      - "docdag.yaml"
      - ".github/workflows/adr-graph.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install DocDag
        run: go install github.com/Kaikei-e/DocDag/cmd/docdag@latest
      - name: Corpus check
        run: docdag validate
