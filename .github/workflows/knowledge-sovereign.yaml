name: Knowledge Sovereign Go Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    paths:
      - 'knowledge-sovereign/**'
      - 'docs/features/knowledge-loop/**'
      - '.github/workflows/knowledge-sovereign.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'knowledge-sovereign/**'
      - 'docs/features/knowledge-loop/**'
      - '.github/workflows/knowledge-sovereign.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'knowledge-sovereign/app'
      coverage-flags: 'knowledge-sovereign'
      sparse-checkout: |
        knowledge-sovereign
        docs/features/knowledge-loop
      use-local-persistent-cache: false

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            knowledge-sovereign
          sparse-checkout-cone-mode: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'knowledge-sovereign/app/go.mod'
          check-latest: true
          cache: true

      - name: Integration tests (real PostgreSQL + Atlas migrations)
        working-directory: knowledge-sovereign/app
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags integration ./driver/... ./usecase/... ./test_utils/...

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'knowledge-sovereign/app'
      lint-only-new: true
      upload-sarif: true
