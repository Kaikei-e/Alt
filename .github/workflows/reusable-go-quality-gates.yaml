name: Reusable Go Quality Gates

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Target Go module directory (monorepo friendly)"
        required: true
        type: string
      go-version:
        description: "Go version (empty = derive from go.mod)"
        required: false
        type: string
        default: ""
      upload-sarif:
        description: "Upload SARIF files to Code Scanning"
        required: false
        type: boolean
        default: true

# 最小権限 + SARIF アップロード用の権限
permissions:
  contents: read # checkout 用
  security-events: write # SARIF を Code Scanning にアップロードするのに必須

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      # --- Checkout & Go setup ---
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.working-directory }}
            scripts/lint
            scripts/altharness
          sparse-checkout-cone-mode: true
          fetch-depth: 2 # 変更差分だけで十分 (workflow_dispatch での HEAD~1 参照にも対応)

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}
          check-latest: true
          cache: true
          cache-dependency-path: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' && format('{0}/go.sum', inputs.working-directory) || format('{0}/go.mod', inputs.working-directory) }}

      # Tools using go/packages must be built by the same Go toolchain that loads the packages.
      - name: Cache Go lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/alt-lint
          key: alt-lint-go-${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-golangci-v2.14.0-govulncheck-v1.6.0

      - name: Run Go quality gates
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: ./scripts/lint/run.sh "$PROJECT_DIR"

      - name: Upload SARIF (gosec)
        if: ${{ always() && inputs.upload-sarif && hashFiles(format('{0}/_reports/gosec.sarif', inputs.working-directory)) != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ inputs.working-directory }}/_reports/gosec.sarif
          category: gosec

      - name: Upload SARIF (govulncheck)
        if: ${{ always() && inputs.upload-sarif && hashFiles(format('{0}/_reports/govulncheck.sarif', inputs.working-directory)) != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ inputs.working-directory }}/_reports/govulncheck.sarif
          category: govulncheck
