name: Pre-processor Sidecar Go Tests
on:
  push:
    branches: [main, master]
    paths:
      - "pre-processor-sidecar/**"
      - ".github/workflows/pre-processor-sidecar-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - ".github/workflows/reusable-go-quality-gates.yaml"
      - ".golangci.yml"
      - "scripts/lint/**"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main, master]
    paths:
      - "pre-processor-sidecar/**"
      - ".github/workflows/pre-processor-sidecar-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - ".github/workflows/reusable-go-quality-gates.yaml"
      - ".golangci.yml"
      - "scripts/lint/**"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: "pre-processor-sidecar/app"
      coverage-flags: "pre-processor-sidecar"
      sparse-checkout: "pre-processor-sidecar"

  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: "pre-processor-sidecar/app"
      upload-sarif: true

  quality-credential-health-checker:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: "pre-processor-sidecar/cmd/credential-health-checker"
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality, quality-credential-health-checker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.quality-credential-health-checker.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
