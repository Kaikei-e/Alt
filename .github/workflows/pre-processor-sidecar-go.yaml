name: Pre-processor Sidecar Go Tests
on:
  push:
    branches: [main, master]
    paths:
      - "pre-processor-sidecar/**"
      - ".github/workflows/pre-processor-sidecar-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main, master]
    paths:
      - "pre-processor-sidecar/**"
      - ".github/workflows/pre-processor-sidecar-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: "pre-processor-sidecar/app"
      coverage-flags: "pre-processor-sidecar"
      sparse-checkout: "pre-processor-sidecar"
