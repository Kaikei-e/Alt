name: Reusable Deno Test Workflow

# Runs static checks (`lint` job via `./scripts/lint/run.sh`) and unit tests
# (`test-deno` job via `deno test`) as independent jobs using the Deno version
# pinned in each service's `.dvmrc`, so lint failures surface without blocking
# unit test reporting.

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      sparse-checkout:
        required: true
        type: string
      test-command:
        required: false
        type: string
        default: "deno test --allow-all"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.sparse-checkout }}
            scripts/lint
          sparse-checkout-cone-mode: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version-file: ${{ inputs.working-directory }}/.dvmrc

      - name: Lint
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: ./scripts/lint/run.sh "$PROJECT_DIR"

  test-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version-file: ${{ inputs.working-directory }}/.dvmrc

      - name: Deno env (diagnostics)
        run: |
          deno --version
          ls -la

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "$TEST_COMMAND"
