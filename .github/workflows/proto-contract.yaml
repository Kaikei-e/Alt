# Proto & Contract Validation — blocking gate.
#
# This workflow runs on every PR to main. The following jobs MUST be listed in
# the `main` branch protection as required status checks so the merge is
# blocked on contract/regression failures:
#
#   - "Proto & Contract Validation / Pact CDC Consumer Tests (Go)"
#   - "Proto & Contract Validation / Pact CDC Consumer Tests (Rust)"
#   - "Proto & Contract Validation / Pact CDC Consumer Tests (Python)"
#   - "Proto & Contract Validation / Pact Publish & Provider Verification"
#   - "Proto & Contract Validation / Buf Lint & Breaking Change Detection"
#   - "Proto & Contract Validation / Contract Conformance Tests (FE)"
#
# `Pact Publish & Provider Verification` is an aggregator that waits on
# `pact-verify-go` and `pact-verify-python` (matrix). Those two jobs carry the
# actual publish + verify work; the aggregator keeps the historical required-
# check name stable so branch-protection does not need to be re-wired on every
# split.
#
# Enforcement: see docs/runbooks/pact-broker-ops.md for the branch-protection
# recipe. PR-level verification here is paired with a local `can-i-deploy`
# gate (c2quay, invoked via scripts/deploy.sh) run on the deploy host itself;
# the production gate and record-deployment are intentionally kept off GitHub
# Actions (OSS repo — no prod credentials or state in CI).

name: Proto & Contract Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proto-contract.yaml'
      - 'proto/**'
      - 'alt-frontend-sv/src/lib/gen/**'
      - 'alt-butterfly-facade/internal/server/allowlist_gen.go'
      - 'alt-frontend-sv/src/test/contracts/**'
      - 'alt-backend/app/orchestrator/driver/preprocessor_connect/contract/**'
      - 'alt-backend/app/dataplane/driver/contract/**'
      # The alt-data-hub consumer legs. Omitting this is how a commit that
      # changes a datahub pact ships without republishing it, leaving the
      # deploy gate to resolve alt-data-hub as unknown.
      - 'alt-backend/app/shared/gateway/datahub_gateway/contract/**'
      - 'alt-backend/app/shared/driver/sovereign_client/contract/**'
      - 'pre-processor/app/driver/contract/**'
      - 'rag-orchestrator/internal/adapter/contract/**'
      - 'search-indexer/app/driver/contract/**'
      - 'mq-hub/app/driver/contract/**'
      - 'knowledge-sovereign/app/driver/contract/**'
      - 'news-creator/app/tests/contract/**'
      - 'recap-subworker/tests/contract/**'
      - 'tag-generator/app/tests/contract/**'
      - 'recap-evaluator/tests/contract/**'
      - 'recap-worker/recap-worker/src/clients/*contract*'
      # The glob above matches only files directly under clients/; the datahub
      # contract lives a directory deeper.
      - 'recap-worker/recap-worker/src/clients/**/contract.rs'
      - 'alt-butterfly-facade/internal/handler/contract/**'
      - 'acolyte-orchestrator/tests/contract/**'
      # The deploy host runs its provider legs out of pact-check.sh, not out
      # of this workflow, so a change there is invisible here unless the
      # script and its filter tests are watched paths.
      - 'scripts/pact-check.sh'
      - 'scripts/tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proto-contract.yaml'
      - 'proto/**'
      - 'alt-frontend-sv/src/lib/gen/**'
      - 'alt-butterfly-facade/internal/server/allowlist_gen.go'
      - 'alt-frontend-sv/src/test/contracts/**'
      - 'alt-backend/app/orchestrator/driver/preprocessor_connect/contract/**'
      - 'alt-backend/app/dataplane/driver/contract/**'
      # The alt-data-hub consumer legs. Omitting this is how a commit that
      # changes a datahub pact ships without republishing it, leaving the
      # deploy gate to resolve alt-data-hub as unknown.
      - 'alt-backend/app/shared/gateway/datahub_gateway/contract/**'
      - 'alt-backend/app/shared/driver/sovereign_client/contract/**'
      - 'pre-processor/app/driver/contract/**'
      - 'rag-orchestrator/internal/adapter/contract/**'
      - 'search-indexer/app/driver/contract/**'
      - 'mq-hub/app/driver/contract/**'
      - 'knowledge-sovereign/app/driver/contract/**'
      - 'news-creator/app/tests/contract/**'
      - 'recap-subworker/tests/contract/**'
      - 'tag-generator/app/tests/contract/**'
      - 'recap-evaluator/tests/contract/**'
      - 'recap-worker/recap-worker/src/clients/*contract*'
      # The glob above matches only files directly under clients/; the datahub
      # contract lives a directory deeper.
      - 'recap-worker/recap-worker/src/clients/**/contract.rs'
      - 'alt-butterfly-facade/internal/handler/contract/**'
      - 'acolyte-orchestrator/tests/contract/**'
      # The deploy host runs its provider legs out of pact-check.sh, not out
      # of this workflow, so a change there is invisible here unless the
      # script and its filter tests are watched paths.
      - 'scripts/pact-check.sh'
      - 'scripts/tests/**'

# Superseded PR runs are cancelled; main-branch runs are not, because they
# publish pacts and a half-cancelled publish leaves the broker inconsistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  buf-lint-breaking:
    name: Buf Lint & Breaking Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # buf-setup-action / buf-breaking-action are archived; buf-action with
      # setup_only installs the CLI and leaves lint/breaking to explicit steps.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1.5.0
        with:
          setup_only: true

      - name: Buf lint
        working-directory: proto
        run: buf lint

      - name: Buf breaking change detection
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against 'https://github.com/Kaikei-e/Alt.git#branch=main,subdir=proto'

      # The public-API allowlist gate lives in this job rather than a new one so
      # it is blocking from the first run: "Buf Lint & Breaking Change Detection"
      # is already a required status check, and a separate job would sit
      # non-blocking until branch protection is re-wired.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          # check-latest matches reusable-test-go: the runner's preinstalled Go
          # lags patch releases, and setup-go v7 sets GOTOOLCHAIN=local, so a
          # stale 1.26.x here fails every go.mod that already moved on.
          check-latest: true
          cache: true
          # Monorepo: no root go.mod, so point the cache at the tool's own sums.
          cache-dependency-path: proto/tools/protovis/go.sum

      - name: protovis unit tests
        working-directory: proto/tools/protovis
        run: go test ./...

      # ADR-000955: the (alt.api.v1.visibility) option on each alt.* service is
      # the single source of truth for what is public API. protovis derives the
      # BFF Go allowlist and the frontend TS allowlist from it and exits
      # non-zero on any alt.* service that declares nothing, so a new service
      # cannot become browser-reachable by omission.
      - name: Regenerate public-API allowlists
        working-directory: proto
        run: |
          buf build --exclude-source-info -o "${RUNNER_TEMP}/descriptor.binpb"
          cd tools/protovis
          go run . -desc "${RUNNER_TEMP}/descriptor.binpb" -root "${GITHUB_WORKSPACE}"

      # `git status --porcelain`, not `git diff --exit-code`: a newly declared
      # service can produce a generated file that does not exist in the commit
      # at all, and diff reports a clean tree while the artifact is untracked.
      - name: Fail on allowlist drift
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Generated allowlists are stale. Re-run protovis and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  contract-conformance:
    name: Contract Conformance Tests (FE)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: alt-frontend-sv
        run: bun install

      - name: Run contract tests
        working-directory: alt-frontend-sv
        run: bun test src/test/contracts/

  pact-cdc-go:
    name: Pact CDC Consumer Tests (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One broken service should not cancel the other consumers' pact
      # generation — the verify job needs every artifact that can be built.
      fail-fast: false
      matrix:
        include:
          # Two packages in one leg rather than two matrix entries: both write
          # into alt-backend/pacts, and the upload step names its artifact after
          # sparse-checkout, so a second alt-backend entry would collide on
          # `pacts-alt-backend`. The datahub package is the in-family pair
          # (alt-backend and alt-harvester against alt-data-hub) — without it
          # the job uploads the committed snapshot of those two pact files and
          # a consumer-side change to them never regenerates in CI.
          - service: alt-backend/app
            test-path: >-
              ./orchestrator/driver/preprocessor_connect/contract/
              ./shared/gateway/datahub_gateway/contract/
            sparse-checkout: alt-backend
            pact-dir: alt-backend/pacts
          - service: pre-processor/app
            test-path: ./driver/contract/
            sparse-checkout: pre-processor
            pact-dir: pacts
          - service: rag-orchestrator
            test-path: ./internal/adapter/contract/
            sparse-checkout: rag-orchestrator
            pact-dir: rag-orchestrator/pacts
          - service: search-indexer/app
            test-path: ./driver/contract/
            sparse-checkout: search-indexer
            pact-dir: pacts
          # mq-hub no longer emits consumer pacts (it only wire-format-checks
          # here; provider verification runs in pact-verify-go), so it has no
          # pact-dir and the upload step is skipped.
          - service: mq-hub/app
            test-path: ./driver/contract/
            sparse-checkout: mq-hub
            pact-dir: ""
          - service: alt-butterfly-facade
            test-path: ./internal/handler/contract/
            sparse-checkout: alt-butterfly-facade
            pact-dir: pacts
          # altctl's operator surface against knowledge-sovereign. Its provider
          # leg verifies with FailIfNoPactsFound, so a consumer absent from this
          # matrix does not skip — the Broker holds nothing for it and the
          # verification fails. Only the committed snapshot under altctl/pacts/
          # existed, and nothing published it.
          - service: altctl
            test-path: ./internal/sovereignclient/contract/
            sparse-checkout: altctl
            pact-dir: altctl/pacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: ${{ matrix.sparse-checkout }}
          sparse-checkout-cone-mode: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          # check-latest matches reusable-test-go: the runner's preinstalled Go
          # lags patch releases, and setup-go v7 sets GOTOOLCHAIN=local, so a
          # stale 1.26.x here fails every go.mod that already moved on.
          check-latest: true
          cache: true
          # Sparse checkout leaves no go.mod at the repo root, so the default
          # dependency-file lookup fails and the module cache never restores.
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Install pact FFI library
        run: |
          mkdir -p "$HOME/.pact/lib"
          curl -fsSL https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v0.4.28/libpact_ffi-linux-x86_64.so.gz \
            | gunzip > "$HOME/.pact/lib/libpact_ffi.so"
          echo "LD_LIBRARY_PATH=$HOME/.pact/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$HOME/.pact/lib" >> "$GITHUB_ENV"

      - name: Run Pact consumer tests
        working-directory: ${{ matrix.service }}
        env:
          CGO_ENABLED: "1"
        run: go test -tags=contract ${{ matrix.test-path }} -v

      - name: Upload pact files
        if: matrix.pact-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pacts-${{ matrix.sparse-checkout }}
          path: ${{ matrix.pact-dir }}/*.json
          if-no-files-found: error

  pact-verify-go:
    name: Pact Provider Verify (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [pact-cdc-go, pact-cdc-rust, pact-cdc-python-consumer]
    services:
      pact-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact
          POSTGRES_DB: pact
        options: >-
          --health-cmd "pg_isready -U pact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      pact-broker:
        image: pactfoundation/pact-broker:latest
        env:
          PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-db/pact
          PACT_BROKER_BASIC_AUTH_USERNAME: pact
          PACT_BROKER_BASIC_AUTH_PASSWORD: pact
          PACT_BROKER_ALLOW_PUBLIC_READ: "true"
          PACT_BROKER_LOG_LEVEL: WARN
        ports:
          - 9292:9292
        options: >-
          --health-cmd "ruby -e \"require 'net/http'; require 'json'; r = Net::HTTP.get(URI('http://localhost:9292/diagnostic/status/dependencies')); exit(JSON.parse(r).dig('database','ok') ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - name: Free disk space
        if: runner.environment != 'self-hosted'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # large-packages runs an apt-get purge sweep (~2min, over half this
          # job); android/dotnet/haskell are plain rm -rf and free most of the
          # space in seconds. These jobs verify contracts, they don't build images.
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Runs here rather than in a job of its own: this one already feeds the
      # "Pact Publish & Provider Verification" required check, so the assertions
      # are blocking from the first run instead of waiting on a branch-protection
      # rewire. Bash only, no toolchain, and it runs before the broker work so a
      # leg-selection regression fails in seconds.
      #
      # What it guards is a cross-repository assumption CI cannot otherwise see:
      # alt-deploy publishes alt-data-hub's verifications by invoking
      # pact-check.sh's alt-backend provider leg, so narrowing that leg silently
      # strands alt-data-hub at verifications=0 and blocks every release.
      - name: pact-check.sh leg-selection guard
        run: ./scripts/tests/test-pact-check-filter.sh

      - name: Download all pact artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: collected-pacts
          pattern: pacts-*
          merge-multiple: true

      - name: Wait for Pact Broker database connection
        run: |
          for i in {1..30}; do
            RESPONSE=$(curl -sS -u "pact:pact" http://localhost:9292/diagnostic/status/dependencies 2>/dev/null || echo '{}')
            if echo "$RESPONSE" | jq -e '.database.ok == true' > /dev/null 2>&1; then
              echo "Pact Broker ready."
              exit 0
            fi
            echo "Attempt $i/30: not ready, waiting..."
            sleep 2
          done
          echo "Pact Broker failed to become ready"; exit 1

      - name: Publish all pact files to Broker
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
        run: |
          # The full SHA, not a short one, because the provider steps below
          # annotate their own pacticipant with ${{ github.sha }}. A pacticipant
          # that is both consumer and provider — alt-backend is — would
          # otherwise get two versions for one commit, and the newer one (the
          # provider annotation) carries no pact. `mainBranch: true` resolves to
          # the latest version on the branch and then looks for its pacts, so
          # from that moment every selector for that consumer answers "no pacts
          # found" while the pact sits on the older version. Verified against a
          # local broker: two versions -> 0 pacts, one shared version -> 1.
          #
          # The branch is pinned to main rather than taken from the ref under
          # test. This Broker is a job service container that starts empty on
          # every run, so the branch recorded here is fixture data — the only
          # thing that ever reads it back is the `MainBranch: true` selector in
          # the provider steps below. A Broker assigns a pacticipant its main
          # branch only when a version arrives on a branch named develop, main
          # or master (docs.pact.io/pact_broker/branches), so publishing a pull
          # request under its head ref left every pacticipant without one and
          # every selector resolved to zero pacts. That is silent in any
          # verifier that does not set FailIfNoPactsFound. The production
          # Broker is published by scripts/pact-check.sh on the deploy host and
          # is never reached from here.
          VERSION="${GITHUB_SHA}"
          BRANCH=main
          curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-ruby-standalone/master/install.sh | PACT_CLI_VERSION=v2.4.10 bash
          export PATH="${PATH}:${PWD}/pact/bin"
          pact-broker publish collected-pacts \
            --consumer-app-version "${VERSION}" \
            --branch "${BRANCH}" \
            --broker-base-url "${PACT_BROKER_BASE_URL}" \
            --broker-username "${PACT_BROKER_USERNAME}" \
            --broker-password "${PACT_BROKER_PASSWORD}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          # check-latest matches reusable-test-go: the runner's preinstalled Go
          # lags patch releases, and setup-go v7 sets GOTOOLCHAIN=local, so a
          # stale 1.26.x here fails every go.mod that already moved on.
          check-latest: true
          cache: true
          # Monorepo: no root go.mod, so point the cache at the per-service sums.
          cache-dependency-path: "**/go.sum"

      - name: Install pact FFI library
        run: |
          mkdir -p "$HOME/.pact/lib"
          curl -fsSL https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v0.4.28/libpact_ffi-linux-x86_64.so.gz \
            | gunzip > "$HOME/.pact/lib/libpact_ffi.so"
          echo "LD_LIBRARY_PATH=$HOME/.pact/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$HOME/.pact/lib" >> "$GITHUB_ENV"

      - name: Run alt-backend provider verification
        working-directory: alt-backend/app
        env:
          CGO_ENABLED: "1"
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: go test -tags=contract ./dataplane/driver/contract/ -v

      - name: Run knowledge-sovereign provider verification
        # Added per ADR-000834 (knowledge-sovereign pacticipant promotion)
        # and confirmed against alt-deploy run 24833114775 where
        # can-i-deploy reported `alt-backend ↔ knowledge-sovereign:
        # unknown (verifications=0)` and blocked the roll: the consumer
        # pact was published but no provider verification result ever
        # reached the broker. Running the same pattern as alt-backend
        # above (go test -tags=contract + PACT_PROVIDER_VERSION env)
        # triggers the publish path inside the provider_test.go file
        # (see its `verifyRequest.PublishVerificationResults =
        # os.Getenv("PACT_PROVIDER_VERSION") != ""` branch).
        working-directory: knowledge-sovereign/app
        env:
          CGO_ENABLED: "1"
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: go test -tags=contract ./driver/contract/ -v

      - name: Run search-indexer provider verification
        working-directory: search-indexer/app
        env:
          CGO_ENABLED: "1"
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: go test -tags=contract -run TestVerifySearchIndexerProviderContracts ./driver/contract/ -v

      - name: Run mq-hub provider verification
        working-directory: mq-hub/app
        env:
          CGO_ENABLED: "1"
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: go test -tags=contract -run TestVerifySearchIndexerMqHubMessagePact ./driver/contract/ -v

  pact-verify-python:
    name: Pact Provider Verify (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [pact-cdc-go, pact-cdc-rust, pact-cdc-python-consumer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: news-creator/app
            python: "3.13"
            lock: news-creator/app/uv.lock
          - service: recap-subworker
            python: "3.13"
            lock: recap-subworker/uv.lock
            extra-env: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          - service: tag-generator/app
            python: "3.13"
            lock: tag-generator/app/uv.lock
    services:
      pact-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact
          POSTGRES_DB: pact
        options: >-
          --health-cmd "pg_isready -U pact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      pact-broker:
        image: pactfoundation/pact-broker:latest
        env:
          PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-db/pact
          PACT_BROKER_BASIC_AUTH_USERNAME: pact
          PACT_BROKER_BASIC_AUTH_PASSWORD: pact
          PACT_BROKER_ALLOW_PUBLIC_READ: "true"
          PACT_BROKER_LOG_LEVEL: WARN
        ports:
          - 9292:9292
        options: >-
          --health-cmd "ruby -e \"require 'net/http'; require 'json'; r = Net::HTTP.get(URI('http://localhost:9292/diagnostic/status/dependencies')); exit(JSON.parse(r).dig('database','ok') ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - name: Free disk space
        if: runner.environment != 'self-hosted'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # large-packages runs an apt-get purge sweep (~2min, over half this
          # job); android/dotnet/haskell are plain rm -rf and free most of the
          # space in seconds. These jobs verify contracts, they don't build images.
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all pact artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: collected-pacts
          pattern: pacts-*
          merge-multiple: true

      - name: Wait for Pact Broker database connection
        run: |
          for i in {1..30}; do
            RESPONSE=$(curl -sS -u "pact:pact" http://localhost:9292/diagnostic/status/dependencies 2>/dev/null || echo '{}')
            if echo "$RESPONSE" | jq -e '.database.ok == true' > /dev/null 2>&1; then
              echo "Pact Broker ready."
              exit 0
            fi
            echo "Attempt $i/30: not ready, waiting..."
            sleep 2
          done
          echo "Pact Broker failed to become ready"; exit 1

      - name: Publish all pact files to Broker
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
        run: |
          # Full SHA, matching PACT_PROVIDER_VERSION below — see the Go verify
          # job's publish step for why a pacticipant must not end up with two
          # versions for one commit, and for why the branch is pinned to main
          # against a Broker that starts empty every run.
          VERSION="${GITHUB_SHA}"
          BRANCH=main
          curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-ruby-standalone/master/install.sh | PACT_CLI_VERSION=v2.4.10 bash
          export PATH="${PATH}:${PWD}/pact/bin"
          pact-broker publish collected-pacts \
            --consumer-app-version "${VERSION}" \
            --branch "${BRANCH}" \
            --broker-base-url "${PACT_BROKER_BASE_URL}" \
            --broker-username "${PACT_BROKER_USERNAME}" \
            --broker-password "${PACT_BROKER_PASSWORD}"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          # setup-uv v9 flipped the prune-cache default to false; keep pruning
          # so GitHub cache entries stay small.
          prune-cache: true
          cache-dependency-glob: ${{ matrix.lock }}

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install ${{ matrix.service }} dependencies
        working-directory: ${{ matrix.service }}
        run: |
          if [[ -n "${{ matrix.extra-env }}" ]]; then
            export ${{ matrix.extra-env }}
          fi
          uv sync --dev

      - name: Run ${{ matrix.service }} provider verification
        working-directory: ${{ matrix.service }}
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: uv run pytest tests/contract/ -v

  pact-publish-and-verify:
    # Aggregator that preserves the existing required-status-check name.
    # Actual work happens in pact-verify-go and pact-verify-python (matrix).
    name: Pact Publish & Provider Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [pact-verify-go, pact-verify-python]
    steps:
      - name: All provider verifications passed
        run: echo "Go + Python provider verifications succeeded."

  pact-cdc-rust:
    name: Pact CDC Consumer Tests (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: recap-worker
          sparse-checkout-cone-mode: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable branch head, 2026-07-31
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            recap-worker/recap-worker/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('recap-worker/recap-worker/Cargo.lock') }}

      - name: Run Pact consumer tests
        working-directory: recap-worker/recap-worker
        run: cargo test --lib contract -- --ignored

      - name: Upload pact files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pacts-recap-worker
          path: pacts/*.json
          if-no-files-found: error

  pact-cdc-python-consumer:
    name: Pact CDC Consumer Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Install recap-evaluator dependencies
        working-directory: recap-evaluator
        run: uv sync --dev

      - name: Run recap-evaluator consumer tests
        working-directory: recap-evaluator
        run: uv run pytest tests/contract/ -v --no-cov

      - name: Upload pact files (recap-evaluator)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pacts-recap-evaluator
          path: pacts/recap-evaluator-recap-worker.json
          if-no-files-found: error

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install acolyte-orchestrator dependencies
        working-directory: acolyte-orchestrator
        run: uv sync --dev

      - name: Run acolyte-orchestrator consumer tests
        working-directory: acolyte-orchestrator
        run: uv run pytest tests/contract/ -v --no-cov

      - name: Upload pact files (acolyte-orchestrator)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pacts-acolyte-orchestrator
          path: pacts/acolyte-orchestrator-*.json
          if-no-files-found: error
