name: Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "scripts/lint/**"
      - "scripts/altharness/**"
      - ".github/workflows/dashboard.yml"
      - ".github/workflows/reusable-test-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "scripts/lint/**"
      - "scripts/altharness/**"
      - ".github/workflows/dashboard.yml"
      - ".github/workflows/reusable-test-python.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: dashboard
      python-version: "3.14"
      sparse-checkout: dashboard
      job-type: lint

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Quality gate failed"
            echo "Lint: ${{ needs.lint.result }}"
            exit 1
          fi
          echo "All quality checks passed!"
