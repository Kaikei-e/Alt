name: Alt Perf Tests

on:
  push:
    branches: [main]
    paths:
      - "alt-perf/**"
      - "scripts/lint/**"
      - ".golangci.yml"
      - ".github/workflows/alt-perf.yaml"
      - ".github/workflows/reusable-test-deno.yaml"
      - ".github/workflows/reusable-go-quality-gates.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  pull_request:
    branches: [main]
    paths:
      - "alt-perf/**"
      - "scripts/lint/**"
      - ".golangci.yml"
      - ".github/workflows/alt-perf.yaml"
      - ".github/workflows/reusable-test-deno.yaml"
      - ".github/workflows/reusable-go-quality-gates.yaml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # tests/unit only — the perf tasks themselves drive a real browser against a
  # running stack (not started in this gate; the scheduled k6 smoke workflow
  # was removed because it ran against a backend that was never started).
  #
  # NOTE: Static checks run in a separate `lint` job via `./scripts/lint/run.sh`
  # using the Deno version pinned in `alt-perf/.dvmrc` (matching
  # `alt-perf/Dockerfile`), so pre-existing `deno lint` findings fail `lint`
  # without blocking `test-deno`. `deno check main.ts` fails with 1 error in
  # `src/report/cli-reporter.ts` and is not part of CI; `deno test` still
  # type-checks every module the tests import.
  test:
    uses: ./.github/workflows/reusable-test-deno.yaml
    with:
      working-directory: "alt-perf"
      sparse-checkout: "alt-perf"
      test-command: "deno test --allow-all tests/"

  quality-mock-rss-server:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: "alt-perf/k6/mock-rss-server"
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality-mock-rss-server]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MOCK_RSS_QUALITY_RESULT: ${{ needs.quality-mock-rss-server.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$MOCK_RSS_QUALITY_RESULT" != "success" ]; then
            echo "One or more quality gates failed (test=${TEST_RESULT}, quality-mock-rss-server=${MOCK_RSS_QUALITY_RESULT})"
            exit 1
          fi
          echo "All quality gates passed"
