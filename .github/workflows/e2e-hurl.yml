# E2E Hurl suites (one job per service under e2e/hurl/).
#
# Gating is per-suite via path filters: each job only runs when the
# service code, its compose wiring, its Hurl suite, its fixtures, or
# this workflow changes. Unrelated PRs don't pay the build + stack
# bring-up cost.
#
# To add another service's suite later (e.g. search-indexer), add a
# matching `paths:` block and a sibling job; keep existing job names
# stable.

name: E2E Hurl

on:
  pull_request:
    paths:
      - 'alt-backend/**'
      - 'mq-hub/**'
      - 'tag-generator/**'
      - 'news-creator/**'
      - 'recap-worker/**'
      - 'recap-migration-atlas/**'
      - 'acolyte-orchestrator/**'
      - 'acolyte-migration-atlas/**'
      - 'auth-hub/**'
      - 'kratos/entrypoint.sh'
      - 'migrations-atlas/**'
      - 'rag-orchestrator/**'
      - 'rag-migration-atlas/**'
      - 'rag-db/**'
      - 'knowledge-sovereign/**'
      - 'compose/compose.staging.yaml'
      - 'compose/news-creator-ollama-stub/**'
      - 'e2e/hurl/alt-backend/**'
      - 'e2e/hurl/mq-hub/**'
      - 'e2e/hurl/tag-generator/**'
      - 'e2e/hurl/news-creator/**'
      - 'e2e/hurl/recap-worker/**'
      - 'e2e/hurl/acolyte-orchestrator/**'
      - 'e2e/hurl/auth-hub/**'
      - 'e2e/hurl/rag-orchestrator/**'
      - 'e2e/hurl/knowledge-sovereign/**'
      - 'e2e/fixtures/alt-backend/**'
      - 'e2e/fixtures/mq-hub/**'
      - 'e2e/fixtures/tag-generator/**'
      - 'e2e/fixtures/news-creator/**'
      - 'e2e/fixtures/recap-worker/**'
      - 'e2e/fixtures/acolyte-orchestrator/**'
      - 'e2e/fixtures/auth-hub/**'
      - 'e2e/fixtures/rag-orchestrator/**'
      - 'e2e/fixtures/staging-secrets/**'
      - 'e2e/stubs/alt-backend-deps-stub/**'
      - 'e2e/stubs/recap-pipeline-stub/**'
      - '.github/workflows/e2e-hurl.yml'
  push:
    branches: [main]
    paths:
      - 'alt-backend/**'
      - 'mq-hub/**'
      - 'tag-generator/**'
      - 'news-creator/**'
      - 'recap-worker/**'
      - 'recap-migration-atlas/**'
      - 'acolyte-orchestrator/**'
      - 'acolyte-migration-atlas/**'
      - 'auth-hub/**'
      - 'kratos/entrypoint.sh'
      - 'migrations-atlas/**'
      - 'rag-orchestrator/**'
      - 'rag-migration-atlas/**'
      - 'rag-db/**'
      - 'knowledge-sovereign/**'
      - 'compose/compose.staging.yaml'
      - 'compose/news-creator-ollama-stub/**'
      - 'e2e/hurl/alt-backend/**'
      - 'e2e/hurl/mq-hub/**'
      - 'e2e/hurl/tag-generator/**'
      - 'e2e/hurl/news-creator/**'
      - 'e2e/hurl/recap-worker/**'
      - 'e2e/hurl/acolyte-orchestrator/**'
      - 'e2e/hurl/auth-hub/**'
      - 'e2e/hurl/rag-orchestrator/**'
      - 'e2e/hurl/knowledge-sovereign/**'
      - 'e2e/fixtures/alt-backend/**'
      - 'e2e/fixtures/mq-hub/**'
      - 'e2e/fixtures/tag-generator/**'
      - 'e2e/fixtures/news-creator/**'
      - 'e2e/fixtures/recap-worker/**'
      - 'e2e/fixtures/acolyte-orchestrator/**'
      - 'e2e/fixtures/auth-hub/**'
      - 'e2e/fixtures/rag-orchestrator/**'
      - 'e2e/fixtures/staging-secrets/**'
      - 'e2e/stubs/alt-backend-deps-stub/**'
      - 'e2e/stubs/recap-pipeline-stub/**'
      - '.github/workflows/e2e-hurl.yml'

permissions:
  contents: read

concurrency:
  group: e2e-hurl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflow-level `paths:` above is the union across every suite, so a
  # one-service change still triggers all nine. This job narrows it per suite.
  # Gating happens at job level (not trigger level) so a skipped suite still
  # reports a status instead of leaving a required check pending forever.
  changes:
    name: Detect changed suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alt_backend: ${{ steps.filter.outputs.alt_backend }}
      mq_hub: ${{ steps.filter.outputs.mq_hub }}
      recap_worker: ${{ steps.filter.outputs.recap_worker }}
      news_creator: ${{ steps.filter.outputs.news_creator }}
      acolyte_orchestrator: ${{ steps.filter.outputs.acolyte_orchestrator }}
      tag_generator: ${{ steps.filter.outputs.tag_generator }}
      auth_hub: ${{ steps.filter.outputs.auth_hub }}
      rag_orchestrator: ${{ steps.filter.outputs.rag_orchestrator }}
      knowledge_sovereign: ${{ steps.filter.outputs.knowledge_sovereign }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history so the base…head diff resolves across squash- and
          # rebase-merges, matching docker-build.yaml's change detection.
          fetch-depth: 0

      - name: Map changed paths to suites
        id: filter
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          declare -A SUITE_PATHS=(
            [alt_backend]="alt-backend/ migrations-atlas/ e2e/hurl/alt-backend/ e2e/fixtures/alt-backend/ e2e/stubs/alt-backend-deps-stub/"
            [mq_hub]="mq-hub/ e2e/hurl/mq-hub/ e2e/fixtures/mq-hub/"
            [recap_worker]="recap-worker/ recap-migration-atlas/ e2e/hurl/recap-worker/ e2e/fixtures/recap-worker/ e2e/stubs/recap-pipeline-stub/"
            [news_creator]="news-creator/ compose/news-creator-ollama-stub/ e2e/hurl/news-creator/ e2e/fixtures/news-creator/"
            [acolyte_orchestrator]="acolyte-orchestrator/ acolyte-migration-atlas/ e2e/hurl/acolyte-orchestrator/ e2e/fixtures/acolyte-orchestrator/"
            [tag_generator]="tag-generator/ mq-hub/ e2e/hurl/tag-generator/ e2e/fixtures/tag-generator/"
            [auth_hub]="auth-hub/ kratos/entrypoint.sh e2e/hurl/auth-hub/ e2e/fixtures/auth-hub/"
            [rag_orchestrator]="rag-orchestrator/ rag-migration-atlas/ rag-db/ e2e/hurl/rag-orchestrator/ e2e/fixtures/rag-orchestrator/"
            [knowledge_sovereign]="knowledge-sovereign/ e2e/hurl/knowledge-sovereign/"
          )

          ZERO_SHA="0000000000000000000000000000000000000000"
          RUN_ALL=false
          CHANGED_FILES=""

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" && "$PR_BASE_SHA" != "$PR_HEAD_SHA" ]]; then
              CHANGED_FILES=$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" 2>/dev/null || true)
            fi
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "$ZERO_SHA" && "$PUSH_BEFORE" != "$GITHUB_SHA" ]]; then
            CHANGED_FILES=$(git diff --name-only "${PUSH_BEFORE}..${GITHUB_SHA}" 2>/dev/null || true)
          fi

          # No usable diff (first push, force-push, API hiccup): run everything
          # rather than silently skipping coverage.
          if [[ -z "$CHANGED_FILES" ]]; then
            RUN_ALL=true
            echo "No usable diff — running every suite."
          fi

          # Every suite boots the same staging stack, so changes to the stack
          # wiring, its shared secrets, or this workflow affect all of them.
          if [[ "$RUN_ALL" != "true" ]]; then
            while IFS= read -r file; do
              if [[ -z "$file" ]]; then
                continue
              fi
              case "$file" in
                compose/compose.staging.yaml|e2e/fixtures/staging-secrets/*|.github/workflows/e2e-hurl.yml)
                  RUN_ALL=true
                  echo "Shared-stack change detected ($file) — running every suite."
                  break ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          for suite in "${!SUITE_PATHS[@]}"; do
            hit=false
            if [[ "$RUN_ALL" == "true" ]]; then
              hit=true
            else
              for prefix in ${SUITE_PATHS[$suite]}; do
                if grep -q "^${prefix}" <<< "$CHANGED_FILES"; then
                  hit=true
                  break
                fi
              done
            fi
            echo "${suite}=${hit}" >> "$GITHUB_OUTPUT"
            echo "${suite}: ${hit}"
          done

  alt-backend:
    name: alt-backend Hurl suite
    needs: changes
    if: needs.changes.outputs.alt_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # `:buildcache` is the registry layer cache published by
      # docker-build.yaml on pushes to main. Importing it here keeps these
      # suites from rebuilding every image from scratch on each PR.
      - name: Build alt-backend image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            -t ghcr.io/kaikei-e/alt-alt-backend:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-backend-deps-stub image locally (tag `ci`)
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-alt-backend-deps-stub:ci \
            e2e/stubs/alt-backend-deps-stub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run alt-backend Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/alt-backend/run.sh

      - name: Dump alt-staging logs on failure
        # Delegate to `docker compose logs` so container naming drift
        # (compose suffixes a `-1` index when -p collides with the
        # `container_name:` directive) cannot hide the backend's error
        # logs. Matches the dump step used by mq-hub / rag-orchestrator
        # / auth-hub / knowledge-sovereign jobs below.
        if: failure()
        run: |
          docker ps -a --filter "name=alt-staging-" || true
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            --profile alt-backend logs --no-color --tail=500 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-backend-hurl-reports
          path: e2e/reports/alt-backend-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  mq-hub:
    name: mq-hub Hurl suite
    needs: changes
    if: needs.changes.outputs.mq_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build mq-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-mq-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-mq-hub:ci \
            -f mq-hub/Dockerfile \
            mq-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run mq-hub Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          # Leave stack up on failure so the next step can dump logs; the
          # runner VM is torn down after the job anyway.
          KEEP_STACK: 1
        run: bash e2e/hurl/mq-hub/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            logs --no-color --tail=200 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mq-hub-hurl-reports
          path: e2e/reports/mq-hub-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  recap-worker:
    name: recap-worker Hurl suite
    needs: changes
    if: needs.changes.outputs.recap_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # recap-worker's image bundles libtorch (~600MB download) +
      # cargo-chef cooks the workspace, so a cold build dominates this job.
      # The registry cache import below is what keeps it off the critical path.
      - name: Build recap-worker image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-recap-worker:buildcache \
            -t ghcr.io/kaikei-e/alt-recap-worker:ci \
            -f recap-worker/Dockerfile.recap-worker \
            recap-worker

      - name: Warmup rust-bert cache (internet-connected, bind mount)
        # The staging compose brings the stack up on an `internal: true`
        # network, so rust-bert cannot reach HuggingFace from inside.
        # Populate /opt/rustbert-cache on the runner host before the
        # staging stack starts; compose mounts the same path read-only.
        # recap uid/gid are pinned to 999 in the image, so the host dir
        # must be chown'd to 999:999 for the warmup container to write.
        run: |
          sudo mkdir -p /opt/rustbert-cache
          sudo chown -R 999:999 /opt/rustbert-cache
          docker run --rm \
            -v /opt/rustbert-cache:/opt/rustbert-cache \
            ghcr.io/kaikei-e/alt-recap-worker:ci warmup

      - name: Build recap-pipeline-stub image locally (tag `ci`)
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-recap-pipeline-stub:ci \
            e2e/stubs/recap-pipeline-stub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run recap-worker Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/recap-worker/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # recap-worker is profile-gated in compose.staging.yaml, so a
          # bare `docker compose logs` silently returns nothing. Pass
          # --profile recap-worker so the dump actually matches the
          # services run.sh brought up (observed on run 24752223343
          # where the profile omission hid a SIGSEGV diagnostic).
          docker compose -f compose/compose.staging.yaml --profile recap-worker -p alt-staging \
            logs --no-color --tail=300 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: recap-worker-hurl-reports
          path: e2e/reports/recap-worker-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  news-creator:
    name: news-creator Hurl suite
    needs: changes
    if: needs.changes.outputs.news_creator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build news-creator image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-news-creator:buildcache \
            -t ghcr.io/kaikei-e/alt-news-creator:ci \
            -f news-creator/Dockerfile \
            news-creator

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run news-creator Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/news-creator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            logs --no-color --tail=300 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: news-creator-hurl-reports
          path: e2e/reports/news-creator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  acolyte-orchestrator:
    name: acolyte-orchestrator Hurl suite
    needs: changes
    if: needs.changes.outputs.acolyte_orchestrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run acolyte-orchestrator Hurl suite
        env:
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/acolyte-orchestrator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # acolyte-orchestrator's profile-gated services aren't surfaced
          # by `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          # Cover every container run.sh brings up so a request that
          # never reached its peer is visible from both ends of the wire.
          for svc in acolyte-orchestrator acolyte-db acolyte-db-migrator \
                     news-creator-ollama-stub \
                     search-indexer meilisearch stub-backend; do
            echo "===== alt-staging-$svc logs (tail=300) ====="
            docker logs --tail=300 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: acolyte-orchestrator-hurl-reports
          path: e2e/reports/acolyte-orchestrator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  tag-generator:
    name: tag-generator Hurl suite
    needs: changes
    if: needs.changes.outputs.tag_generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build tag-generator image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-tag-generator:buildcache \
            -t ghcr.io/kaikei-e/alt-tag-generator:ci \
            -f tag-generator/Dockerfile.tag-generator \
            tag-generator

      # Scenario 04 round-trips through mq-hub's GenerateTagsForArticle
      # RPC, so we need its image available to the staging stack too.
      - name: Build mq-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-mq-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-mq-hub:ci \
            -f mq-hub/Dockerfile \
            mq-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run tag-generator Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/tag-generator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # docker compose logs without --profile silently omits services
          # whose profile isn't active, which is exactly the services we
          # need to diagnose. Go directly through docker logs on the
          # explicit container names from compose.staging.yaml.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          for svc in tag-generator mq-hub redis-streams stub-backend; do
            echo "===== alt-staging-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tag-generator-hurl-reports
          path: e2e/reports/tag-generator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  auth-hub:
    name: auth-hub Hurl suite
    needs: changes
    if: needs.changes.outputs.auth_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build auth-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-auth-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-auth-hub:ci \
            -f auth-hub/Dockerfile \
            auth-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run auth-hub Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/auth-hub/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # auth-hub's profile-gated services aren't surfaced by
          # `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
