# E2E Hurl suites (one job per service under e2e/hurl/).
#
# Every suite runs on every PR and every push to main, with no path
# filtering. Selective skipping by touched path lets a shared-wiring
# regression (compose.staging.yaml, fixtures, an upstream Go package,
# proto) land green because it matches no service path. Cost is bounded
# by importing the registry layer cache rather than by skipping suites.
#
# To add another service's suite later, append a sibling job and keep
# existing job names stable.

name: E2E Hurl

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-hurl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mq-hub:
    name: mq-hub Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build mq-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-mq-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-mq-hub:ci \
            -f mq-hub/Dockerfile \
            mq-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run mq-hub Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          # Leave stack up on failure so the next step can dump logs; the
          # runner VM is torn down after the job anyway.
          KEEP_STACK: 1
        run: bash e2e/hurl/mq-hub/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            logs --no-color --tail=200 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mq-hub-hurl-reports
          path: e2e/reports/mq-hub-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  recap-worker:
    name: recap-worker Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # recap-worker's image bundles libtorch (~600MB download) +
      # cargo-chef cooks the workspace, so a cold build dominates this job.
      # The registry cache import below is what keeps it off the critical path.
      - name: Build recap-worker image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-recap-worker:buildcache \
            -t ghcr.io/kaikei-e/alt-recap-worker:ci \
            -f recap-worker/Dockerfile.recap-worker \
            recap-worker

      - name: Warmup rust-bert cache (internet-connected, bind mount)
        # The staging compose brings the stack up on an `internal: true`
        # network, so rust-bert cannot reach HuggingFace from inside.
        # Populate /opt/rustbert-cache on the runner host before the
        # staging stack starts; compose mounts the same path read-only.
        # recap uid/gid are pinned to 999 in the image, so the host dir
        # must be chown'd to 999:999 for the warmup container to write.
        run: |
          sudo mkdir -p /opt/rustbert-cache
          sudo chown -R 999:999 /opt/rustbert-cache
          docker run --rm \
            -v /opt/rustbert-cache:/opt/rustbert-cache \
            ghcr.io/kaikei-e/alt-recap-worker:ci warmup

      - name: Build recap-pipeline-stub image locally (tag `ci`)
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-recap-pipeline-stub:ci \
            e2e/stubs/recap-pipeline-stub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run recap-worker Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/recap-worker/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # recap-worker is profile-gated in compose.staging.yaml, so a
          # bare `docker compose logs` silently returns nothing. Pass
          # --profile recap-worker so the dump actually matches the
          # services run.sh brought up (observed on run 24752223343
          # where the profile omission hid a SIGSEGV diagnostic).
          docker compose -f compose/compose.staging.yaml --profile recap-worker -p alt-staging \
            logs --no-color --tail=300 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: recap-worker-hurl-reports
          path: e2e/reports/recap-worker-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  news-creator:
    name: news-creator Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build news-creator image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-news-creator:buildcache \
            -t ghcr.io/kaikei-e/alt-news-creator:ci \
            -f news-creator/Dockerfile \
            news-creator

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run news-creator Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/news-creator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            logs --no-color --tail=300 || true

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: news-creator-hurl-reports
          path: e2e/reports/news-creator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  acolyte-orchestrator:
    name: acolyte-orchestrator Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run acolyte-orchestrator Hurl suite
        env:
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/acolyte-orchestrator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # acolyte-orchestrator's profile-gated services aren't surfaced
          # by `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          # Cover every container run.sh brings up so a request that
          # never reached its peer is visible from both ends of the wire.
          for svc in acolyte-orchestrator acolyte-db acolyte-db-migrator \
                     news-creator-ollama-stub \
                     search-indexer meilisearch stub-backend; do
            echo "===== alt-staging-$svc logs (tail=300) ====="
            docker logs --tail=300 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: acolyte-orchestrator-hurl-reports
          path: e2e/reports/acolyte-orchestrator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  tag-generator:
    name: tag-generator Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build tag-generator image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-tag-generator:buildcache \
            -t ghcr.io/kaikei-e/alt-tag-generator:ci \
            -f tag-generator/Dockerfile.tag-generator \
            tag-generator

      # Scenario 04 round-trips through mq-hub's GenerateTagsForArticle
      # RPC, so we need its image available to the staging stack too.
      - name: Build mq-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-mq-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-mq-hub:ci \
            -f mq-hub/Dockerfile \
            mq-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run tag-generator Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/tag-generator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # docker compose logs without --profile silently omits services
          # whose profile isn't active, which is exactly the services we
          # need to diagnose. Go directly through docker logs on the
          # explicit container names from compose.staging.yaml.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          for svc in tag-generator mq-hub redis-streams stub-backend; do
            echo "===== alt-staging-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tag-generator-hurl-reports
          path: e2e/reports/tag-generator-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  auth-hub:
    name: auth-hub Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build auth-hub image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-auth-hub:buildcache \
            -t ghcr.io/kaikei-e/alt-auth-hub:ci \
            -f auth-hub/Dockerfile \
            auth-hub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run auth-hub Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/auth-hub/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # auth-hub's profile-gated services aren't surfaced by
          # `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          for svc in auth-hub auth-hub-db auth-hub-db-migrator kratos; do
            echo "===== alt-staging-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: auth-hub-hurl-reports
          path: e2e/reports/auth-hub-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  rag-orchestrator:
    name: rag-orchestrator Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build rag-orchestrator image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-rag-orchestrator:buildcache \
            -t ghcr.io/kaikei-e/alt-rag-orchestrator:ci \
            -f rag-orchestrator/Dockerfile \
            rag-orchestrator

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run rag-orchestrator Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/rag-orchestrator/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # rag-orchestrator's profile-gated services aren't surfaced by
          # `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          # render-slice.sh strips `container_name:`, so compose auto-names
          # each container `<project>-<service>-1`. Naming them without the
          # index (as this step used to) makes every lookup a "No such
          # container" and the job's only evidence disappears.
          for svc in rag-orchestrator rag-db rag-db-migrator; do
            echo "===== alt-staging-$svc-1 logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-$svc-1" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rag-orchestrator-hurl-reports
          path: e2e/reports/rag-orchestrator-*
          if-no-files-found: ignore

      - name: Wipe throwaway mTLS fixtures
        if: always()
        run: rm -rf e2e/fixtures/rag-orchestrator/pki

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  knowledge-sovereign:
    name: knowledge-sovereign Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build knowledge-sovereign image locally (tag `ci`)
        run: |
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-knowledge-sovereign:buildcache \
            -t ghcr.io/kaikei-e/alt-knowledge-sovereign:ci \
            -f knowledge-sovereign/Dockerfile.sovereign \
            knowledge-sovereign

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run knowledge-sovereign Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          KEEP_STACK: 1
        run: bash e2e/hurl/knowledge-sovereign/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # knowledge-sovereign's profile-gated services aren't surfaced by
          # `docker compose logs` without the profile flag. Go through
          # docker logs on the explicit container names instead.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-" || true
          for svc in knowledge-sovereign knowledge-sovereign-db knowledge-sovereign-db-migrator; do
            echo "===== alt-staging-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-$svc" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: knowledge-sovereign-hurl-reports
          path: e2e/reports/knowledge-sovereign-*
          if-no-files-found: ignore

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging \
            down -v --remove-orphans || true

  # The other two binaries of the alt-backend 3-binary split (ADR-000954).
  # Both build from alt-backend/Dockerfile.backend with a different BINARY
  # build-arg, and both share the alt-backend suite's Postgres + migrator +
  # deps stub through the widened `profiles:` lists in compose.staging.yaml.
  #
  # STAGING_PROJECT_NAME is set here and not on the alt-backend job above:
  # each of these renders its own slice (e2e/hurl/_lib/render-slice.sh) and
  # names its network after the project, so a distinct name is what keeps two
  # suites from fighting over `alt-staging` if they ever share a daemon.
  alt-harvester:
    name: alt-harvester Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build alt-harvester image locally (tag `ci`)
        run: |
          # Same module and Dockerfile as alt-backend; BINARY selects
          # ./cmd/harvester. The buildcache is alt-backend's because the
          # dependency layer sits above `ARG BINARY` and is byte-identical
          # across all three images.
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            --build-arg BINARY=harvester \
            -t ghcr.io/kaikei-e/alt-alt-harvester:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-data-hub image locally (tag `ci`)
        run: |
          # cmd/harvester holds no DB pool either — every job reads and writes
          # through DataHubService, so the slice runs the real data plane.
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            --build-arg BINARY=datahub \
            -t ghcr.io/kaikei-e/alt-alt-data-hub:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-backend-deps-stub image locally (tag `ci`)
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-alt-backend-deps-stub:ci \
            e2e/stubs/alt-backend-deps-stub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run alt-harvester Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          STAGING_PROJECT_NAME: alt-staging-alt-harvester
          KEEP_STACK: 1
        run: bash e2e/hurl/alt-harvester/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          # The suite runs against a rendered slice under mktemp -d that is
          # gone by now, so go through docker logs on the container names
          # compose derived from the project name.
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-alt-harvester" || true
          for svc in alt-harvester alt-data-hub alt-backend-db alt-backend-db-migrator alt-backend-deps-stub; do
            echo "===== alt-staging-alt-harvester-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-alt-harvester-$svc-1" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-harvester-hurl-reports
          path: e2e/reports/alt-harvester-*
          if-no-files-found: ignore

      - name: Wipe throwaway mTLS fixtures
        # run.sh's own trap skips this under KEEP_STACK=1 (the certificates are
        # still bind-mounted into a live container). See the alt-data-hub job.
        if: always()
        run: rm -rf e2e/fixtures/alt-harvester/pki

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging-alt-harvester \
            --profile alt-harvester down -v --remove-orphans || true

  alt-data-hub:
    name: alt-data-hub Hurl suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build alt-data-hub image locally (tag `ci`)
        run: |
          # BINARY selects ./cmd/datahub. See the alt-harvester job for why
          # this imports alt-backend's buildcache.
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/kaikei-e/alt-alt-backend:buildcache \
            --build-arg BINARY=datahub \
            -t ghcr.io/kaikei-e/alt-alt-data-hub:ci \
            -f alt-backend/Dockerfile.backend \
            alt-backend

      - name: Build alt-backend-deps-stub image locally (tag `ci`)
        run: |
          docker build \
            -t ghcr.io/kaikei-e/alt-alt-backend-deps-stub:ci \
            e2e/stubs/alt-backend-deps-stub

      - name: Pre-pull Hurl image
        run: docker pull ghcr.io/orange-opensource/hurl:7.1.0

      - name: Run alt-data-hub Hurl suite
        env:
          IMAGE_TAG: ci
          GHCR_OWNER: kaikei-e
          HURL_IMAGE: ghcr.io/orange-opensource/hurl:7.1.0
          STAGING_PROJECT_NAME: alt-staging-alt-data-hub
          KEEP_STACK: 1
        run: bash e2e/hurl/alt-data-hub/run.sh

      - name: Dump alt-staging logs on failure
        if: failure()
        run: |
          echo "===== docker ps -a ====="
          docker ps -a --filter "name=alt-staging-alt-data-hub" || true
          for svc in alt-data-hub alt-backend-db alt-backend-db-migrator alt-backend-deps-stub; do
            echo "===== alt-staging-alt-data-hub-$svc logs (tail=500) ====="
            docker logs --tail=500 "alt-staging-alt-data-hub-$svc-1" 2>&1 || true
          done

      - name: Upload Hurl reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: alt-data-hub-hurl-reports
          path: e2e/reports/alt-data-hub-*
          if-no-files-found: ignore

      - name: Wipe throwaway mTLS fixtures
        # run.sh's own trap skips this under KEEP_STACK=1 (the certificates
        # are still bind-mounted into a live container). The runner is
        # ephemeral, but private keys under the workspace would otherwise be
        # in scope for the artifact upload step of any later job.
        if: always()
        run: rm -rf e2e/fixtures/alt-data-hub/pki

      - name: Tear down alt-staging stack
        if: always()
        run: |
          docker compose -f compose/compose.staging.yaml -p alt-staging-alt-data-hub \
            --profile alt-data-hub down -v --remove-orphans || true
