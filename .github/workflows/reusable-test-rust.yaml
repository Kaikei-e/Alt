name: Reusable Rust Test Workflow
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      toolchain:
        required: false
        type: string
        default: "stable"
      upload-coverage:
        required: false
        type: boolean
        default: true
      coverage-flags:
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # GitHub-hosted runner: dtolnay/rust-toolchain を使用
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable branch head, 2026-07-31
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy

      - name: Rust version info
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # GitHub-hosted runner: Swatinem/rust-cache を使用（推奨）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: ${{ inputs.coverage-flags }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure target directory exists
        working-directory: ${{ inputs.working-directory }}
        run: |
          # rustc が dep-info (.d) を書き込むディレクトリが存在しない場合に備えて事前作成しておく
          mkdir -p target/release/deps

      - name: Run clippy
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: false

      - name: Run unit tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo test --all --verbose -- --nocapture
        env:
          RUST_BACKTRACE: full

      - name: Install cargo-tarpaulin
        if: inputs.upload-coverage && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # tarpaulinのインストール（キャッシュ済みかチェック）
          if ! command -v cargo-tarpaulin &> /dev/null; then
            cargo install cargo-tarpaulin
          fi

      - name: Generate coverage report
        if: inputs.upload-coverage && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo tarpaulin --out Xml --verbose
        continue-on-error: true # カバレッジが失敗してもビルドは成功とする

      - name: Upload coverage to Codecov
        if: inputs.upload-coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ${{ inputs.working-directory }}/tarpaulin-report.xml
          flags: ${{ inputs.coverage-flags }}
          name: ${{ inputs.coverage-flags }}-coverage
          verbose: false
