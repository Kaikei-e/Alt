name: CodeQL (Go)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "alt-backend/**"
      - "pre-processor/**"
      - "pre-processor-sidecar/**"
      - "search-indexer/**"
      - "auth-hub/**"
  pull_request:
    branches: [main, master]
    paths:
      - "alt-backend/**"
      - "pre-processor/**"
      - "pre-processor-sidecar/**"
      - "search-indexer/**"
      - "auth-hub/**"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: true

jobs:
  analyze-go:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Mask sensitive paths and git information
        run: |
          echo "::group::Masking Configuration"

          # Mask Runner Identity
          echo "::add-mask::$(hostname)"
          echo "::add-mask::$(whoami)"

          # Mask Absolute Paths
          [ -n "$HOME" ] && echo "::add-mask::$HOME"
          [ -n "$GITHUB_WORKSPACE" ] && echo "::add-mask::$GITHUB_WORKSPACE"
          [ -n "$RUNNER_TEMP" ] && echo "::add-mask::$RUNNER_TEMP"

          # Mask Git PII
          if command -v git >/dev/null 2>&1; then
            echo "::add-mask::$(git log -1 --pretty=format:'%an')"
            echo "::add-mask::$(git log -1 --pretty=format:'%ae')"
            echo "::add-mask::$(git log -1 --pretty=format:'%cn')"
            echo "::add-mask::$(git log -1 --pretty=format:'%ce')"
          fi

          echo "::endgroup::"

      # CodeQL 実行前にディスクの空きを増やす
      - name: Free disk space before CodeQL
        run: |
          echo "Before cleanup:"
          df -h

          # 重いツール類があれば削除（存在チェック付き）
          if [ -d "/usr/share/dotnet" ]; then
            sudo rm -rf /usr/share/dotnet &
          fi

          if [ -d "/usr/local/lib/android" ]; then
            sudo rm -rf /usr/local/lib/android &
          fi

          if [ -d "/usr/local/share/boost" ]; then
            sudo rm -rf /usr/local/share/boost &
          fi

          # Deleted in parallel: /usr/local/lib/android alone is ~9GB and
          # dominates, so serialising these cost ~2min per run. Docker image
          # pruning was dropped — no image is built in a language-scoped
          # CodeQL analysis, so it freed nothing.
          wait

          echo "After cleanup:"
          df -h

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # 解析対象をさらに絞りたい場合は、以下を調整してください
          # paths: alt-backend,pre-processor,pre-processor-sidecar,search-indexer,auth-hub
          # paths-ignore: tmp,dist,vendor

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
