permissions:
  contents: read

concurrency:
  group: compose-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install --quiet 'pyyaml==6.*'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: false

      - name: Install the Compose build production renders with
        run: ./scripts/ci-install-compose.sh

      - name: Provision pinned official lkal and kisage v0.1.2 binaries
        run: |
          make install-lkal install-kisage
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/lkal"
          test -x "$HOME/.local/bin/kisage"

      - name: Run compose static checks
        env:
          TARGET: compose
        run: ./scripts/lint/run.sh "$TARGET"
