# compose-audit — protect production deploys from the failure class that
# stranded alt-butterfly-facade on 2026-04-20 (release-deploy run 24643555145,
# deploy job exit 1 with "has no healthcheck configured" from a
# `depends_on: condition: service_healthy` target).
#
# The precise trigger: compose rejects `up -d --wait --no-deps <svc>` when
# any service in the matrix has a `depends_on.<other>.condition:
# service_healthy` entry whose target lacks a `healthcheck` block. The
# already-running dependency cannot be inspected for health, and compose
# fails loudly. The release-deploy deploy step then aborts before cascade
# / smoke / record-deployment, leaving containers stranded mid-recreate.
#
# This workflow enumerates every `service_healthy` edge across
# compose/compose.yaml (the full production include chain) and fails if
# any target is missing `healthcheck`. Running it on every push to main
# turns the latent regression (caught only at deploy time against prod)
# into a fast PR / trunk-push gate.
#
# Scope note: the audit is intentionally narrow. Long-running services
# that are NOT the target of a `service_healthy` edge are NOT required
# to have healthchecks here — some rask-log-forwarder sidecars and
# prometheus exporters do not participate in the compose-up dependency
# graph and their absence does not abort `up --wait`. A broader "every
# long-running service needs a healthcheck" audit is out of scope; this
# one targets only the abort-triggering subset.

name: compose-audit

on:
  push:
    branches: [main]
    paths:
      - 'compose/**.yaml'
      - 'compose/**.yml'
      - 'scripts/compose-port-audit.py'
      - 'scripts/compose-netns-cascade-audit.py'
      - 'scripts/tests/test-compose-netns-cascade-audit.py'
      - 'scripts/cascade-pki-sidecars.sh'
      - 'scripts/check-compose-variables.sh'
      - '.env.template'
      - '.github/workflows/compose-audit.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'compose/**.yaml'
      - 'compose/**.yml'
      - 'scripts/compose-port-audit.py'
      - 'scripts/compose-netns-cascade-audit.py'
      - 'scripts/tests/test-compose-netns-cascade-audit.py'
      - 'scripts/cascade-pki-sidecars.sh'
      - 'scripts/check-compose-variables.sh'
      - '.env.template'
      - '.github/workflows/compose-audit.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Stage a dummy .env so compose config resolves
        run: |
          # compose/*.yaml uses ${MEILISEARCH_HOST}, ${GHCR_OWNER}, etc.
          # A minimal dummy .env satisfies the interpolation without
          # reading prod secrets (the runner has none anyway).
          # logging.yaml requires DOCKER_GROUP_ID (fail-fast, no host-magic
          # default) — any numeric GID is fine for `compose config` audit.
          {
            echo 'DOCKER_GROUP_ID=0'
          } > .env

      - name: Assert every service_healthy target has a healthcheck
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys, yaml
          proc = subprocess.run(
              ["docker", "compose", "--env-file", ".env", "-f", "compose/compose.yaml", "config"],
              capture_output=True, text=True,
          )
          if proc.returncode != 0:
              sys.stderr.write(proc.stderr or proc.stdout or "compose config failed\n")
              sys.exit(proc.returncode)
          cfg = yaml.safe_load(proc.stdout)
          services = cfg.get("services", {})
          violations = []
          for name, svc in services.items():
              deps = svc.get("depends_on") or {}
              if not isinstance(deps, dict):
                  # Short-form `depends_on: [a, b]` does not specify
                  # `service_healthy`, so no abort risk; skip.
                  continue
              for dep_name, dep_cfg in deps.items():
                  if not isinstance(dep_cfg, dict):
                      continue
                  if dep_cfg.get("condition") != "service_healthy":
                      continue
                  target = services.get(dep_name)
                  if target is None:
                      violations.append(f"{name} -> {dep_name} (target service not defined)")
                      continue
                  if target.get("healthcheck") is None:
                      violations.append(
                          f"{name} depends_on.{dep_name}.condition=service_healthy "
                          f"but {dep_name} has no healthcheck"
                      )
          if violations:
              print("::error::service_healthy edges with missing target healthcheck:")
              for v in violations:
                  print(f"  - {v}")
              print(
                  "::notice::Add a `healthcheck:` block to each target service, "
                  "or drop the `condition: service_healthy` if the dependency is "
                  "start-only. See compose/recap.yaml recap-subworker for a "
                  "Python urllib.request reference pattern."
              )
              sys.exit(1)
          print(f"OK: {len(services)} services checked, 0 violations")
          PY

  loopback-port-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Stage a dummy .env so compose config resolves
        # Several services carry `env_file: ../.env`, and compose config
        # refuses to resolve when the file is absent. On a developer host
        # .env is a symlink to the canonical config, which a public runner
        # has no equivalent of — same dummy as the job above.
        run: echo 'DOCKER_GROUP_ID=0' > .env

      - name: Assert every published port is loopback-bound
        run: python3 scripts/compose-port-audit.py

  netns-cascade-invariant:
    # `network_mode: service:X` pins the sidecar to the parent's container id,
    # and `depends_on.restart: true` does not fire on a force-recreate of the
    # parent alone — so recreating the parent leaves the sidecar attached to a
    # dead netns with no listener and no error. scripts/cascade-pki-sidecars.sh
    # repairs that, but only for the sidecars hand-listed in it, and the list
    # has already fallen behind compose once. This job is what keeps the two
    # in step. No .env or docker needed: the audit reads the compose files.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pin the audit parsers
        run: python3 scripts/tests/test-compose-netns-cascade-audit.py

      - name: Assert every netns-sharing sidecar is covered by the cascade script
        run: python3 scripts/compose-netns-cascade-audit.py

  interpolation-invariant:
    # An unset `${VAR}` renders as an empty string and only warns on stderr,
    # so an incomplete env file reaches production as a service configured
    # with "" (PM-2026-048: a wrong Meilisearch key ran for 24 hours).
    # scripts/check-compose-variables.sh gates the deploy against the host's
    # real .env; this job runs the same gate against .env.template, so the
    # template stays a complete render input instead of drifting behind
    # compose/ until the next operator sets up a host from it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Stage .env.template as the render input
        run: |
          # compose/compose.yaml is a pure `include:` aggregator and every
          # included file interpolates against the .env in its own directory,
          # so the template must be staged at compose/.env as well — a
          # top-level `--env-file` does not reach the includes. Root .env is
          # separately required because services carry `env_file: ../.env`.
          # DOCKER_GROUP_ID is the one `${VAR:?}` variable and is derived from
          # the host (scripts/get-docker-gid.sh), so it is intentionally not
          # in the template; any numeric GID renders.
          { cat .env.template; echo; echo 'DOCKER_GROUP_ID=0'; } > .env
          cp .env compose/.env

      - name: Assert .env.template resolves every interpolation variable
        run: ./scripts/check-compose-variables.sh
