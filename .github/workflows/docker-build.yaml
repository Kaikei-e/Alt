name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Superseded PR runs are cancelled. Main-branch runs are not: dispatch-deploy
# fires on the same push and alt-deploy expects the sha-tagged images to land.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}

    steps:
      - name: Get workspace parent GID
        if: runner.environment == 'self-hosted'
        id: get-gid
        run: echo "gid=$(stat -c '%g' "$GITHUB_WORKSPACE/..")" >> $GITHUB_OUTPUT

      - name: Pre-checkout cleanup
        if: runner.environment == 'self-hosted'
        uses: docker://alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
        env:
          RUNNERS_GID: ${{ steps.get-gid.outputs.gid }}
        with:
          entrypoint: /bin/sh
          args: -c "rm -rf /github/workspace/.git /github/workspace/* /github/workspace/.[!.]* 2>/dev/null; chgrp $RUNNERS_GID /github/workspace 2>/dev/null; chmod 2775 /github/workspace"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so we can diff against the correct base across
          # squash-merges, rebase-merges, and first pushes where HEAD~1
          # would resolve to the wrong commit (or not exist at all).
          fetch-depth: 0

      - name: Configure logging (mask)
        if: runner.environment == 'self-hosted'
        run: |
          echo "::add-mask::$(hostname)"
          echo "::add-mask::$(whoami)"
          [ -n "$HOME" ] && echo "::add-mask::$HOME"

      - name: Detect changed services
        id: set-matrix
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Service list regenerated from services.yaml by
          # scripts/regen-service-registry.py. Do not hand-edit the
          # SERVICES=(...) block below — edit services.yaml and run the
          # regen script. CI (.github/workflows/services-registry-lint.yaml)
          # fails on drift.
          #
          # Scope: every Pact pacticipant from c2quay.yml (so ADR-000763's
          # pull-based deploy has an image per gate check) plus the runtime
          # services referenced by compose that need versioned images
          # (pki-agent, knowledge-sovereign, dashboard, etc.). Migration
          # containers, DB containers, and local perf tooling are excluded,
          # as are `kind: external` registry entries, which reach c2quay but
          # are not built here.
          # <<<SERVICES-REGISTRY-BEGIN>>>
          SERVICES=(
            # --- 13 Pact pacticipants (mirrors c2quay.yml) ---
            "alt-backend"
            "alt-butterfly-facade"
            "auth-hub"
            "pre-processor"
            "search-indexer"
            "mq-hub"
            "rag-orchestrator"
            "recap-worker"
            "recap-subworker"
            "recap-evaluator"
            "news-creator"
            "tag-generator"
            "acolyte-orchestrator"
            "knowledge-sovereign"
            # --- Additional runtime services used by compose ---
            "alt-harvester"
            "alt-data-hub"
            "alt-notifier"
            "alt-frontend-sv"
            "pre-processor-sidecar"
            "auth-token-manager"
            "rask-log-aggregator"
            "rask-log-forwarder"
            "pki-agent"
            "dashboard"
          )

          # Build inputs per service. BUILD_DIR doubles as the
          # change-detection prefix, so several services can share one
          # source directory. An empty BUILD_DOCKERFILE means "discover
          # it under BUILD_DIR"; an empty BUILD_BINARY means no
          # --build-arg BINARY. Defaults reproduce the historical
          # name-is-the-directory rule.
          declare -A BUILD_DIR=(
            ["alt-backend"]="alt-backend"
            ["alt-butterfly-facade"]="alt-butterfly-facade"
            ["auth-hub"]="auth-hub"
            ["pre-processor"]="pre-processor"
            ["search-indexer"]="search-indexer"
            ["mq-hub"]="mq-hub"
            ["rag-orchestrator"]="rag-orchestrator"
            ["recap-worker"]="recap-worker"
            ["recap-subworker"]="recap-subworker"
            ["recap-evaluator"]="recap-evaluator"
            ["news-creator"]="news-creator"
            ["tag-generator"]="tag-generator"
            ["acolyte-orchestrator"]="acolyte-orchestrator"
            ["knowledge-sovereign"]="knowledge-sovereign"
            ["alt-harvester"]="alt-backend"
            ["alt-data-hub"]="alt-backend"
            ["alt-notifier"]="alt-backend"
            ["alt-frontend-sv"]="alt-frontend-sv"
            ["pre-processor-sidecar"]="pre-processor-sidecar"
            ["auth-token-manager"]="auth-token-manager"
            ["rask-log-aggregator"]="rask-log-aggregator"
            ["rask-log-forwarder"]="rask-log-forwarder"
            ["pki-agent"]="pki-agent"
            ["dashboard"]="dashboard"
          )
          declare -A BUILD_DOCKERFILE=(
            ["alt-backend"]="alt-backend/Dockerfile.backend"
            ["alt-butterfly-facade"]=""
            ["auth-hub"]=""
            ["pre-processor"]=""
            ["search-indexer"]=""
            ["mq-hub"]=""
            ["rag-orchestrator"]=""
            ["recap-worker"]=""
            ["recap-subworker"]=""
            ["recap-evaluator"]=""
            ["news-creator"]=""
            ["tag-generator"]=""
            ["acolyte-orchestrator"]=""
            ["knowledge-sovereign"]=""
            ["alt-harvester"]="alt-backend/Dockerfile.backend"
            ["alt-data-hub"]="alt-backend/Dockerfile.backend"
            ["alt-notifier"]="alt-backend/Dockerfile.backend"
            ["alt-frontend-sv"]=""
            ["pre-processor-sidecar"]=""
            ["auth-token-manager"]=""
            ["rask-log-aggregator"]=""
            ["rask-log-forwarder"]=""
            ["pki-agent"]=""
            ["dashboard"]=""
          )
          declare -A BUILD_BINARY=(
            ["alt-backend"]="backend"
            ["alt-butterfly-facade"]=""
            ["auth-hub"]=""
            ["pre-processor"]=""
            ["search-indexer"]=""
            ["mq-hub"]=""
            ["rag-orchestrator"]=""
            ["recap-worker"]=""
            ["recap-subworker"]=""
            ["recap-evaluator"]=""
            ["news-creator"]=""
            ["tag-generator"]=""
            ["acolyte-orchestrator"]=""
            ["knowledge-sovereign"]=""
            ["alt-harvester"]="harvester"
            ["alt-data-hub"]="datahub"
            ["alt-notifier"]="notifier"
            ["alt-frontend-sv"]=""
            ["pre-processor-sidecar"]=""
            ["auth-token-manager"]=""
            ["rask-log-aggregator"]=""
            ["rask-log-forwarder"]=""
            ["pki-agent"]=""
            ["dashboard"]=""
          )
          # <<<SERVICES-REGISTRY-END>>>

          CHANGED=""
          ZERO_SHA="0000000000000000000000000000000000000000"

          # Resolve BASE…HEAD across event kinds:
          #   push:tag       → build all
          #   push:branch    → $BEFORE..$AFTER (two-dot, linear history)
          #                    $BEFORE == zero SHA: first push to branch → build all
          #   pull_request   → $BASE...$HEAD (three-dot, merge-base aware)
          # $CHANGED_FILES is newline-separated, fed to the prefix match.
          BUILD_ALL=false
          CHANGED_FILES=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUILD_ALL=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="${PR_BASE_SHA}"
            HEAD="${PR_HEAD_SHA}"
            if [[ -n "$BASE" && -n "$HEAD" && "$BASE" != "$HEAD" ]]; then
              CHANGED_FILES=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)
            fi
          else
            BEFORE="${PUSH_BEFORE}"
            AFTER="${GITHUB_SHA}"
            if [[ "$BEFORE" == "$ZERO_SHA" || -z "$BEFORE" ]]; then
              BUILD_ALL=true    # first push to branch — no historical diff
            elif [[ "$BEFORE" != "$AFTER" ]]; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE..$AFTER" 2>/dev/null || true)
            fi
          fi

          # Shared-paths escape hatch: a change to any file outside a
          # specific service directory can still affect every service.
          # Examples: shared proto definitions, docker base images,
          # docker-build.yaml itself, Go workspace pinning. Paths that
          # are intentionally excluded:
          #   - compose/compose.staging.yaml (E2E stack only; production
          #     rebuild not required when staging profiles change)
          #   - docs/, README, tests outside service dirs, etc.
          if [[ "$BUILD_ALL" != "true" && -n "$CHANGED_FILES" ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                compose/compose.staging.yaml)
                  ;;   # staging-only — not a production trigger
                compose/*|docker/*|proto/*|go.work|go.work.sum|.github/workflows/docker-build.yaml)
                  BUILD_ALL=true
                  break ;;
              esac
            done <<< "$CHANGED_FILES"
            if [[ "$BUILD_ALL" == "true" ]]; then
              echo "Shared-path change detected — rebuilding all services."
            fi
          fi

          # Matrix entries are objects, not bare names: the build job needs
          # the source directory and Dockerfile separately from the image
          # name now that alt-backend/ produces three images. Change
          # detection keys on BUILD_DIR for the same reason — a commit
          # touching alt-backend/ must rebuild all three.
          emit() {
            local svc="$1"
            local dir="${BUILD_DIR[$svc]:-$svc}"
            local dockerfile="${BUILD_DOCKERFILE[$svc]:-}"
            local binary="${BUILD_BINARY[$svc]:-}"
            CHANGED="$CHANGED{\"service\":\"$svc\",\"dir\":\"$dir\",\"dockerfile\":\"$dockerfile\",\"binary\":\"$binary\"},"
          }

          if [[ "$BUILD_ALL" == "true" ]]; then
            for svc in "${SERVICES[@]}"; do
              emit "$svc"
            done
          else
            for svc in "${SERVICES[@]}"; do
              if echo "$CHANGED_FILES" | grep -q "^${BUILD_DIR[$svc]:-$svc}/"; then
                emit "$svc"
              fi
            done
          fi

          # `include` with no base axes gives exactly one job per entry, with
          # every key exposed as matrix.<key>.
          if [ -n "$CHANGED" ]; then
            MATRIX="{\"include\":[${CHANGED%,}]}"
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed services: ${CHANGED%,}"
          else
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No service changes detected"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Set lowercase owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Get workspace parent GID
        if: runner.environment == 'self-hosted'
        id: get-gid
        run: echo "gid=$(stat -c '%g' "$GITHUB_WORKSPACE/..")" >> $GITHUB_OUTPUT

      - name: Pre-checkout cleanup
        if: runner.environment == 'self-hosted'
        uses: docker://alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
        env:
          RUNNERS_GID: ${{ steps.get-gid.outputs.gid }}
        with:
          entrypoint: /bin/sh
          args: -c "rm -rf /github/workspace/.git /github/workspace/* /github/workspace/.[!.]* 2>/dev/null; chgrp $RUNNERS_GID /github/workspace 2>/dev/null; chmod 2775 /github/workspace"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            ${{ matrix.dir }}
            docker
          sparse-checkout-cone-mode: true

      - name: Configure logging (mask)
        if: runner.environment == 'self-hosted'
        run: |
          echo "::add-mask::$(hostname)"
          echo "::add-mask::$(whoami)"
          [ -n "$HOME" ] && echo "::add-mask::$HOME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.31.2
            network=host

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/alt-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Find Dockerfile
        id: dockerfile
        env:
          SERVICE: ${{ matrix.service }}
          DIR: ${{ matrix.dir }}
          DECLARED: ${{ matrix.dockerfile }}
        run: |
          # services.yaml may state the path outright. It has to when one
          # directory builds several images: `find | head -1` would pick an
          # arbitrary Dockerfile, and Dockerfile.<service> cannot match more
          # than one of them. When it is silent, fall back to the historical
          # discovery order so the services that never needed a build: block
          # behave exactly as before.
          if [ -n "$DECLARED" ]; then
            if [ ! -f "$DECLARED" ]; then
              echo "::error::services.yaml declares $DECLARED for $SERVICE but it does not exist"
              exit 1
            fi
            echo "path=$DECLARED" >> $GITHUB_OUTPUT
          elif [ -f "$DIR/Dockerfile" ]; then
            echo "path=$DIR/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "$DIR/Dockerfile.$SERVICE" ]; then
            echo "path=$DIR/Dockerfile.$SERVICE" >> $GITHUB_OUTPUT
          else
            DOCKERFILE=$(find "$DIR" -maxdepth 1 -name 'Dockerfile*' | head -1)
            if [ -n "$DOCKERFILE" ]; then
              echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT
            else
              echo "::error::No Dockerfile found for $SERVICE (dir: $DIR)"
              exit 1
            fi
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./${{ matrix.dir }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('["recap-subworker","news-creator","recap-evaluator","tag-generator","recap-worker"]'), matrix.service) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stable build identifier. alt-frontend-sv pins SvelteKit's app
          # version to it (svelte.config.js); other Dockerfiles ignore it.
          # BINARY selects ./cmd/<BINARY> for the alt-backend trio. Emitted
          # only when services.yaml declares one — passing an empty
          # BINARY= to the 21 Dockerfiles that never declare the ARG would
          # produce an unused-build-arg warning on every one of them.
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            ${{ matrix.binary && format('BINARY={0}', matrix.binary) || '' }}
          # Registry cache: 常時 read/write 可 (GHCR ACL で保護)。
          # GHA cache: public repo だと fork PR から読める仕様のため、cache-from/to
          # とも main branch への push イベント限定。PR ビルドは registry のみ参照。
          # OWASP A08 / CWE-494 (cache poisoning) 対策。
          #
          # 2 本目の registry ref は「1 ディレクトリ = 複数イメージ」用。
          # alt-harvester / alt-data-hub は alt-backend と同一 Dockerfile を
          # 使い、`go mod download` レイヤは ARG BINARY より前にあるので 3
          # イメージで digest が一致する。dir と同名のサービス
          # (= alt-backend) の buildcache を read しておくと、その依存レイヤ
          # が確実に温まる。write は自分の ref にのみ行うので相互汚染はない。
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/alt-${{ matrix.service }}:buildcache
            ${{ (matrix.dir != matrix.service) && format('type=registry,ref=ghcr.io/{0}/alt-{1}:buildcache', steps.repo.outputs.owner, matrix.dir) || '' }}
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('type=gha,scope={0}', matrix.service) || '' }}
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('type=registry,ref=ghcr.io/{0}/alt-{1}:buildcache,mode=max', steps.repo.outputs.owner, matrix.service) || '' }}

      - name: Enforce image-size budget and smoke-check core imports
        if: contains(fromJSON('["recap-subworker","news-creator","recap-evaluator","tag-generator","recap-worker"]'), matrix.service) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # The tags output rather than fromJSON(meta.outputs.json): a job that
          # fails before Docker meta runs leaves json empty, and fromJSON('')
          # is a template error that fails the job with "Error reading JToken"
          # instead of the real cause.
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          IMAGE_TAG=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          case "$SERVICE" in
            recap-subworker)  MAX_MB=2900 ;;
            news-creator)     MAX_MB=1800 ;;
            recap-evaluator)  MAX_MB=2500 ;;
            tag-generator)    MAX_MB=2900 ;;
            recap-worker)     MAX_MB=2900 ;;
          esac
          SIZE_BYTES=$(docker image inspect "$IMAGE_TAG" --format '{{.Size}}')
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          echo "$SERVICE image size: ${SIZE_MB} MiB (budget ${MAX_MB} MiB)"
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "::error::$SERVICE image (${SIZE_MB} MiB) exceeds budget (${MAX_MB} MiB)"
            exit 1
          fi
          # security-auditor F-004: smoke-check runs unprivileged with no network.
          # Any imports that need DNS/egress should be caught by this isolation.
          RUN_OPTS="--rm --network=none --read-only --tmpfs /tmp --cap-drop=ALL"
          if [ "$SERVICE" = "news-creator" ]; then
            docker run $RUN_OPTS -e SERVICE_SECRET=ci "$IMAGE_TAG" python -c "
          import sys, importlib
          import torch
          assert not torch.cuda.is_available(), 'torch CUDA must be disabled'
          for m in ('nvidia', 'triton'):
              try:
                  importlib.import_module(m)
                  sys.exit(f'{m} must not be installed')
              except ImportError:
                  pass
          from sentence_transformers import CrossEncoder  # noqa: F401
          from news_creator.usecase import rerank_usecase  # noqa: F401
          import main  # noqa: F401
          print('smoke OK', torch.__version__)
          "
          elif [ "$SERVICE" = "recap-evaluator" ]; then
            docker run $RUN_OPTS "$IMAGE_TAG" python -c "
          import sys, importlib
          import asyncpg, torch, bert_score, rouge_score, recap_evaluator  # noqa: F401
          assert not torch.cuda.is_available(), 'torch CUDA must be disabled'
          for m in ('nvidia', 'triton'):
              try:
                  importlib.import_module(m)
                  sys.exit(f'{m} must not be installed')
              except ImportError:
                  pass
          print('smoke OK', torch.__version__, asyncpg.__version__)
          "
          elif [ "$SERVICE" = "tag-generator" ]; then
            docker run $RUN_OPTS "$IMAGE_TAG" python -c "
          import sys, importlib
          import torch, sentence_transformers, keybert, transformers, onnxruntime, fugashi, nltk  # noqa: F401
          from sentence_transformers import SentenceTransformer  # noqa: F401
          assert not torch.cuda.is_available(), 'torch CUDA must be disabled'
          for m in ('nvidia', 'triton'):
              try:
                  importlib.import_module(m)
                  sys.exit(f'{m} must not be installed')
              except ImportError:
                  pass
          print('smoke OK', torch.__version__, sentence_transformers.__version__)
          "
          elif [ "$SERVICE" = "recap-worker" ]; then
            # Rust binary: Python インタプリタは同梱しないので ldd で動的リンク解決を確認。
            # libtorch_cpu / libc10 / libgomp が必須 (libtorch prune で欠落していないこと)。
            docker run $RUN_OPTS --entrypoint=/bin/sh "$IMAGE_TAG" -c '
              set -e
              LDD_OUT=$(ldd /usr/local/bin/recap-worker)
              echo "$LDD_OUT"
              if echo "$LDD_OUT" | grep -q "not found"; then
                echo "::error::recap-worker has unresolved shared libraries"
                exit 1
              fi
              echo "$LDD_OUT" | grep -q libtorch_cpu.so || { echo "::error::libtorch_cpu.so missing"; exit 1; }
              echo "$LDD_OUT" | grep -q libc10.so       || { echo "::error::libc10.so missing"; exit 1; }
              echo "$LDD_OUT" | grep -q libgomp         || { echo "::error::libgomp missing"; exit 1; }
              echo "smoke OK recap-worker"
            '
          else
            docker run $RUN_OPTS "$IMAGE_TAG" python -c "
          import sys, importlib
          import asyncpg, torch
          assert not torch.cuda.is_available(), 'torch CUDA must be disabled'
          for m in ('nvidia', 'triton'):
              try:
                  importlib.import_module(m)
                  sys.exit(f'{m} must not be installed')
              except ImportError:
                  pass
          print('smoke OK', torch.__version__, asyncpg.__version__)
          "
          fi

