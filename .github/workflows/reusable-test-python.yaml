name: Reusable Python Test Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.13"
      test-command:
        required: false
        type: string
        default: "pytest -v --cov=. --cov-report=xml --junit-xml=tests/results.xml"
      use-oidc:
        required: false
        type: boolean
        default: false
      use-local-persistent-cache:
        required: false
        type: boolean
        default: false
      upload-coverage:
        required: false
        type: boolean
        default: true
      coverage-flags:
        required: false
        type: string
        default: ""
      sparse-checkout:
        required: false
        type: string
        default: "tag-generator"
      job-type:
        required: false
        type: string
        default: "test"
        description: "Job type: test, lint, security, typecheck"

jobs:
  python-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      UV_NO_CACHE_PRUNE: 1

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: true

      - name: Install uv (Rust-based tool)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Set up Python with uv
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uv python install "$PYTHON_VERSION"

      # ===== キャッシュ戦略 =====
      # 1) ローカル永続キャッシュ（sudo不要でHOME配下に固定）
      # ジョブ固有のキャッシュディレクトリを使用して並行実行時の競合を回避
      - name: Configure local persistent caches (HOME)
        if: ${{ inputs.use-local-persistent-cache }}
        env:
          JOB_TYPE: ${{ inputs.job-type }}
        run: |
          CACHE_BASE="$HOME/.cache/uv-${JOB_TYPE}-${GITHUB_RUN_ID}"
          TOOL_BASE="$HOME/.local/share/uv-${JOB_TYPE}-${GITHUB_RUN_ID}"
          mkdir -p "$CACHE_BASE" "$TOOL_BASE"
          echo "UV_CACHE_DIR=$CACHE_BASE" >> "$GITHUB_ENV"
          echo "UV_TOOL_DIR=$TOOL_BASE" >> "$GITHUB_ENV"

      # 2) ランナーがエフェメラル等でHOME永続化できない場合は、GitHub Cacheを併用
      - name: Restore uv cache (GitHub Cache)
        if: ${{ !inputs.use-local-persistent-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Configure uv cache (GitHub Cache mode)
        if: ${{ !inputs.use-local-persistent-cache }}
        run: |
          echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"
          echo "UV_TOOL_DIR=$HOME/.local/share/uv" >> "$GITHUB_ENV"

      - name: Sync project dependencies
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          uv sync --all-extras --dev

      - name: Python env (diagnostics)
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          uv python list
          echo "github.workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/$WORKING_DIRECTORY" || true

      # Job-specific actions based on job type
      - name: Run tests
        if: ${{ inputs.job-type == 'test' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        env:
          SERVICE_NAME: ${{ inputs.coverage-flags }}-test
        run: uv run ${{ inputs.test-command }}

      - name: Run linting (ruff check)
        if: ${{ inputs.job-type == 'lint' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # bandit's built-in default excludes do not include .venv, so it must be excluded explicitly to avoid scanning installed third-party packages.
      - name: Run security scan (bandit)
        if: ${{ inputs.job-type == 'security' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: uv run bandit -r . -f json -o bandit-report.json --exit-zero -x ./.venv,./node_modules,./.mypy_cache,./.pytest_cache,./.ruff_cache,./build,./dist

      - name: Run type checking
        if: ${{ inputs.job-type == 'typecheck' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: uv run pyrefly check
