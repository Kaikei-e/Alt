name: Reusable Python Test Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.14"
      test-command:
        required: false
        type: string
        default: "pytest -v --cov=. --cov-report=xml --junit-xml=tests/results.xml"
      use-local-persistent-cache:
        required: false
        type: boolean
        default: false
      coverage-flags:
        required: false
        type: string
        default: ""
      sparse-checkout:
        required: false
        type: string
        default: "tag-generator"
      job-type:
        required: false
        type: string
        default: "test"
        description: "Job type: test, lint"

jobs:
  python-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      UV_NO_CACHE_PRUNE: 1

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            ${{ inputs.sparse-checkout }}
            scripts/lint
            scripts/altharness
          sparse-checkout-cone-mode: true

      - name: Install uv (Rust-based tool)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python with uv
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uv python install "$PYTHON_VERSION"

      # ===== キャッシュ戦略 =====
      # 1) ローカル永続キャッシュ（sudo不要でHOME配下に固定）
      # ジョブ固有のキャッシュディレクトリを使用して並行実行時の競合を回避
      - name: Configure local persistent caches (HOME)
        if: ${{ inputs.use-local-persistent-cache }}
        env:
          JOB_TYPE: ${{ inputs.job-type }}
        run: |
          CACHE_BASE="$HOME/.cache/uv-${JOB_TYPE}-${GITHUB_RUN_ID}"
          TOOL_BASE="$HOME/.local/share/uv-${JOB_TYPE}-${GITHUB_RUN_ID}"
          mkdir -p "$CACHE_BASE" "$TOOL_BASE"
          echo "UV_CACHE_DIR=$CACHE_BASE" >> "$GITHUB_ENV"
          echo "UV_TOOL_DIR=$TOOL_BASE" >> "$GITHUB_ENV"

      # 2) ランナーがエフェメラル等でHOME永続化できない場合は、GitHub Cacheを併用
      # Restore uv cache for both test and lint jobs (pyrefly runs with --all-extras).
      - name: Restore uv cache (GitHub Cache)
        if: ${{ !inputs.use-local-persistent-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Configure uv cache (GitHub Cache mode)
        if: ${{ !inputs.use-local-persistent-cache }}
        run: |
          echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"
          echo "UV_TOOL_DIR=$HOME/.local/share/uv" >> "$GITHUB_ENV"

      - name: Sync project dependencies
        if: ${{ inputs.job-type == 'test' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          uv sync --all-extras --dev

      - name: Python env (diagnostics)
        if: ${{ inputs.job-type == 'test' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          uv python list
          echo "github.workspace=$GITHUB_WORKSPACE"
          # swallow-ok: diagnostic directory listing must not fail the job
          ls -la "$GITHUB_WORKSPACE/$WORKING_DIRECTORY" || true

      # Job-specific actions based on job type
      - name: Run tests
        if: ${{ inputs.job-type == 'test' }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        env:
          SERVICE_NAME: ${{ inputs.coverage-flags }}-test
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "uv run $TEST_COMMAND"

      - name: Run Python static checks
        if: ${{ inputs.job-type == 'lint' }}
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: ./scripts/lint/run.sh "$PROJECT_DIR"
