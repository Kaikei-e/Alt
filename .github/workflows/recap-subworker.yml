name: Recap-Subworker Quality Gates
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "recap-subworker/**"
      - "compose/recap.yaml"
      - ".github/workflows/recap-subworker.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "recap-subworker/**"
      - "compose/recap.yaml"
      - ".github/workflows/recap-subworker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scope: tests/unit + tests/services. tests/contract is verified by
  # proto-contract.yaml, and tests/integration needs a live DB + model
  # artefacts that this hermetic runner does not provide.
  tests:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "recap-subworker"
      python-version: "3.14"
      sparse-checkout: |
        recap-subworker
        compose
      coverage-flags: "recap-subworker"
      upload-coverage: true
      job-type: "test"
      test-command: "pytest -v tests/unit tests/services --cov=recap_subworker --cov-report=xml --junit-xml=tests/results.xml"
    permissions:
      contents: read
    secrets: inherit

  lint:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "recap-subworker"
      python-version: "3.14"
      sparse-checkout: "recap-subworker"
      job-type: "lint"
    permissions:
      contents: read

  typecheck:
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: "recap-subworker"
      python-version: "3.14"
      sparse-checkout: "recap-subworker"
      job-type: "typecheck"
    permissions:
      contents: read

  # NOTE: The `security` job-type is deliberately absent: bandit is not in
  # recap-subworker's dev dependency group (unlike tag-generator / acolyte-orchestrator).
  # ruff's `S` ruleset is selected in pyproject.toml, so bandit rules run in the lint job.

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, lint, typecheck]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
