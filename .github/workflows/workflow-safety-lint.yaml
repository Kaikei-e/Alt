# workflow-safety-lint — mechanically enforce the fork-PR safety rules from
# ADR-000763. Fails the build if:
#   (1) any workflow defines `pull_request_target:` or `workflow_run:` triggers
#       (both run with elevated trust and are common exfil / RCE vectors for
#       OSS repos), or
#   (2) any job runs on something other than a static GitHub-hosted label —
#       this public repo registers no self-hosted runner; the pool lives in
#       the private deploy repo, where fork PRs cannot reach it, or
#   (3) no automatically-triggered job runs alt-frontend-sv's `client` vitest
#       project. (3) is not a fork-PR rule; it lives here because it is the
#       same structural assertion over the same files — "this workflow really
#       does what its name says". The client project (the Svelte component
#       specs) is opt-in behind VITEST_BROWSER, and for a long time nothing
#       set it, so 63 spec files were collected zero times while the job
#       reported green.
#   (4) a workflow lacks a top-level `permissions:` block,
#   (5) an `actions/checkout` step keeps `persist-credentials`,
#   (6) a `run:` body interpolates `github.event.*` / `github.head_ref`,
#   (7) a `uses:` reference is not pinned to a commit SHA / image digest,
#   (8) an `on.push.paths` / `on.pull_request.paths` entry's literal path or
#       non-glob directory prefix does not resolve to an existing file or
#       directory,
#   (9) a `jobs.<id>.container(.image)` or `jobs.<id>.services.<name>.image`
#       is not pinned by an `@sha256:` digest,
#  (10) a job that is not a reusable-workflow call lacks `timeout-minutes`, or
#  (11) an `on.push.paths` / `on.pull_request.paths` filter does not match the
#       workflow's own file and every local reusable workflow it calls via
#       `uses: ./.github/workflows/<file>` at job level (or excludes them via a
#       subsequent `!` negation), or
#  (12) a non-comment line swallows a failure (`|| true`, `|| :`, `|| echo`,
#       `|| exit 0`, or `continue-on-error: true`) without a `# swallow-ok: <reason>`
#       comment (at least 10 characters after the colon) on the same line or the
#       nearest previous non-blank line.
#   (4)-(7) and (9)-(10) are the GitHub Actions hardening guide's baseline,
#   and (8) and (11) prevent dead or non-self-triggering path filters — all
#   made structural so a new workflow or directory deletion cannot quietly
#   regress them.
#
# Scope boundary: this lint inspects `.github/workflows/**` and runs on every
# pull_request and push to main so any commit that deletes a file or directory
# referenced by a workflow `paths:` filter (including docs files) is caught by
# check (8). Composite
# actions under `.github/actions/**` cannot declare their own triggers or
# runners, so they are out of scope here; guard them separately if the trust
# model ever requires it. Check (3) additionally reads
# `alt-frontend-sv/package.json`, because a workflow step reaches vitest
# through an npm script and gutting the script is as effective a way to stop
# the suite as deleting the job.
#
# Implementation note: the structural check lives in a sibling script file
# (scripts/workflow-safety-check.py) rather than an inline heredoc, because
# the script body contains literal `${{` sequences (GitHub Actions template
# expressions) which GitHub would otherwise try to expand before the runner
# executes the `run:` block.
#
# This workflow itself must stay on ubuntu-latest with no secrets, which is
# why it's listed among the safe exceptions the policy expects.

name: workflow-safety-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        # ubuntu-latest ships python3 but not PyYAML. Pin to the 6.x line so
        # supply-chain drift is bounded.
        run: pip install --quiet 'pyyaml==6.*'

      - name: Install ast-grep
        # Remove any adjacent `sg` shim installed by ast-grep-cli so /usr/bin/sg
        # is never shadowed.
        run: |
          pip install --quiet 'ast-grep-cli==0.42.1'
          if ast_grep_bin="$(command -v ast-grep)"; then
            rm -f "$(dirname "$ast_grep_bin")/sg"
          elif [ -x "$HOME/.local/bin/ast-grep" ]; then
            rm -f "$HOME/.local/bin/sg"
          else
            echo "ast-grep binary not found after install" >&2
            exit 1
          fi

      - name: Run repository lint
        env:
          TARGET: repo
        run: ./scripts/lint/run.sh "$TARGET"
