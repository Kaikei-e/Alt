name: Sidecar and Docker Proxy Go Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    paths:
      - 'alt-backend/sidecar-proxy/**'
      - 'docker/readonly-proxy/**'
      - 'docker/otel-relay/**'
      - 'docker/inference-proxy/**'
      - '.github/workflows/sidecar-proxies-go.yaml'
      - '.github/workflows/reusable-test-go.yaml'
      - '.github/workflows/reusable-go-quality-gates.yaml'
      - '.golangci.yml'
      - 'scripts/lint/**'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'alt-backend/sidecar-proxy/**'
      - 'docker/readonly-proxy/**'
      - 'docker/otel-relay/**'
      - 'docker/inference-proxy/**'
      - '.github/workflows/sidecar-proxies-go.yaml'
      - '.github/workflows/reusable-test-go.yaml'
      - '.github/workflows/reusable-go-quality-gates.yaml'
      - '.golangci.yml'
      - 'scripts/lint/**'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar-proxy:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'alt-backend/sidecar-proxy'
      coverage-flags: 'sidecar-proxy'
      use-local-persistent-cache: false
      sparse-checkout: 'alt-backend/sidecar-proxy'

  quality-sidecar-proxy:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'alt-backend/sidecar-proxy'
      upload-sarif: true

  readonly-proxy:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'docker/readonly-proxy'
      coverage-flags: 'readonly-proxy'
      use-local-persistent-cache: false
      sparse-checkout: 'docker/readonly-proxy'

  quality-readonly-proxy:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'docker/readonly-proxy'
      upload-sarif: true

  otel-relay:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'docker/otel-relay'
      coverage-flags: 'otel-relay'
      use-local-persistent-cache: false
      sparse-checkout: 'docker/otel-relay'

  quality-otel-relay:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'docker/otel-relay'
      # Explicit go-version retained alongside docker/otel-relay/go.mod.
      go-version: '1.27.4'
      upload-sarif: true

  inference-proxy:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-go.yaml
    with:
      working-directory: 'docker/inference-proxy'
      coverage-flags: 'inference-proxy'
      use-local-persistent-cache: false
      sparse-checkout: 'docker/inference-proxy'

  quality-inference-proxy:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-go-quality-gates.yaml
    with:
      working-directory: 'docker/inference-proxy'
      upload-sarif: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - sidecar-proxy
      - quality-sidecar-proxy
      - readonly-proxy
      - quality-readonly-proxy
      - otel-relay
      - quality-otel-relay
      - inference-proxy
      - quality-inference-proxy
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.sidecar-proxy.result }}" != "success" ] || \
             [ "${{ needs.quality-sidecar-proxy.result }}" != "success" ] || \
             [ "${{ needs.readonly-proxy.result }}" != "success" ] || \
             [ "${{ needs.quality-readonly-proxy.result }}" != "success" ] || \
             [ "${{ needs.otel-relay.result }}" != "success" ] || \
             [ "${{ needs.quality-otel-relay.result }}" != "success" ] || \
             [ "${{ needs.inference-proxy.result }}" != "success" ] || \
             [ "${{ needs.quality-inference-proxy.result }}" != "success" ]; then
            echo "One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"
