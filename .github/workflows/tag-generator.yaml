name: Tag Generator CI
on:
  push:
    branches: [ main, master ]
    paths:
      - 'tag-generator/**'
      - '.github/workflows/tag-generator.yaml'
      - '.github/workflows/reusable-test-python.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tag-generator/**'
      - '.github/workflows/tag-generator.yaml'
      - '.github/workflows/reusable-test-python.yaml'
      - '!**/CLAUDE.md'
      - '!**/AGENTS.md'
      - '!**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: 'tag-generator/app'
      python-version: '3.14'
      test-command: 'pytest -v --cov=. --cov-report=xml --junit-xml=tests/results.xml'
      job-type: 'test'
      sparse-checkout: 'tag-generator'
      coverage-flags: 'tag-generator'
      use-local-persistent-cache: false

  lint:
    name: Linting & Formatting
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: 'tag-generator/app'
      python-version: '3.14'
      job-type: 'lint'
      sparse-checkout: 'tag-generator'
      use-local-persistent-cache: false

  security:
    name: Security Scan
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: 'tag-generator/app'
      python-version: '3.14'
      job-type: 'security'
      sparse-checkout: 'tag-generator'
      use-local-persistent-cache: false

  typecheck:
    name: Type Checking
    uses: ./.github/workflows/reusable-test-python.yaml
    with:
      working-directory: 'tag-generator/app'
      python-version: '3.14'
      job-type: 'typecheck'
      sparse-checkout: 'tag-generator'
      use-local-persistent-cache: false