# observability-validate — validate the monitoring configuration before it
# reaches the host, not after an incident proves it never loaded.
#
# The stack under observability/ has no compile step and no test binary. A
# malformed rule file, a scrape job that never matches, a Grafana provisioning
# typo — all of these are accepted by git, land on the host, and are discovered
# only when the alert that should have fired doesn't. promtool tests already
# exist in observability/prometheus/tests/, but nothing ran them: before this
# workflow the repository had zero CI references to promtool, so the tests were
# documentation of an intent rather than an enforced one.
#
# What is checked (see scripts/observability-validate.sh for the ordering):
#   promtool check config / check rules / test rules
#   amtool check-config — only when observability/alertmanager/alertmanager.yml
#     exists, so a tree without Alertmanager stays green
#   scripts/observability-config-audit.py — the structural invariants no
#     upstream tool covers: rule-glob coverage against compose file
#     attachments (bind mount or configs:), Grafana provisioning YAML,
#     dashboard uid collisions
#
# Tooling is downloaded from the upstream GitHub releases at exactly the
# versions compose/observability.yaml runs, so validation and production never
# disagree about what a file means. GitHub releases rather than Docker Hub:
# the image pull is rate limited per ADR-caught incidents on the self-hosted
# builder, and this job has no other reason to touch a registry.
#
# Not covered here: whether the running Prometheus has actually loaded any of
# this. That is a host-side property — scripts/observability-reload.sh --check
# and docs/runbooks/observability-config-reload.md own it.

name: observability-validate

on:
  push:
    branches: [main]
    paths:
      - 'observability/**'
      - 'compose/**.yaml'
      - 'compose/**.yml'
      - 'compose/observability.yaml'
      - 'scripts/observability-validate.sh'
      - 'scripts/observability-config-audit.py'
      - 'scripts/tests/test-observability-config-audit.py'
      - 'scripts/tests/test-pki-wave4-acceptance.py'
      - 'scripts/tests/test-user-journey-slo-counters.py'
      - 'scripts/tests/test-slo-evaluator-contract.py'
      - 'observability/synthetic/**'
      - 'scripts/synthetic-probes-audit.py'
      - 'scripts/tests/test-synthetic-probes-audit.py'
      - 'scripts/observability-compose-tool-images.py'
      - 'scripts/tests/test-observability-compose-tool-images.py'
      - 'plecto/**'
      - 'alt-butterfly-facade/**'
      - 'scripts/compose_include.py'
      - 'scripts/observability-drift-check.py'
      - 'scripts/tests/test-observability-drift-check.py'
      - '.github/workflows/observability-validate.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'observability/**'
      - 'compose/**.yaml'
      - 'compose/**.yml'
      - 'compose/observability.yaml'
      - 'scripts/observability-validate.sh'
      - 'scripts/observability-config-audit.py'
      - 'scripts/tests/test-observability-config-audit.py'
      - 'scripts/tests/test-pki-wave4-acceptance.py'
      - 'scripts/tests/test-user-journey-slo-counters.py'
      - 'scripts/tests/test-slo-evaluator-contract.py'
      - 'observability/synthetic/**'
      - 'scripts/synthetic-probes-audit.py'
      - 'scripts/tests/test-synthetic-probes-audit.py'
      - 'scripts/observability-compose-tool-images.py'
      - 'scripts/tests/test-observability-compose-tool-images.py'
      - 'plecto/**'
      - 'alt-butterfly-facade/**'
      - 'scripts/compose_include.py'
      - 'scripts/observability-drift-check.py'
      - 'scripts/tests/test-observability-drift-check.py'
      - '.github/workflows/observability-validate.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        # ubuntu-latest ships python3 but not PyYAML. Same 6.x pin as
        # workflow-safety-lint so supply-chain drift is bounded.
        run: pip install --quiet 'pyyaml==6.*'

      - name: Resolve tool versions from compose/observability.yaml
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/observability-compose-tool-images.py \
            --compose compose/observability.yaml
          python3 scripts/observability-compose-tool-images.py --github-output \
            --compose compose/observability.yaml >> "$GITHUB_OUTPUT"

      - name: Cache promtool and amtool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Outside the workspace: the tools are build inputs, not repository
          # content, and nothing should have to gitignore them.
          path: ~/.cache/alt-observability-tools
          key: observability-tools-p${{ steps.versions.outputs.prometheus }}-a${{ steps.versions.outputs.alertmanager }}

      - name: Install promtool and amtool
        shell: bash
        env:
          PROM_VERSION: ${{ steps.versions.outputs.prometheus }}
          AM_VERSION: ${{ steps.versions.outputs.alertmanager }}
        run: |
          set -euo pipefail
          tools="$HOME/.cache/alt-observability-tools"
          mkdir -p "$tools"

          if [[ ! -x "$tools/promtool" ]]; then
            url="https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/prometheus.tar.gz" "$url"
            tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" --strip-components=1 \
              -C "$tools" "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          fi
          "$tools/promtool" --version
          # Exported rather than passed as a step env so the validation step
          # never falls back to pulling a container image for the tools.
          echo "PROMTOOL=$tools/promtool" >> "$GITHUB_ENV"

          if [[ -n "$AM_VERSION" ]]; then
            if [[ ! -x "$tools/amtool" ]]; then
              url="https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz"
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/alertmanager.tar.gz" "$url"
              tar -xzf "$RUNNER_TEMP/alertmanager.tar.gz" --strip-components=1 \
                -C "$tools" "alertmanager-${AM_VERSION}.linux-amd64/amtool"
            fi
            "$tools/amtool" --version
            echo "AMTOOL=$tools/amtool" >> "$GITHUB_ENV"
          fi

      - name: Validate observability configuration
        run: scripts/observability-validate.sh

      # The drift checker only runs against a live host, so nothing here can
      # exercise it end to end. Its comparison logic is pure, though, and it
      # was wrong in a way no host-side run could reveal: it reported drift
      # unconditionally, so "drift" and "no drift" looked identical.
      - name: Drift-check self-tests
        run: python3 scripts/tests/test-observability-drift-check.py

      - name: Config-audit self-tests
        run: python3 scripts/tests/test-observability-config-audit.py
