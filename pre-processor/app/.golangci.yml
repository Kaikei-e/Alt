version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck       # 未チェックエラー検出
    - govet          # 疑わしい構造検出
    - staticcheck    # 包括的静的解析
    - ineffassign    # 無効な代入検出
    - unused         # 未使用コード検出
    - gosec          # セキュリティ問題検出

  exclusions:
    generated: lax
    rules:
      # PKI tests mint disposable certs, talk to a fake CA, and (when
      # PKI_NATIVE_LIVE_CA=1) launch docker. gosec's credential/path/subprocess
      # rules fire on those fixtures; production code in internal/pki stays covered.
      - path: 'internal/pki/.*_test\.go$'
        linters:
          - gosec

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error
