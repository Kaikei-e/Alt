version: v1.2.0

dsn: ${DSN}

serve:
  public:
    base_url: ${KRATOS_PUBLIC_URL}
    # Trust X-Forwarded-* headers from Nginx reverse proxy
    request_log:
      disable_for_health: true
    cors:
      enabled: true
      allowed_origins:
        - http://localhost
        - http://localhost:3000
        - http://localhost:4173
        - https://example.com
      allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed_headers: [Authorization, Content-Type, Accept, Cookie, X-Csrf-Token, X-Session-Token, X-Requested-With]
      allow_credentials: true
      exposed_headers: [Content-Type, Set-Cookie, X-Session-Token]
      # Allow credentials is critical for cookie-based authentication
      max_age: 3600

  admin:
    base_url: http://kratos-admin:4434/

selfservice:
  default_browser_return_url: ${KRATOS_DEFAULT_BROWSER_RETURN_URL}
  allowed_return_urls:
    - https://example.com/
    - https://example.com/home
    - https://example.com/desktop/home
    - https://example.com/auth/login
    - http://localhost/
    - http://localhost/home
    - http://localhost/desktop/home
    - http://localhost/auth/login
    - http://localhost:4173/sv/
    - http://localhost:4173/sv/home
    - http://localhost:4173/sv/auth/login

  methods:
    password:
      enabled: true
      config:
        # session.lifespan が 720h でロックアウトも無いので、当たった 1 本が
        # そのまま 30 日分のセッションになる。ここは Ory 既定より緩めない。
        haveibeenpwned_enabled: true
        # 0 = 漏洩リストに 1 件でも載っていれば拒否（Ory 既定かつ最も厳しい値）
        max_breaches: 0
        # HIBP 到達不能時は fail-closed。true（Ory 既定）だと
        # validator.go の該当分岐が素の `return nil` で、ロガーも
        # `io.Discard` 固定のため、照合が飛ばされたことがどこにも残らない。
        # 漏洩パスワードが素通りしたか否かを事後に判定できない状態は
        # CLAUDE.md rule 8 / 9 の無言フォールバックそのものなので取らない。
        #
        # 代償: api.pwnedpasswords.com へ到達できない間は登録と
        # パスワード変更が失敗する。Kratos の resilient client は
        # retryMax 4 / connect timeout 1s なので、失敗が確定するまで
        # 15〜20 秒かかる。DB 障害と誤診しないこと。
        # → egress 断は「登録できない」として顕在化する。
        ignore_network_errors: false
        # NIST SP 800-63B の SHALL は 8 文字。12 はその上を取った Alt 側の判断
        min_password_length: 12
        identifier_similarity_check_enabled: true

    totp:
      config:
        issuer: Alt RSS Reader
      enabled: true

    lookup_secret:
      enabled: true

    link:
      enabled: true
      config:
        lifespan: 1h

    code:
      enabled: true
      config:
        lifespan: 15m

  flows:
    error:
      ui_url: ${KRATOS_ERROR_UI_URL}

    settings:
      ui_url: ${KRATOS_SETTINGS_UI_URL}
      privileged_session_max_age: 10m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: ${KRATOS_RECOVERY_UI_URL}
      use: code

    verification:
      enabled: true
      ui_url: ${KRATOS_VERIFICATION_UI_URL}
      use: code
      after:
        default_browser_return_url: ${KRATOS_DEFAULT_BROWSER_RETURN_URL}

    logout:
      after:
        default_browser_return_url: ${KRATOS_DEFAULT_BROWSER_RETURN_URL}

    login:
      ui_url: ${KRATOS_LOGIN_UI_URL}
      lifespan: 30m
      after:
        default_browser_return_url: ${KRATOS_DEFAULT_BROWSER_RETURN_URL}

    registration:
      enabled: true
      lifespan: 30m
      ui_url: ${KRATOS_REGISTRATION_UI_URL}
      after:
        default_browser_return_url: ${KRATOS_DEFAULT_BROWSER_RETURN_URL}
        password:
          hooks:
            - hook: show_verification_ui

log:
  level: info
  format: json
  leak_sensitive_values: false
  # Enable detailed logging for debugging authentication issues
  redaction_text: "***REDACTED***"

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET}
  cipher:
    - ${KRATOS_CIPHER_SECRET}

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://kratos@alt.example.com:smtp_password_here@smtp.alt.example.com:587/?skip_ssl_verify=false
    from_address: noreply@alt.example.com
    from_name: Alt RSS Reader

session:
  lifespan: 720h
  cookie:
    domain: ${KRATOS_COOKIE_DOMAIN}  # Dot prefix allows cookies on all subdomains; empty in dev for host-only cookies
    persistent: true
    same_site: Lax
    path: /
    # Note: Kratos v1.2.0 automatically sets Secure flag based on X-Forwarded-Proto header
    # When X-Forwarded-Proto is 'https', cookies will have Secure flag set
  whoami:
    required_aal: aal1
  # Ensure sessions survive page reloads
  earliest_possible_extend: 1h
