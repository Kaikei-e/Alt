# Grafana alerting rules for Alt Platform Backup Monitoring
# Note: These rules are designed for Grafana Unified Alerting
# Provisioned from disk; see compose/observability.yaml for the mount.
#
# Prerequisites:
# - Prometheus datasource configured
# - backup_metrics.prom exposed via node_exporter textfile collector
#   or custom metrics endpoint
#
# THAT SECOND PREREQUISITE IS NOT MET. There is no textfile collector in
# compose/ and no scrape job for one in observability/prometheus/prometheus.yml,
# so none of the backup_* series below has ever existed in Prometheus.
#
# Four of these rules used to carry `noDataState: Alerting`, which made them
# fire permanently — and, crucially, fire identically whether backups were
# healthy or dead. Backups on this host stopped on 2026-02-28 and those rules
# reported exactly the same thing before and after. A signal with the same value
# in both states is not a detector; it is a constant that teaches whoever
# receives it to stop reading the channel. They are `noDataState: OK` now, which
# makes all nine consistent, and the fact they were standing in for — "we cannot
# see the backups at all" — is asserted by backup-signal-missing below, as a
# real query with a real result rather than as a rule engine default.
#
# The nine value rules below only start working once the exporter is scraped.
# Until then backup-signal-missing is the only one that can fire, and it is the
# only one that should.

apiVersion: 1

groups:
  - orgId: 1
    name: backup-monitoring
    folder: Backup
    interval: 5m
    rules:
      # Warning: the backup exporter is not reaching Prometheus at all.
      #
      # This rule gates every other rule in the group, so it is first. It asks
      # the one question the eight value rules cannot ask about themselves: is
      # there any backup telemetry here at all?
      #
      # backup_repository_initialized is the sentinel because
      # scripts/backup/backup-metrics.sh writes it down both branches — the
      # normal path and the early exit taken when the Restic repository
      # directory is missing — so it is present exactly when the exporter
      # pipeline works, and absent exactly when it does not.
      #
      # absent() returns a value whenever the datasource answers, so this rule
      # cannot itself enter NoData except when Prometheus is unreachable, which
      # is what execErrState covers. It is the one rule in this file where
      # `noDataState: OK` is a statement rather than a concession. It clears by
      # itself the moment the textfile collector starts being scraped.
      - uid: backup-signal-missing
        title: Backup Metrics Not Reaching Prometheus
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: absent(backup_repository_initialized)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "Backup monitoring is blind — no backup_* metrics in Prometheus"
          description: |
            Prometheus holds no backup_repository_initialized series, so every
            other rule in the Backup folder is evaluating against nothing and
            none of them can tell you whether backups are running.

            This is a monitoring gap, not a backup failure — but it hides
            backup failures, which is worse. Check in this order:

            1. Is the exporter running? The restic-backup container sits behind
               the `backup` compose profile and does not start with the default
               stack.
            2. Has backup-metrics.sh run? It writes
               /backups/metrics/backup_metrics.prom every 30 minutes from the
               container crontab. A leftover .prom.tmp beside it means the last
               run died mid-write.
            3. Is anything scraping that file? It needs a node_exporter with
               --collector.textfile.directory pointed at /backups/metrics and a
               matching job in observability/prometheus/prometheus.yml. Neither
               exists yet.

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Critical: No backup in 2 hours (Restic)
      - uid: backup-missing-restic
        title: Restic Backup Missing (2 hours)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: time() - backup_last_success_timestamp{type="restic"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 7200  # 2 hours in seconds
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        # No data here means the exporter is not reporting, which
        # backup-signal-missing already says once. It does not mean a backup
        # was missed — that claim needs the timestamp this query cannot see.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Restic backup not completed in over 2 hours"
          description: |
            The last successful Restic backup was {{ $values.B | humanizeDuration }} ago.
            Check backup logs at /backups/logs/ and verify the backup service is running.

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: critical
          team: platform
          component: backup

      # Warning: PostgreSQL backup missing for specific database
      - uid: backup-missing-postgres
        title: PostgreSQL Backup Missing (2 hours)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: time() - backup_postgres_last_success_timestamp
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 7200
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        # backup-metrics.sh writes this series for every database in its list,
        # using 0 when no dump is found — so a genuinely missing dump arrives as
        # a value and fires on the threshold. No data means the exporter is
        # silent, which is backup-signal-missing's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "PostgreSQL backup missing for {{ $labels.database }}"
          description: |
            No PostgreSQL backup for {{ $labels.database }} in the last 2 hours.
            Last backup was {{ $values.B | humanizeDuration }} ago.

            Check:
            1. Database container is running: docker ps | grep {{ $labels.database }}
            2. Backup logs: /backups/logs/
            3. Disk space: df -h /backups

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Warning: Backup disk space low (< 20%)
      - uid: backup-disk-space-low
        title: Backup Disk Space Low (< 20%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: 100 - backup_disk_usage_percent
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Backup disk space below 20%"
          description: |
            Available backup disk space is {{ $values.B | printf "%.1f" }}%.

            Actions:
            1. Run backup prune: ./scripts/backup/backup-all.sh --prune
            2. Check for large old backups: du -sh /backups/*
            3. Consider expanding disk or adjusting retention policy

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Critical: Backup disk space critically low (< 10%)
      - uid: backup-disk-space-critical
        title: Backup Disk Space Critical (< 10%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: 100 - backup_disk_usage_percent
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CRITICAL: Backup disk space below 10%"
          description: |
            Available backup disk space is critically low at {{ $values.B | printf "%.1f" }}%.
            Backups may fail!

            Immediate actions required:
            1. Emergency prune: restic -r /backups/restic-repo forget --keep-last 3 --prune
            2. Remove old PostgreSQL dumps: find /backups/postgres -mtime +3 -delete
            3. Expand disk storage

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: critical
          team: platform
          component: backup

      # Warning: Offsite sync not completed in 24 hours
      - uid: backup-offsite-stale
        title: Offsite Backup Stale (24 hours)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: time() - backup_offsite_last_success_timestamp
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 86400  # 24 hours
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "Offsite backup sync not completed in 24 hours"
          description: |
            Last offsite sync was {{ $values.B | humanizeDuration }} ago.

            Check:
            1. Tailscale connectivity: tailscale ping backup-server
            2. SSH access: ssh backup-server 'echo OK'
            3. Sync logs: /backups/logs/sync-offsite-*.log

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Warning: Offsite unreachable
      - uid: backup-offsite-unreachable
        title: Offsite Backup Server Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: backup_offsite_reachable
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Offsite backup server is unreachable"
          description: |
            Cannot connect to the offsite backup server.

            Check:
            1. Tailscale status: tailscale status
            2. Network connectivity
            3. Remote server availability

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Warning: Restore verification not run in 8 days
      - uid: backup-restore-verify-stale
        title: Restore Verification Stale (8 days)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: time() - backup_restore_verify_last_timestamp
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 691200  # 8 days in seconds
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        # The one rule where dropping Alerting costs real coverage, and it is
        # worth naming rather than burying. restore-verify.sh only creates
        # backup_restore_verify.prom after its first successful run, so "has
        # never been verified" presents as no data and is now unreported once
        # the exporter itself is healthy. Closing that needs the script to write
        # a backup_restore_verify_last_timestamp 0 sentinel at install time, the
        # same shape pre-processor's relay uses to keep "never ticked"
        # distinguishable from "ticked and reported zero". Until then this rule
        # covers stale verification but not absent verification.
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "Restore verification not run in over 8 days"
          description: |
            The automated restore verification has not been run in {{ $values.B | humanizeDuration }}.
            This is scheduled weekly. Check the backup container and supercronic logs.

            Run manually: ./scripts/backup/restore-verify.sh

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup

      # Critical: Restore verification failed
      - uid: backup-restore-verify-failed
        title: Restore Verification Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: backup_restore_verify_success
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CRITICAL: Restore verification failed"
          description: |
            The latest automated restore verification failed.
            Backups may not be restorable!

            Check restore verification logs: /backups/logs/restore-verify-*.log
            Run manually: ./scripts/backup/restore-verify.sh

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: critical
          team: platform
          component: backup

      # Info: Backup repository not initialized
      - uid: backup-not-initialized
        title: Backup Repository Not Initialized
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              expr: backup_repository_initialized
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              type: threshold
        # This rule and backup-signal-missing watch the same series from
        # opposite sides: absent means the exporter is down, 0 means the
        # exporter ran and found no repository. Leaving Alerting here would
        # merge the two answers back into one page.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Backup repository is not initialized"
          description: |
            The Restic backup repository has not been initialized.

            Initialize with:
            ./scripts/backup/backup-all.sh --init

            Runbook: docs/runbooks/backup-restore.md
        labels:
          severity: warning
          team: platform
          component: backup
