# Prometheus Configuration for Alt Platform
# Collects metrics from nginx-exporter and other services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'docker'
    platform: 'alt'

rule_files:
  - /etc/prometheus/rules/*.yml

# Where evaluated alerts are delivered. Without this block every rule in
# rule_files is still evaluated and still shows as "firing" in the Prometheus
# UI, but goes nowhere — which is exactly how the mTLS expiry outage of
# 2026-08-10 ran for seven hours with three `severity: page` rules active.
# Notification routing, grouping and inhibition live in
# observability/alertmanager/alertmanager.yml, not here.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Plecto edge/ingress metrics — native /metrics on the admin port (replaces
  # nginx + nginx-exporter). See compose/core.yaml plecto-proxy service.
  - job_name: 'plecto-proxy'
    static_configs:
      - targets: ['plecto-proxy:8080']
        labels:
          service: 'plecto-proxy'
    scrape_interval: 10s
    metrics_path: /metrics

  # cAdvisor for container resource metrics (CPU, memory, disk, network)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    scrape_interval: 15s
    metrics_path: /metrics

  # mq-hub message queue hub metrics (Go/promhttp)
  - job_name: 'mq-hub'
    static_configs:
      - targets: ['mq-hub:9500']
        labels:
          service: 'mq-hub'
    scrape_interval: 15s
    metrics_path: /metrics

  # pre-processor: the collector on :9201 is now started by bootstrap, so this
  # job is live. It carries the notification-outbox relay gauges among the rest.
  # Deliberately not on :9200 — that is the API listener, whose access control
  # is "who can open a socket", so a metrics route there would be a new
  # unauthenticated surface.
  #
  # acolyte-orchestrator has no counterpart here for the same reason, and it has
  # no second listener to move to: its relay is observable through its logs
  # only, so NotificationRelayStalled has no series for it. An accepted gap,
  # not a covered one.
  - job_name: 'pre-processor'
    static_configs:
      - targets: ['pre-processor:9201']
        labels:
          service: 'pre-processor'
    scrape_interval: 15s
    metrics_path: /metrics/prometheus


  # recap-worker recap pipeline metrics (Rust/Axum)
  - job_name: 'recap-worker'
    static_configs:
      - targets: ['recap-worker:9005']
        labels:
          service: 'recap-worker'
    scrape_interval: 15s
    metrics_path: /metrics

  # recap-subworker LLM subworker metrics (Python/FastAPI instrumentator)
  - job_name: 'recap-subworker'
    static_configs:
      - targets: ['recap-subworker:8002']
        labels:
          service: 'recap-subworker'
    scrape_interval: 15s
    metrics_path: /metrics

  # news-creator distributed BE dispatch metrics (OTel -> Prometheus exporter)
  - job_name: 'news-creator'
    static_configs:
      - targets: ['news-creator:11434']
        labels:
          service: 'news-creator'
    scrape_interval: 15s
    metrics_path: /metrics

  # The alt-backend Go module runs as three containers. Each exposes the same
  # operator listener on :9110 — /health and /metrics only, and never
  # published to the host. /metrics used to sit on alt-backend's REST
  # listener :9000; it moved so that all three have one shape, and so that
  # alt-data-hub (mTLS-only, zero published ports) can be scraped without
  # giving Prometheus a client certificate and diluting the data plane's peer
  # allowlist with a monitoring identity.
  #
  # Three jobs rather than one job with three targets: both consumers of the
  # availability tile key rows by `job`, and the allowlist aggregates with
  # `min by (job)`, so bundling them would collapse three processes into one
  # row and hide which of them died.
  #
  # Keep in lockstep with the availability job matcher in
  # alt-backend/app/orchestrator/gateway/admin_metrics_gateway/allowlist.go —
  # TestAllowlist_AvailabilityJobsMatchPrometheusScrapeConfig fails in both
  # directions, so a one-sided edit is caught in CI.

  # alt-backend: user-facing API — feed read performance, HTTP RED metrics.
  - job_name: 'alt-backend'
    static_configs:
      - targets: ['alt-backend:9110']
        labels:
          service: 'alt-backend'
    scrape_interval: 15s
    metrics_path: /metrics

  # alt-harvester: scheduled jobs — success/failure/duration per job. This
  # operator listener is the only socket the process opens.
  - job_name: 'alt-harvester'
    static_configs:
      - targets: ['alt-harvester:9110']
        labels:
          service: 'alt-harvester'
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'alt-notifier'
    static_configs:
      - targets: ['alt-notifier:9110']
        labels:
          service: 'alt-notifier'
    scrape_interval: 15s
    metrics_path: /metrics

  # alt-data-hub: mTLS data plane — DB pool, peer-identity rejections.
  - job_name: 'alt-data-hub'
    static_configs:
      - targets: ['alt-data-hub:9110']
        labels:
          service: 'alt-data-hub'
    scrape_interval: 15s
    metrics_path: /metrics

  # pki-agent sidecars: one per east-west service. Expose cert expiry and
  # rotation outcomes so cert-lifecycle regressions (like the 2026-04-15
  # Knowledge Home outage and its 2026-08-10 repeat) are paged before they go
  # dark.
  #
  # compose/pki.yaml defines exactly 14 sidecars, and they come in two
  # networking shapes. Keep this list at 14 — PkiAgentFleetIncomplete asserts
  # count(up{job="pki-agent"}) >= 14 precisely because a target dropped from
  # here silences every per-subject cert alert for that subject without any
  # other signal.
  #
  #   Pattern A — the sidecar joins `alt-network` on its own. It gets its own
  #   Docker DNS name, so the target is `pki-agent-<subject>:9510`.
  #
  #   Pattern B — the sidecar declares `network_mode: "service:<parent>"` and
  #   `networks: !override []`, because it also runs the mTLS reverse proxy
  #   that fronts the parent on :9443. Sharing the parent's netns is what lets
  #   the proxy reach the parent over 127.0.0.1, but it also means the sidecar
  #   HAS NO DNS NAME OF ITS OWN: `pki-agent-<subject>` does not resolve, and
  #   Docker's embedded resolver answers NXDOMAIN. The sidecar's :9510 listener
  #   lives in the PARENT's network namespace, so the correct scrape target is
  #   the PARENT service name — `<parent>:9510`. This is not a typo and must
  #   not be "fixed" to `pki-agent-<subject>:9510`: doing so is what left
  #   tag-generator and acolyte-orchestrator with a permanently firing
  #   PkiAgentDown from 2026-08-09, i.e. no cert monitoring at all for them.
  #   The `subject` label below is authoritative for which agent a series
  #   belongs to; the address is only how we reach it.
  - job_name: 'pki-agent'
    static_configs:
      # --- Pattern A: sidecar has its own alt-network identity -------------
      - targets: ['pki-agent-alt-backend:9510']
        labels: { service: 'pki-agent', subject: 'alt-backend' }
      - targets: ['pki-agent-alt-harvester:9510']
        labels: { service: 'pki-agent', subject: 'alt-harvester' }
      - targets: ['pki-agent-alt-notifier:9510']
        labels: { service: 'pki-agent', subject: 'alt-notifier' }
      - targets: ['pki-agent-alt-data-hub:9510']
        labels: { service: 'pki-agent', subject: 'alt-data-hub' }
      - targets: ['pki-agent-alt-butterfly-facade:9510']
        labels: { service: 'pki-agent', subject: 'alt-butterfly-facade' }
      - targets: ['pki-agent-rag-orchestrator:9510']
        labels: { service: 'pki-agent', subject: 'rag-orchestrator' }
      - targets: ['pki-agent-auth-hub:9510']
        labels: { service: 'pki-agent', subject: 'auth-hub' }
      - targets: ['pki-agent-pre-processor:9510']
        labels: { service: 'pki-agent', subject: 'pre-processor' }
      - targets: ['pki-agent-search-indexer:9510']
        labels: { service: 'pki-agent', subject: 'search-indexer' }
      - targets: ['pki-agent-recap-worker:9510']
        labels: { service: 'pki-agent', subject: 'recap-worker' }
      # --- Pattern B: sidecar shares the parent's netns ---------------------
      # Address is the PARENT service name on purpose. See the block comment
      # above; `pki-agent-<subject>` does not resolve for these four.
      - targets: ['tag-generator:9510']
        labels: { service: 'pki-agent', subject: 'tag-generator' }
      - targets: ['acolyte-orchestrator:9510']
        labels: { service: 'pki-agent', subject: 'acolyte-orchestrator' }
      - targets: ['recap-subworker:9510']
        labels: { service: 'pki-agent', subject: 'recap-subworker' }
      - targets: ['news-creator:9510']
        labels: { service: 'pki-agent', subject: 'news-creator' }
    scrape_interval: 30s
    metrics_path: /metrics

  # knowledge-sovereign: /metrics on container port 9501 (host 9511 is for
  # external probes, not Prometheus). Surfaces the Knowledge Loop projector
  # counters wired in ADR-000852 — surface_bucket_assigned_total{version,bucket},
  # event_dropped_total, cross_user_isolation_violation_total, etc. Knowledge
  # Loop Completion Phase 1 §5 wires this scrape so Grafana's
  # knowledge-loop-projector dashboard finally has a live target.
  - job_name: 'knowledge-sovereign'
    static_configs:
      - targets: ['knowledge-sovereign:9501']
        labels:
          service: 'knowledge-sovereign'
    scrape_interval: 15s
    metrics_path: /metrics

  # rag-orchestrator: /metrics on the Echo server (PORT=9010). Surfaces the
  # rag_orchestrator_knowledge_event_emitter_failure_total counter from
  # Knowledge Loop Completion Phase 1 §1 so an emit-side degradation is
  # observable distinct from projector-side event drops.
  - job_name: 'rag-orchestrator'
    static_configs:
      - targets: ['rag-orchestrator:9010']
        labels:
          service: 'rag-orchestrator'
    scrape_interval: 15s
    metrics_path: /metrics
