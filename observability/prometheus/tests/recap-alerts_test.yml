# promtool unit tests for recap pipeline alerts.
#
# Tests coverage:
#   - RecapSubworkerDown:
#       - Non-firing when up{job="recap-subworker"} == 1
#       - Firing when up{job="recap-subworker"} == 0 for 5m
#       - Pending (<5m) when up{job="recap-subworker"} == 0
#       - Firing when up{job="recap-subworker"} is absent (via absent())
#   - RecapSurfaceStale:
#       - Non-firing at the 36h boundary and while pending (<15m past 36h), firing at 36h16m (for: 15m) and 37h
#       - Non-firing when a surface is held at exact 36h age throughout (-129600+60x2220) or fresh (and morning_letter is excluded)
#   - RecapSurfaceConsecutiveFailures:
#       - Firing when consecutive failures >= 2 for 5m
#       - Non-firing when consecutive failures < 2 (and morning_letter is excluded)
#   - RecapSurfaceMetricsAbsent:
#       - Firing when recap-worker-ops is up but a daily surface gauge is missing for 30m
#       - Firing all 3 surface alerts when recap-worker (:9005) is down/unscraped (no gauges) while recap-worker-ops (:9110) is up
#       - Non-firing when all three daily surface gauges are present
#       - Non-firing when recap-worker-ops itself is down (up == 0)

rule_files:
  - ../rules/recap-alerts.yml

evaluation_interval: 1m

tests:
  # RecapSubworkerDown: healthy target reports up=1, does not fire.
  - interval: 1m
    input_series:
      - series: 'up{job="recap-subworker",service="recap-subworker",instance="recap-subworker:8002"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: RecapSubworkerDown
        exp_alerts: []

  # RecapSubworkerDown: target crashes or event loop freezes (scrape timeout -> up=0).
  # At 4m it is pending (for: 5m), at 6m it fires with severity warning.
  - interval: 1m
    input_series:
      - series: 'up{job="recap-subworker",service="recap-subworker",instance="recap-subworker:8002"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RecapSubworkerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: RecapSubworkerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-subworker
              stack: recap
              job: recap-subworker
              instance: recap-subworker:8002
            exp_annotations:
              summary: "recap-subworker is not answering Prometheus scrapes"
              description: |
                up{job="recap-subworker"} is 0, or the target has gone from the
                scrape config entirely. A frozen Python event loop times out the
                scrape, so this covers both a crashed and a frozen process.
                Recap and topic-cards jobs cannot classify or cluster without it.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-subworker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSubworkerDown: target removed from scrape config entirely.
  # absent() fires to prevent silent blindness.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus",service="prometheus",instance="localhost:9090"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: RecapSubworkerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-subworker
              stack: recap
              job: recap-subworker
            exp_annotations:
              summary: "recap-subworker is not answering Prometheus scrapes"
              description: |
                up{job="recap-subworker"} is 0, or the target has gone from the
                scrape config entirely. A frozen Python event loop times out the
                scrape, so this covers both a crashed and a frozen process.
                Recap and topic-cards jobs cannot classify or cluster without it.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-subworker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSurfaceStale: last success frozen at t=0. At 36h age is exactly 36*3600 (boundary, not >36h);
  # at 36h15m it has exceeded 36h for 14m (pending <15m); at 36h16m (15m past 36h1m) and 37h it fires.
  - interval: 1m
    input_series:
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="three_day_recap"}'
        values: '0x2220'
    alert_rule_test:
      - eval_time: 36h
        alertname: RecapSurfaceStale
        exp_alerts: []
      - eval_time: 36h15m
        alertname: RecapSurfaceStale
        exp_alerts: []
      - eval_time: 36h16m
        alertname: RecapSurfaceStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              instance: recap-worker:9005
              surface: three_day_recap
            exp_annotations:
              summary: "Recap surface three_day_recap has not succeeded in over 36h (age 1d 12h 16m 0s)"
              description: |
                recap_surface_last_success_timestamp_seconds{surface="three_day_recap"}
                is 1d 12h 16m 0s old (>36h threshold, one daily cycle plus margin).
                Daily generation for three_day_recap is overdue and users may see stale output.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"
      - eval_time: 37h
        alertname: RecapSurfaceStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              instance: recap-worker:9005
              surface: three_day_recap
            exp_annotations:
              summary: "Recap surface three_day_recap has not succeeded in over 36h (age 1d 13h 0m 0s)"
              description: |
                recap_surface_last_success_timestamp_seconds{surface="three_day_recap"}
                is 1d 13h 0m 0s old (>36h threshold, one daily cycle plus margin).
                Daily generation for three_day_recap is overdue and users may see stale output.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSurfaceStale: surface held at exact 36h age throughout (-129600+60x2220 so time()-v == 36*3600 at every step)
  # and fresh daily surfaces stay quiet; morning_letter is excluded even when stale.
  - interval: 1m
    input_series:
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="three_day_recap"}'
        values: '-129600+60x2220'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="topic_cards"}'
        values: '0+60x2220'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="evening_pulse"}'
        values: '0+60x2220'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="morning_letter"}'
        values: '0x2220'
    alert_rule_test:
      - eval_time: 37h
        alertname: RecapSurfaceStale
        exp_alerts: []

  # RecapSurfaceConsecutiveFailures: 2 consecutive failures on topic_cards fires after 5m.
  - interval: 1m
    input_series:
      - series: 'recap_surface_consecutive_failures{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="topic_cards"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RecapSurfaceConsecutiveFailures
        exp_alerts: []
      - eval_time: 6m
        alertname: RecapSurfaceConsecutiveFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              instance: recap-worker:9005
              surface: topic_cards
            exp_annotations:
              summary: "Recap surface topic_cards has 2 consecutive failures"
              description: |
                recap_surface_consecutive_failures{surface="topic_cards"} is 2 (>= 2).
                Daily generation for topic_cards has failed repeatedly since the last success.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSurfaceConsecutiveFailures: single failure on a daily surface does not fire;
  # morning_letter is excluded even with >= 2 failures.
  - interval: 1m
    input_series:
      - series: 'recap_surface_consecutive_failures{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="three_day_recap"}'
        values: '0x10'
      - series: 'recap_surface_consecutive_failures{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="topic_cards"}'
        values: '1x10'
      - series: 'recap_surface_consecutive_failures{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="evening_pulse"}'
        values: '1x10'
      - series: 'recap_surface_consecutive_failures{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="morning_letter"}'
        values: '5x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: RecapSurfaceConsecutiveFailures
        exp_alerts: []

  # RecapSurfaceMetricsAbsent: recap-worker-ops is up, but evening_pulse gauge is missing for 30m.
  - interval: 1m
    input_series:
      - series: 'up{job="recap-worker-ops",service="recap-worker",instance="recap-worker:9110"}'
        values: '1x40'
      - series: 'up{job="recap-worker",service="recap-worker",instance="recap-worker:9005"}'
        values: '1x40'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="three_day_recap"}'
        values: '1000x40'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="topic_cards"}'
        values: '1000x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: RecapSurfaceMetricsAbsent
        exp_alerts: []
      - eval_time: 35m
        alertname: RecapSurfaceMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              surface: evening_pulse
            exp_annotations:
              summary: "Recap surface evening_pulse freshness metric is absent while recap-worker is up"
              description: |
                up{job="recap-worker-ops"} is 1, but recap_surface_last_success_timestamp_seconds{surface="evening_pulse"}
                has been absent for 30m. This gauge is seeded from the database at startup, so its absence
                means recap-worker is not exporting surface freshness metrics and RecapSurfaceStale cannot fire.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSurfaceMetricsAbsent: recap-worker (:9005) scrape is down (up=0) and no gauges exist while
  # recap-worker-ops (:9110) is up (up=1) -> all 3 daily surfaces fire.
  - interval: 1m
    input_series:
      - series: 'up{job="recap-worker",service="recap-worker",instance="recap-worker:9005"}'
        values: '0x40'
      - series: 'up{job="recap-worker-ops",service="recap-worker",instance="recap-worker:9110"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: RecapSurfaceMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              surface: three_day_recap
            exp_annotations:
              summary: "Recap surface three_day_recap freshness metric is absent while recap-worker is up"
              description: |
                up{job="recap-worker-ops"} is 1, but recap_surface_last_success_timestamp_seconds{surface="three_day_recap"}
                has been absent for 30m. This gauge is seeded from the database at startup, so its absence
                means recap-worker is not exporting surface freshness metrics and RecapSurfaceStale cannot fire.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              surface: topic_cards
            exp_annotations:
              summary: "Recap surface topic_cards freshness metric is absent while recap-worker is up"
              description: |
                up{job="recap-worker-ops"} is 1, but recap_surface_last_success_timestamp_seconds{surface="topic_cards"}
                has been absent for 30m. This gauge is seeded from the database at startup, so its absence
                means recap-worker is not exporting surface freshness metrics and RecapSurfaceStale cannot fire.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"
          - exp_labels:
              severity: warning
              service: recap-worker
              stack: recap
              job: recap-worker
              surface: evening_pulse
            exp_annotations:
              summary: "Recap surface evening_pulse freshness metric is absent while recap-worker is up"
              description: |
                up{job="recap-worker-ops"} is 1, but recap_surface_last_success_timestamp_seconds{surface="evening_pulse"}
                has been absent for 30m. This gauge is seeded from the database at startup, so its absence
                means recap-worker is not exporting surface freshness metrics and RecapSurfaceStale cannot fire.
                Check: docker compose -f compose/compose.yaml -p alt logs recap-worker
                Runbook: docs/runbooks/3days-recap-artefact-recovery.md
              runbook_url: "docs/runbooks/3days-recap-artefact-recovery.md"

  # RecapSurfaceMetricsAbsent: all three daily surface gauges present while recap-worker-ops is up -> does not fire;
  # recap-worker-ops down (up == 0) with gauges missing -> does not fire.
  - interval: 1m
    input_series:
      - series: 'up{job="recap-worker-ops",service="recap-worker",instance="recap-worker:9110"}'
        values: '1x40'
      - series: 'up{job="recap-worker",service="recap-worker",instance="recap-worker:9005"}'
        values: '1x40'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="three_day_recap"}'
        values: '1000x40'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="topic_cards"}'
        values: '1000x40'
      - series: 'recap_surface_last_success_timestamp_seconds{job="recap-worker",service="recap-worker",instance="recap-worker:9005",surface="evening_pulse"}'
        values: '1000x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: RecapSurfaceMetricsAbsent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="recap-worker-ops",service="recap-worker",instance="recap-worker:9110"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: RecapSurfaceMetricsAbsent
        exp_alerts: []

