# promtool unit tests for in-process PKI cert-lifecycle alerts.
#
#   ./scripts/observability-validate.sh
#   # or:
#   promtool test rules observability/prometheus/tests/pki-agent-alerts_test.yml
#
# Kept outside /etc/prometheus/rules: prometheus.yml globs *.yml there, and a
# test file parsed as a rule group is a fatal config error, not a skip.
#
# Sidecar pki-agent alerts are gone. Leftover detection is the Docker-label
# gate; live alerts are pki_enrollment_*.

rule_files:
  - ../rules/pki-agent-alerts.yml

evaluation_interval: 30s

tests:
  # In-process: absence of one of 14 parent metrics must page.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_healthy{subject="alt-backend"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-harvester"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-notifier"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-butterfly-facade"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="auth-hub"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="search-indexer"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="rag-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="pre-processor"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="tag-generator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-worker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="acolyte-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-subworker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="news-creator"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: PkiEnrollmentWorkloadMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: alt-data-hub
            exp_annotations:
              summary: "an in-process PKI workload metric is absent"
              description: |
                One of the 14 in-process parents is not exporting
                pki_enrollment_healthy. After sidecar removal that series is the
                only cert-lifecycle signal for the subject.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 11m
        alertname: PkiEnrollmentFleetIncomplete
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "in-process PKI unique-subject fleet is 13 (want exactly 14)"
              description: |
                All 14 east-west parents must each export pki_enrollment_healthy
                on :9110. Raw series count can be padded by duplicate labels; this
                pin is unique subjects, and `or vector(0)` fires when every series
                is absent.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # All 14 in-process series present: workload-absent does not fire.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_healthy{subject="alt-backend"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-harvester"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-data-hub"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-notifier"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-butterfly-facade"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="auth-hub"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="search-indexer"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="rag-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="pre-processor"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="tag-generator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-worker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="acolyte-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-subworker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="news-creator"}'
        values: '1x30'
      - series: 'pki_enrollment_cert_remaining_seconds{subject="alt-backend"}'
        values: '86400x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: PkiEnrollmentWorkloadMetricsAbsent
        exp_alerts: []
      - eval_time: 11m
        alertname: PkiEnrollmentFleetIncomplete
        exp_alerts: []
      - eval_time: 11m
        alertname: PkiEnrollmentMetricsAbsent
        exp_alerts: []

  # In-process expiry still pages.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_cert_remaining_seconds{subject="alt-backend"}'
        values: '3599x30'
      - series: 'pki_enrollment_healthy{subject="alt-backend"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-harvester"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-data-hub"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: PkiEnrollmentCertExpirySoon
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: alt-backend
            exp_annotations:
              summary: "alt-backend in-process mTLS cert expires in under 4h"
              description: |
                alt-backend reports only 3.599ks left
                on the leaf certificate (in-process enrollment, not pki-agent).
                Check: docker logs alt-alt-backend-1
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Unhealthy leaf (healthy==0) must page even when remaining is still positive.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_healthy{subject="auth-hub"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: PkiEnrollmentCertExpired
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: auth-hub
            exp_annotations:
              summary: "auth-hub in-process mTLS cert expired / missing / corrupt"
              description: |
                pki_enrollment_healthy=0 for subject auth-hub.
                Consumer east-west calls will fail until rotation succeeds.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Parent ops target is down: up==0 on an exact :9110 job name.
  - interval: 30s
    input_series:
      - series: 'up{job="recap-worker-ops"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: PkiEnrollmentOpsDown
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: recap-worker-ops
            exp_annotations:
              summary: "recap-worker-ops PKI ops scrape failing"
              description: |
                Prometheus cannot scrape recap-worker-ops :9110. Static targets
                report up=0 rather than vanishing, so this is the parent-ops
                scrape-down alert. Leftover pki-agent sidecars are a Docker-label
                gate, not this scrape.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Every in-process series gone: fleet pin uses or vector(0); MetricsAbsent fires.
  - interval: 30s
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 11m
        alertname: PkiEnrollmentFleetIncomplete
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "in-process PKI unique-subject fleet is 0 (want exactly 14)"
              description: |
                All 14 east-west parents must each export pki_enrollment_healthy
                on :9110. Raw series count can be padded by duplicate labels; this
                pin is unique subjects, and `or vector(0)` fires when every series
                is absent.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 16m
        alertname: PkiEnrollmentMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "pki_enrollment_healthy has reported nothing for 10m"
              description: |
                No in-process enrollment series at all. Live cert alerts are
                in-process only; leftover sidecars are a Docker-label gate.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Duplicate labels cannot pad the fleet pin. 14 series, 13 unique subjects.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_healthy{subject="alt-backend"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-backend",instance="dup"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-harvester"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-notifier"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="alt-butterfly-facade"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="auth-hub"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="search-indexer"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="rag-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="pre-processor"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="tag-generator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-worker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="acolyte-orchestrator"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="recap-subworker"}'
        values: '1x30'
      - series: 'pki_enrollment_healthy{subject="news-creator"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: PkiEnrollmentFleetIncomplete
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "in-process PKI unique-subject fleet is 13 (want exactly 14)"
              description: |
                All 14 east-west parents must each export pki_enrollment_healthy
                on :9110. Raw series count can be padded by duplicate labels; this
                pin is unique subjects, and `or vector(0)` fires when every series
                is absent.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 6m
        alertname: PkiEnrollmentWorkloadMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: alt-data-hub
            exp_annotations:
              summary: "an in-process PKI workload metric is absent"
              description: |
                One of the 14 in-process parents is not exporting
                pki_enrollment_healthy. After sidecar removal that series is the
                only cert-lifecycle signal for the subject.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Renewal: failures exist, success series absent — must fire (unless on(subject)).
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_renewal_total{subject="auth-hub",result="failure"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PkiEnrollmentRenewalFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: auth-hub
              result: failure
            exp_annotations:
              summary: "auth-hub in-process renewal loop failing"
              description: |
                Renewal attempts are failing and no success in the last 15m.
                Check step-ca health and the subject-scoped JWK provisioner.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Renewal: failures exist, success rate is zero (constant series).
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_renewal_total{subject="auth-hub",result="failure"}'
        values: '0+1x40'
      - series: 'pki_enrollment_renewal_total{subject="auth-hub",result="success"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PkiEnrollmentRenewalFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              subject: auth-hub
              result: failure
            exp_annotations:
              summary: "auth-hub in-process renewal loop failing"
              description: |
                Renewal attempts are failing and no success in the last 15m.
                Check step-ca health and the subject-scoped JWK provisioner.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Renewal: success rate > 0 suppresses the alert.
  - interval: 30s
    input_series:
      - series: 'pki_enrollment_renewal_total{subject="auth-hub",result="failure"}'
        values: '0+1x40'
      - series: 'pki_enrollment_renewal_total{subject="auth-hub",result="success"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PkiEnrollmentRenewalFailing
        exp_alerts: []

