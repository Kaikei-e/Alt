    alert_rule_test:
      - eval_time: 15m
        alertname: TlsHandshakeCertDivergesFromReported
        exp_alerts: []
      - eval_time: 21m
        alertname: TlsHandshakeCertDivergesFromReported
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: tls-handshake
              instance: alt-data-hub:9443
              subject: alt-data-hub
            exp_annotations:
              summary: "alt-data-hub presents a different certificate on alt-data-hub:9443 than it reports"
              description: |
                The not_after seen in the TLS handshake on alt-data-hub:9443 differs by
                15h 50m 0s from pki_enrollment_cert_not_after_seconds for
                alt-data-hub while enrollment reports healthy. Possible causes: the listener and
                enrollment read different certificate paths, a clock that moved backwards, a
                stopped reload poll, or a listener that bypasses reload. Check these before
                recreating anything.
                Runbook: docs/runbooks/pki-agent-recovery.md

