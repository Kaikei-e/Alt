# promtool unit tests for the externally observed mTLS handshake alerts.
#
#   ./scripts/observability-validate.sh
#   # or:
#   promtool test rules observability/prometheus/tests/tls-handshake-alerts_test.yml
#
# Kept outside /etc/prometheus/rules for the same reason as the other test
# files: a test file inside the rules glob is a fatal config error.

rule_files:
  - ../rules/tls-handshake-alerts.yml

evaluation_interval: 30s

tests:
  # Healthy fleet; a rotation reaches the handshake 2m after the service reports it.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="alt-data-hub:9443",subject="alt-data-hub"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake",instance="auth-hub:9443",subject="auth-hub"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake",instance="auth-hub:8443",subject="auth-hub"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake",instance="search-indexer:9443",subject="search-indexer"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake",instance="pre-processor:9443",subject="pre-processor"}'
