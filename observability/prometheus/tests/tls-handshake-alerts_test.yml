        values: '600x3 600x3 600x3 600x3 600x3 600x3 600x3 600x3 600x3 600x3 stale'
      - series: 'probe_success{job="tls-handshake",instance="recap-worker:9443",subject="recap-worker"}'
        values: '1x3 1x3 1x3 1x3 1x3 1x3 1x3 1x3 1x3 1x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3 0x3'
