# promtool unit tests for the externally observed mTLS handshake alerts.
#
#   ./scripts/observability-validate.sh
#   # or:
#   promtool test rules observability/prometheus/tests/tls-handshake-alerts_test.yml
#
# Kept outside /etc/prometheus/rules for the same reason as the other test
# files: a test file inside the rules glob is a fatal config error. Reported
# series carry the labels of the real :9110 scrape (job, instance, service).

rule_files:
  - ../rules/tls-handshake-alerts.yml

evaluation_interval: 30s

tests:
  # Healthy fleet; a rotation reaches the handshake 2m after the service reports it, nothing fires during or after.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="alt-data-hub:9443",subject="alt-data-hub"}'
        values: '1x120'
