        values: '50000000x60 50057000x80'
      - series: 'pki_enrollment_cert_not_after_seconds{subject="auth-hub"}'
        values: '50000000x120'
      - series: 'pki_enrollment_cert_not_after_seconds{subject="search-indexer"}'
