  # The trust bundle is missing, so the canary and every listener fail for good: no page at all, and
  # the canary ticket opens after its 10m `for`.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="alt-data-hub:9443",subject="alt-data-hub"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="alt-data-hub",instance="alt-data-hub:9110",service="alt-data-hub",subject="alt-data-hub"}'
        values: '1x160'
      - series: 'probe_success{job="tls-handshake",instance="auth-hub:8443",subject="auth-hub"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="auth-hub",instance="auth-hub:9110",service="auth-hub",subject="auth-hub"}'
        values: '1x160'
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x160'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '0x160'
    alert_rule_test:
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 9m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts: []
      - eval_time: 11m
