  - interval: 15s
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 11m
        alertname: TlsHandshakeProbeFleetIncomplete
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
            exp_annotations:
              summary: "TLS handshake probe covers 0 listeners (want exactly 12)"
              description: |
                Each of the 12 east-west TLS listeners must report probe_success. A missing
                series means a target dropped out of the scrape config or blackbox_exporter
                stopped answering; `or vector(0)` fires when every series is absent.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 11m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: tls-handshake-canary
            exp_annotations:
              summary: "TLS handshake canary against step-ca is failing"
              description: |
                The prober cannot complete a verified handshake with step-ca using the trust
                bundle every service uses, or reports nothing for it. Listener results cannot
                be trusted, so the listener-failure page is held back. Check blackbox-exporter
                (container, /trust/ca-bundle.pem, network) and then step-ca.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The prober is gone: exactly two tickets (prober down, fleet pin), no page, and neither the
  # canary nor the scrape alert adds a third.
  - interval: 15s
    input_series:
      - series: 'up{job="blackbox-exporter",instance="blackbox-exporter:9115",service="blackbox-exporter"}'
        values: '0x160'
      - series: 'up{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'up{job="tls-handshake",instance="recap-worker:9443",subject="recap-worker"}'
        values: '0x160'
    alert_rule_test:
      - eval_time: 11m
        alertname: TlsHandshakeProberDown
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: blackbox-exporter
              instance: blackbox-exporter:9115
              service: blackbox-exporter
            exp_annotations:
              summary: "blackbox-exporter is not answering scrapes"
              description: |
                Prometheus cannot scrape blackbox-exporter, so no handshake is being probed and
                the probe alerts have nothing to evaluate.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 11m
        alertname: TlsHandshakeProbeFleetIncomplete
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
            exp_annotations:
              summary: "TLS handshake probe covers 0 listeners (want exactly 12)"
              description: |
                Each of the 12 east-west TLS listeners must report probe_success. A missing
                series means a target dropped out of the scrape config or blackbox_exporter
                stopped answering; `or vector(0)` fires when every series is absent.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 11m
        alertname: TlsHandshakeProbeScrapeFailing
        exp_alerts: []
      - eval_time: 11m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts: []
      - eval_time: 11m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []

  # The prober is up but scraped no canary series at all.
  - interval: 15s
    input_series:
      - series: 'up{job="blackbox-exporter",instance="blackbox-exporter:9115",service="blackbox-exporter"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 11m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: tls-handshake-canary
            exp_annotations:
              summary: "TLS handshake canary against step-ca is failing"
              description: |
                The prober cannot complete a verified handshake with step-ca using the trust
                bundle every service uses, or reports nothing for it. Listener results cannot
                be trusted, so the listener-failure page is held back. Check blackbox-exporter
                (container, /trust/ca-bundle.pem, network) and then step-ca.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Scrape failures while the prober answers: one ticket carrying the count.
  - interval: 15s
    input_series:
      - series: 'up{job="blackbox-exporter",instance="blackbox-exporter:9115",service="blackbox-exporter"}'
        values: '1x160'
      - series: 'up{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'up{job="tls-handshake",instance="recap-worker:9443",subject="recap-worker"}'
        values: '0x160'
      - series: 'up{job="tls-handshake",instance="auth-hub:9443",subject="auth-hub"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 6m
        alertname: TlsHandshakeProbeScrapeFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
            exp_annotations:
              summary: "2 TLS handshake probe scrapes are failing"
              description: |
                Prometheus gets no result for the TLS handshake probe from blackbox-exporter while
                the prober itself is up. Check the tls-handshake targets in Prometheus.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 6m
        alertname: TlsHandshakeProberDown
        exp_alerts: []
