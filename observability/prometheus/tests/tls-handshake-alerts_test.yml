# promtool unit tests for the externally observed mTLS handshake alerts.
#
#   ./scripts/observability-validate.sh
#   # or:
#   promtool test rules observability/prometheus/tests/tls-handshake-alerts_test.yml
#
# Kept outside /etc/prometheus/rules for the same reason as the other test
# files: a test file inside the rules glob is a fatal config error.
#
# Cadence follows production: the probe scrapes every 60s and the :9110 ops
# endpoints every 15s, so the tests tick every 15s and a probe value spans four
# ticks. A failed scrape is a `stale` marker (the series is gone until the next
# good scrape); `_` would leave the series visible through the 5m lookback.
# pki-agent-alerts.yml is loaded too, so the tests can say which alert owns a
# fault when the two files overlap.

rule_files:
  - ../rules/tls-handshake-alerts.yml
  - ../rules/pki-agent-alerts.yml

evaluation_interval: 30s

tests:
  # A listener of a live process fails while the canary blinks once every 4m: the page comes at
  # 5-6m and stays. The canary ticket is a separate matter: a canary that fails this often is
  # itself broken, so it opens its own ticket once the 10m `for` has passed.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x120'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3 1x3 1x3 1x3 0x3'
    alert_rule_test:
      - eval_time: 4m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 10m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 18m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 10m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts: []
      - eval_time: 14m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: tls-handshake-canary
              instance: step-ca:9000
            exp_annotations:
              summary: "TLS handshake canary against step-ca is failing"
              description: |
                The prober cannot complete a verified handshake with step-ca using the trust
                bundle every service uses, or reports nothing for it. Listener results cannot
                be trusted, so the listener-failure page is held back. Check blackbox-exporter
                (container, /trust/ca-bundle.pem, network) and then step-ca.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The canary succeeds only one minute in four (step-ca restarting): the canary ticket opens, and
  # the listener page is held back only while the canary has not succeeded for 3m, so a broken
  # listener still pages.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x120'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x120'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3 0x3 0x3 0x3 1x3'
    alert_rule_test:
      - eval_time: 9m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts: []
      - eval_time: 11m
        alertname: TlsHandshakeCanaryFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              stack: mtls
              job: tls-handshake-canary
              instance: step-ca:9000
            exp_annotations:
              summary: "TLS handshake canary against step-ca is failing"
              description: |
                The prober cannot complete a verified handshake with step-ca using the trust
                bundle every service uses, or reports nothing for it. Listener results cannot
                be trusted, so the listener-failure page is held back. Check blackbox-exporter
                (container, /trust/ca-bundle.pem, network) and then step-ca.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 7m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 9m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 18m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The :9110 scrape fails once every 2m (a scrape failure drops the series until the next
  # good scrape) while the TLS listener is dead: the page must not wait for a quiet period.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale 1x6 stale'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 4m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 30m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The probe scrape itself fails one minute in three (the series drops until the next good scrape)
  # while the listener is dead: the page must still come.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _ 0x3 0x3 stale _x2 _'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x160'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 4m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The presented certificate is short while the :9110 scrape fails once every 2m: the expiry page
  # must not restart its `for` at every gap in the disk-side series.
  - interval: 15s
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '10000x160'
      - series: 'pki_enrollment_cert_remaining_seconds{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000 80000x5 stale 80000'
    alert_rule_test:
      - eval_time: 1m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts: []
      - eval_time: 6m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: tls-handshake
              instance: news-creator:9443
              subject: news-creator
            exp_annotations:
              summary: "news-creator:9443 presents a certificate that expires in under 4h"
              description: |
                The certificate presented in the TLS handshake on news-creator:9443 expires in
                2h 40m 40s (negative once it has expired) while the on-disk leaf
                reported for news-creator had 4h or more left within the last 2m, so the process is
                serving a stale certificate.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 20m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: tls-handshake
              instance: news-creator:9443
              subject: news-creator
            exp_annotations:
              summary: "news-creator:9443 presents a certificate that expires in under 4h"
              description: |
                The certificate presented in the TLS handshake on news-creator:9443 expires in
                2h 26m 40s (negative once it has expired) while the on-disk leaf
                reported for news-creator had 4h or more left within the last 2m, so the process is
                serving a stale certificate.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # A crash-looping service: the :9110 endpoint answers for 30s each 2m cycle and the TLS listener
  # never opens. The service reports healthy every time it answers, so the page fires.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4 1x1 stale _x4'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 4m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 20m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The page is firing and the canary fails for one probe (minute 9-10): the page keeps firing
  # instead of resolving and re-firing later.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x160'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x35 0x3 1x80'
    alert_rule_test:
      - eval_time: 8m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 10m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 10m30s
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 16m
        alertname: TlsHandshakeListenerFailing
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
            exp_annotations:
              summary: "1 TLS listener(s) cannot complete a handshake"
              description: |
                Handshake probes fail for listeners of services that still report enrollment
                state, so the process is up but its TLS listener is not serving.
                Failing listeners: news-creator:9443
                If the whole service is down, PkiEnrollmentOpsDown fires separately.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # Presented and on-disk both under 4h, then the service is stopped (its series go stale): the
  # handshake expiry alert never fires, neither while the disk side is short nor after its series
  # disappear.
  - interval: 15s
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '10000x11 stale'
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '1x11 0x120'
      - series: 'pki_enrollment_cert_remaining_seconds{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '10000x11 stale'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x11 stale'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 2m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts: []
      - eval_time: 8m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts: []
      - eval_time: 20m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts: []

  # The on-disk certificate is corrupt or expired (healthy=0, remaining=0, reported not_after is
  # now, the Rust shape) and the listener fails as well: the enrollment alert owns it, so the
  # listener page and the divergence ticket stay quiet.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="tls-handshake",instance="recap-worker:9443",subject="recap-worker"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="recap-worker-ops",instance="recap-worker:9110",service="recap-worker",subject="recap-worker"}'
        values: '0x160'
      - series: 'pki_enrollment_cert_remaining_seconds{job="recap-worker-ops",instance="recap-worker:9110",service="recap-worker",subject="recap-worker"}'
        values: '0x160'
      - series: 'pki_enrollment_cert_not_after_seconds{job="recap-worker-ops",instance="recap-worker:9110",service="recap-worker",subject="recap-worker"}'
        values: '0+15x160'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: TlsHandshakeCertDivergesFromReported
        exp_alerts: []
      - eval_time: 12m
        alertname: PkiEnrollmentCertExpired
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: recap-worker-ops
              instance: recap-worker:9110
              service: recap-worker
              subject: recap-worker
            exp_annotations:
              summary: "recap-worker in-process mTLS cert expired / missing / corrupt"
              description: |
                pki_enrollment_healthy=0 for subject recap-worker.
                Consumer east-west calls will fail until rotation succeeds.
                Runbook: docs/runbooks/pki-agent-recovery.md

  # The whole process is down (ops scrape and probe both fail): the listener page stays out because
  # the 2m window closes before its 5m `for`, and PkiEnrollmentOpsDown pages.
  - interval: 15s
    input_series:
      - series: 'up{job="news-creator-ops",instance="news-creator:9110"}'
        values: '0x160'
      - series: 'probe_success{job="tls-handshake",instance="news-creator:9443",subject="news-creator"}'
        values: '0x160'
      - series: 'pki_enrollment_healthy{job="news-creator-ops",instance="news-creator:9110",service="news-creator",subject="news-creator"}'
        values: '1x7 stale'
      - series: 'probe_success{job="tls-handshake-canary",instance="step-ca:9000"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 12m
        alertname: TlsHandshakeListenerFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: PkiEnrollmentOpsDown
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: news-creator-ops
              instance: news-creator:9110
            exp_annotations:
              summary: "news-creator-ops PKI ops scrape failing"
              description: |
                Prometheus cannot scrape news-creator-ops :9110. Static targets
                report up=0 rather than vanishing, so this is the parent-ops
                scrape-down alert. Leftover pki-agent sidecars are a Docker-label
                gate, not this scrape.
