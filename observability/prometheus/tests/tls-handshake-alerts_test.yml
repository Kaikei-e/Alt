        values: '1x240'
    alert_rule_test:
      - eval_time: 3m
        alertname: TlsHandshakeCertExpirySoon
        exp_alerts:
          - exp_labels:
              severity: page
              stack: mtls
              job: tls-handshake
              instance: recap-worker:9443
              subject: recap-worker
            exp_annotations:
              summary: "recap-worker:9443 presents a certificate that expires in under 4h"
              description: |
                The certificate presented in the TLS handshake on recap-worker:9443 expires in
                7m 0s (negative once it has expired) while the on-disk leaf
                reported for recap-worker had 4h or more left within the last 2m, so the process is
                serving a stale certificate.
                Runbook: docs/runbooks/pki-agent-recovery.md
      - eval_time: 12m
        alertname: TlsHandshakeCertExpirySoon
