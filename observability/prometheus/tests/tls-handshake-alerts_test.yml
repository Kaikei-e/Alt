          - exp_labels:
              severity: page
              stack: mtls
              job: tls-handshake
              instance: news-creator:9443
              subject: news-creator
            exp_annotations:
              summary: "tls-handshake scrape failing for news-creator:9443"
              description: |
                Prometheus gets no result for news-creator:9443 from job tls-handshake;
                blackbox_exporter is down or unreachable, so no handshake is being probed.
                Runbook: docs/runbooks/pki-agent-recovery.md

