# Prometheus alerting rules for pki-agent sidecars.
#
# Fires early when any east-west mTLS leaf is close to expiry, so we never
# lose a Knowledge Home / alt-backend RPC path to a silent rotation failure
# (see ADR-000747 and the 2026-04-15 incident).
#
# Metric source: pki-agent/internal/infrastructure/metrics.go

groups:
  - name: pki_agent_cert_lifecycle
    interval: 30s
    rules:
      # PAGE: cert has less than 4h remaining. At 24h leaves this is ~83%
      # elapsed — well past the 66% renewal point. Something broke the renew
      # loop.
      - alert: PkiAgentCertExpirySoon
        expr: pki_agent_cert_remaining_seconds < 4 * 3600
        for: 2m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.subject }} mTLS cert expires in under 4h"
          description: |
            pki-agent-{{ $labels.subject }} reports only
            {{ humanize $value }}s left on the leaf certificate.
            Check: docker logs alt-pki-agent-{{ $labels.subject }}-1
            Runbook: docs/runbooks/pki-agent-recovery.md

      # PAGE: cert already expired. Consumer mTLS will be failing.
      - alert: PkiAgentCertExpired
        expr: pki_agent_healthy == 0
        for: 1m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.subject }} mTLS cert expired / missing / corrupt"
          description: |
            pki_agent_healthy=0 for subject {{ $labels.subject }}.
            Consumer east-west calls will fail until rotation succeeds.
            Runbook: docs/runbooks/pki-agent-recovery.md

      # PAGE: a renewal attempt failed. A single failure is noise; sustained
      # failures for 15m means the CA is unreachable or the provisioner is
      # rejecting us.
      - alert: PkiAgentRenewalFailing
        expr: |
          rate(pki_agent_renewal_total{result="failure"}[15m]) > 0
          and
          rate(pki_agent_renewal_total{result="success"}[15m]) == 0
        for: 15m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "pki-agent-{{ $labels.subject }} renewal loop failing"
          description: |
            Renewal attempts are failing and no success in the last 15m.
            Check step-ca health and the provisioner allowlist.

      # PAGE: pki-agent process not reachable by Prometheus. This was a ticket
      # until 2026-08-10, when a swept sidecar took seven hours to notice. The
      # two expiry alerts above cannot cover this case — they read metrics the
      # deleted container was the only source of — so this is the one that
      # catches it, and a cert-rotation outage does not deserve a ticket.
      - alert: PkiAgentDown
        expr: up{job="pki-agent"} == 0
        for: 5m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "pki-agent-{{ $labels.subject }} Prometheus scrape failing"
          description: |
            /metrics scrape failed for pki-agent-{{ $labels.subject }}. With static
            targets a deleted container reports up=0 rather than vanishing,
            so this is the alert that catches a swept sidecar.
            Runbook: docs/runbooks/pki-agent-recovery.md

      # PAGE: the target list itself shrank. Every alert above is per-subject,
      # so a target dropped from prometheus.yml takes that subject's coverage
      # with it and nothing complains. Only a count sees this.
      - alert: PkiAgentFleetIncomplete
        expr: count(up{job="pki-agent"}) < 14
        for: 10m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "pki-agent fleet is short: {{ $value }} of 14 sidecars scraped"
          description: |
            compose/pki.yaml defines 14 pki-agent sidecars but Prometheus is
            scraping fewer. A target missing from prometheus.yml silences
            every per-subject cert alert for that subject.
            Runbook: docs/runbooks/pki-agent-recovery.md

      # PAGE: the metric family is gone entirely. Every expiry alert here is
      # expression-based on a timeseries, which means their silence is
      # indistinguishable between "all certs healthy" and "there is nothing
      # left to measure". Ask the absence question explicitly.
      - alert: PkiAgentMetricsAbsent
        expr: absent_over_time(pki_agent_healthy[10m])
        for: 5m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "pki_agent_healthy has reported nothing for 10m"
          description: |
            No pki_agent_healthy series at all. Every cert-expiry alert is
            expression-based on this metric, so their silence is not
            evidence of health.
            Runbook: docs/runbooks/pki-agent-recovery.md
