# Prometheus alerting rules for in-process mTLS enrollment.
#
# Fires early when any east-west mTLS leaf is close to expiry, so we never
# lose a Knowledge Home / alt-backend RPC path to a silent rotation failure
# (see ADR-000747, ADR-000978, and the 2026-04-15 incident).
#
# Workload pki-agent sidecars are retired. Leftover detection is the
# Docker-label gate (compose audits / runbook sweep), not Prometheus scrape
# of :9510. Live cert alerts are in-process only (`pki_enrollment_*`).

groups:
  - name: pki_enrollment_cert_lifecycle
    interval: 30s
    rules:
      # PAGE: in-process manager reports <4h remaining on a Go parent leaf.
      - alert: PkiEnrollmentCertExpirySoon
        expr: pki_enrollment_cert_remaining_seconds < 4 * 3600
        for: 2m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.subject }} in-process mTLS cert expires in under 4h"
          description: |
            {{ $labels.subject }} reports only {{ humanize $value }}s left
            on the leaf certificate (in-process enrollment, not pki-agent).
            Check: docker logs alt-{{ $labels.subject }}-1
            Runbook: docs/runbooks/pki-agent-recovery.md

      - alert: PkiEnrollmentCertExpired
        expr: pki_enrollment_healthy == 0
        for: 1m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.subject }} in-process mTLS cert expired / missing / corrupt"
          description: |
            pki_enrollment_healthy=0 for subject {{ $labels.subject }}.
            Consumer east-west calls will fail until rotation succeeds.
            Runbook: docs/runbooks/pki-agent-recovery.md

      - alert: PkiEnrollmentRenewalFailing
        expr: |
          rate(pki_enrollment_renewal_total{result="failure"}[15m]) > 0
          unless on(subject)
          rate(pki_enrollment_renewal_total{result="success"}[15m]) > 0
        for: 15m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.subject }} in-process renewal loop failing"
          description: |
            Renewal attempts are failing and no success in the last 15m.
            Check step-ca health and the subject-scoped JWK provisioner.
            Runbook: docs/runbooks/pki-agent-recovery.md

      # PAGE: the three in-process series shrank. count() is the only
      # signal that a parent stopped exporting after the sidecar was removed.
      - alert: PkiEnrollmentFleetIncomplete
        expr: (count(count by (subject) (pki_enrollment_healthy)) or vector(0)) != 14
        for: 10m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "in-process PKI unique-subject fleet is {{ $value }} (want exactly 14)"
          description: |
            All 14 east-west parents must each export pki_enrollment_healthy
            on :9110. Raw series count can be padded by duplicate labels; this
            pin is unique subjects, and `or vector(0)` fires when every series
            is absent.
            Runbook: docs/runbooks/pki-agent-recovery.md

      - alert: PkiEnrollmentOpsDown
        expr: >-
          up{job=~"alt-backend|alt-harvester|alt-data-hub|alt-notifier|alt-butterfly-facade-ops|auth-hub|search-indexer|rag-orchestrator-ops|pre-processor-ops|tag-generator|recap-worker-ops|acolyte-orchestrator|recap-subworker-ops|news-creator-ops"} == 0
        for: 5m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "{{ $labels.job }} PKI ops scrape failing"
          description: |
            Prometheus cannot scrape {{ $labels.job }} :9110. Static targets
            report up=0 rather than vanishing, so this is the parent-ops
            scrape-down alert. Leftover pki-agent sidecars are a Docker-label
            gate, not this scrape.
            Runbook: docs/runbooks/pki-agent-recovery.md

      - alert: PkiEnrollmentWorkloadMetricsAbsent
        expr: |
          absent(pki_enrollment_healthy{subject="alt-backend"})
          or absent(pki_enrollment_healthy{subject="alt-harvester"})
          or absent(pki_enrollment_healthy{subject="alt-data-hub"})
          or absent(pki_enrollment_healthy{subject="alt-notifier"})
          or absent(pki_enrollment_healthy{subject="alt-butterfly-facade"})
          or absent(pki_enrollment_healthy{subject="auth-hub"})
          or absent(pki_enrollment_healthy{subject="search-indexer"})
          or absent(pki_enrollment_healthy{subject="rag-orchestrator"})
          or absent(pki_enrollment_healthy{subject="pre-processor"})
          or absent(pki_enrollment_healthy{subject="tag-generator"})
          or absent(pki_enrollment_healthy{subject="recap-worker"})
          or absent(pki_enrollment_healthy{subject="acolyte-orchestrator"})
          or absent(pki_enrollment_healthy{subject="recap-subworker"})
          or absent(pki_enrollment_healthy{subject="news-creator"})
        for: 5m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "an in-process PKI workload metric is absent"
          description: |
            One of the 14 in-process parents is not exporting
            pki_enrollment_healthy. After sidecar removal that series is the
            only cert-lifecycle signal for the subject.
            Runbook: docs/runbooks/pki-agent-recovery.md

      - alert: PkiEnrollmentMetricsAbsent
        expr: absent_over_time(pki_enrollment_healthy[10m])
        for: 5m
        labels:
          severity: page
          stack: mtls
        annotations:
          summary: "pki_enrollment_healthy has reported nothing for 10m"
          description: |
            No in-process enrollment series at all. Live cert alerts are
            in-process only; leftover sidecars are a Docker-label gate.
            Runbook: docs/runbooks/pki-agent-recovery.md
