[project]
name = "dashboard"
version = "0.1.0"
description = "Alt Platform Dashboard"
requires-python = ">=3.14"
dependencies = [
    "streamlit==1.59.0",
    "pandas==3.0.3",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Security floors for transitive dependencies (not directly imported by dashboard).
# gitpython: pulled in by streamlit; <3.1.55 has nine command-injection /
# arbitrary-file-write / env-var-exfiltration advisories (GHSA-2f96-g7mh-g2hx,
# GHSA-956x-8gvw-wg5v, GHSA-v396-v7q4-x2qj, GHSA-rwj8-pgh3-r573,
# GHSA-3rp5-jjmw-4wv2, GHSA-6p8h-3wgx-97gf, GHSA-fjr4-x663-mwxc,
# GHSA-r9mr-m37c-5fr3, GHSA-94p4-4cq8-9g67).
constraint-dependencies = ["Pillow>=12.3.0", "gitpython>=3.1.55"]

[tool.pyrefly]
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
python-version = "3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
