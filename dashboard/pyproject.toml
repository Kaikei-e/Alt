[project]
name = "dashboard"
version = "0.1.0"
description = "Alt Platform Dashboard"
requires-python = ">=3.14"
dependencies = [
    "streamlit==1.59.0",
    "pandas==3.0.3",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20,<0.16",
]

[tool.uv]
# Security floors for transitive dependencies (not directly imported by dashboard).
# gitpython: pulled in by streamlit; <=3.1.57 has RCE via crafted clone/submodule
# URLs (GHSA-wvpp-8hx9-p66j) plus earlier command-injection / arbitrary-file-write
# / env-var-exfiltration advisories (GHSA-2f96-g7mh-g2hx, GHSA-956x-8gvw-wg5v,
# GHSA-v396-v7q4-x2qj, GHSA-rwj8-pgh3-r573, GHSA-3rp5-jjmw-4wv2,
# GHSA-6p8h-3wgx-97gf, GHSA-fjr4-x663-mwxc, GHSA-r9mr-m37c-5fr3,
# GHSA-94p4-4cq8-9g67).
constraint-dependencies = ["certifi>=2026.10.19", "Pillow>=13.0.0", "gitpython>=3.2.1", "urllib3>=2.8.0"]
# streamlit==1.59.0 metadata caps pillow<13; upstream streamlit widened this to
# pillow<14 without code changes for Pillow 13.0.0.
override-dependencies = ["Pillow>=13.0.0"]

[tool.pyrefly]
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
python-version = "3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "S",     # bandit (security)
    "N",     # pep8-naming
    "ANN",   # annotations
    "PTH",   # use-pathlib
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "RUF001", # ambiguous-unicode-character-string (project contains Japanese text)
    "RUF002", # ambiguous-unicode-character-docstring (project contains Japanese text)
    "RUF003", # ambiguous-unicode-character-comment (project contains Japanese text)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest uses bare assert
"test_*.py" = ["S101"] # pytest uses bare assert
