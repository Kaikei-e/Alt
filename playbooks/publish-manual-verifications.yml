---
# Publish Pact verification records to the Broker for every
# (provider, consumer) bridge where the stock pact_verifier flow cannot
# emit results itself.
#
# A bridge publishes success only when the verifier that ran during THIS
# invocation left an evidence document behind. Nothing here asserts that a
# verification happened; the play reads what the verifier wrote and
# republishes it. Rows with no evidence are named in the output and exit
# the play non-zero — they are never skipped quietly, and never published.
#
# Evidence contract (schema alt.pact.evidence.v1), one file per bridge at
# {{ pact_evidence_dir }}/<provider>__<consumer>.json:
#
#   schema                 "alt.pact.evidence.v1"
#   run_id                 must equal pact_evidence_run_id, so an evidence
#                          file left over from an earlier run cannot be
#                          replayed as if it were fresh
#   provider / consumer    the pair the verification covered
#   implementation         verifier label; must equal the row's, so the
#                          label on the broker record is checked rather
#                          than free-form
#   provider_version       the version the verification actually ran against
#   verifier_version       the verifier's own version, posted as verifiedBy
#   verified_at            RFC3339 UTC
#   interactions_verified  must be > 0
#   interactions_skipped   interactions the verifier could not replay
#   result                 "passed"
#
# Producers of that document today:
#   - recap-worker/recap-worker/tests/provider_verification.rs writes one
#     per replayed pact, after every interaction in it has matched.
#   scripts/pact-check.sh purges the evidence directory, mints
#   pact_evidence_run_id, and runs the producers in the same invocation.
#
# Every task that carries the basic-auth password uses no_log: true
# (audit F-001 / F-002).
#
# Required vars (pass via -e or GitHub Actions `env:`):
#   provider_version      full provider SHA for the recap-worker rows
#   pact_evidence_dir     directory the verifiers wrote evidence into
#   pact_evidence_run_id  token identifying this invocation
#   broker_base_url       http(s)://host[:port]  (no trailing slash)
#   broker_username       basic-auth user
#   bridge_dry_run        optional; true prints the plan and touches nothing
#
# Required env:
#   PACT_BROKER_PASSWORD  never passed via -e so it stays off argv
#                         and is redacted from ansible logs by no_log

- name: Publish manual Pact verification bridges
  hosts: localhost
  gather_facts: false

  vars:
    bridge_dry_run: false
    evidence_schema: alt.pact.evidence.v1

    # Bridge registry — one row per (provider, consumer) pair where the
    # standard pact_verifier flow cannot emit a verification result.
    # Edit here to add / remove bridges; the loop below is pure data.
    # `implementation` is not a note: the preflight requires the verifier's
    # own evidence to carry the same string, so a row cannot claim a
    # verifier that did not run.
    # `provider_version` deliberately re-reads the provider_version -e
    # var at template time so changes to -e flow through without edits
    # here.
    bridge_registry:
      # recap-worker ← 3 consumers, Rust hand-rolled HTTP replay
      - provider: recap-worker
        consumer: rag-orchestrator
        implementation: rust-stub-replay
      - provider: recap-worker
        consumer: recap-evaluator
        implementation: rust-stub-replay
      - provider: recap-worker
        consumer: search-indexer
        implementation: rust-stub-replay

  tasks:
    - name: Require evidence vars
      ansible.builtin.assert:
        that:
          - pact_evidence_dir is defined and pact_evidence_dir | length > 0
          - pact_evidence_run_id is defined and pact_evidence_run_id | length > 0
        fail_msg: >-
          publish-manual-verifications: pact_evidence_dir and
          pact_evidence_run_id are required. Invoke through
          scripts/pact-check.sh, which mints both and runs the verifiers
          that populate the directory.

    - name: Require provider_version / broker_base_url / broker_username / PACT_BROKER_PASSWORD
      when: not bridge_dry_run | bool
      ansible.builtin.assert:
        that:
          - provider_version is defined and provider_version | length > 0
          - broker_base_url is defined and broker_base_url | length > 0
          - broker_username is defined and broker_username | length > 0
          - lookup('ansible.builtin.env', 'PACT_BROKER_PASSWORD') | length > 0
          # F-004: fail fast if broker_base_url is mistyped. The regex
          # rejects trailing slashes and paths, so callers can't
          # accidentally redirect basic-auth credentials to an
          # unintended endpoint.
          - broker_base_url is match('^https?://[^/]+(:[0-9]+)?$')
        fail_msg: >-
          publish-manual-verifications: missing or malformed required
          var. Provide provider_version, broker_base_url (scheme +
          host[:port] only, no trailing slash), broker_username via
          -e and PACT_BROKER_PASSWORD in env.

    # ------------------------------------------------------------------
    # Evidence preflight. Runs before any broker call so a row that cannot
    # prove a verification never reaches a POST.
    # ------------------------------------------------------------------
    - name: "Resolve the provider version each row is tagged with"
      ansible.builtin.set_fact:
        all_bridges: >-
          {{ all_bridges | default([]) + [ item | combine({
               'provider_version': provider_version | default('') }) ] }}
      loop: "{{ bridge_registry }}"
      loop_control:
        label: "{{ item.consumer }} -> {{ item.provider }}"

    - name: "Stat verification evidence for every bridge row"
      ansible.builtin.stat:
        path: "{{ pact_evidence_dir }}/{{ item.provider }}__{{ item.consumer }}.json"
      loop: "{{ all_bridges }}"
      loop_control:
        label: "{{ item.consumer }} -> {{ item.provider }}"
      register: evidence_stat

    - name: "Start with no evidence"
      ansible.builtin.set_fact:
        evidence_by_key: {}

    # Parsed one file per iteration rather than in a single fold so that a
    # malformed document fails on a task labelled with its own filename.
    - name: "Parse the evidence documents that exist"
      ansible.builtin.set_fact:
        evidence_by_key: >-
          {{ evidence_by_key | combine({
               (item.stat.path | basename | regex_replace('\.json$', '')):
                 (lookup('ansible.builtin.file', item.stat.path) | from_json) }) }}
      loop: "{{ evidence_stat.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.stat.path | basename }}"

    # One entry per row: the row, the evidence found for it (possibly {}),
    # and the list of reasons it is not publishable. An empty reason list
    # is the only thing that authorises a POST.
    - name: "Judge each bridge row against its evidence"
      ansible.builtin.set_fact:
        bridge_report: >-
          {{ bridge_report | default([]) + [{
               'row': item,
               'evidence': doc,
               'reasons': reasons,
             }] }}
      vars:
        key: "{{ item.provider }}__{{ item.consumer }}"
        doc: "{{ evidence_by_key[key] | default({}) }}"
        reasons: >-
          {{
            (['no evidence document at ' ~ pact_evidence_dir ~ '/' ~ key ~ '.json'
              ~ ' — no verification produced a result for this pair in this run']
             if doc == {} else [])
            + (['schema is ' ~ (doc.schema | default('<absent>'))
                ~ ', expected ' ~ evidence_schema]
               if doc != {} and (doc.schema | default('')) != evidence_schema else [])
            + (['run_id is ' ~ (doc.run_id | default('<absent>'))
                ~ ', expected ' ~ pact_evidence_run_id
                ~ ' — evidence is left over from an earlier run']
               if doc != {} and (doc.run_id | default('')) != pact_evidence_run_id else [])
            + (['evidence covers ' ~ (doc.consumer | default('?')) ~ ' -> '
                ~ (doc.provider | default('?')) ~ ', not this row']
               if doc != {} and ((doc.provider | default('')) != item.provider
                                 or (doc.consumer | default('')) != item.consumer) else [])
            + (['verifier reported implementation ' ~ (doc.implementation | default('<absent>'))
                ~ ', row declares ' ~ item.implementation]
               if doc != {} and (doc.implementation | default('')) != item.implementation else [])
            + (['verification ran against provider version '
                ~ (doc.provider_version | default('<absent>'))
                ~ ', row publishes ' ~ item.provider_version]
               if doc != {} and (doc.provider_version | default('')) != item.provider_version else [])
            + (['verifier reported result ' ~ (doc.result | default('<absent>'))
                ~ ', not passed']
               if doc != {} and (doc.result | default('')) != 'passed' else [])
            + (['verifier replayed 0 interactions']
               if doc != {} and (doc.interactions_verified | default(0) | int) < 1 else [])
          }}
      loop: "{{ all_bridges }}"
      loop_control:
        label: "{{ item.consumer }} -> {{ item.provider }}"

    - name: "Evidence preflight result"
      ansible.builtin.debug:
        msg: >-
          {{ 'OK' if entry.reasons | length == 0 else 'NO EVIDENCE' }}:
          {{ entry.row.consumer }} -> {{ entry.row.provider }}
          {{ '(' ~ entry.evidence.implementation ~ ', '
             ~ entry.evidence.interactions_verified ~ ' interaction(s))'
             if entry.reasons | length == 0
             else '— ' ~ (entry.reasons | join('; ')) }}
      loop: "{{ bridge_report }}"
      loop_control:
        loop_var: entry
        label: "{{ entry.row.consumer }} -> {{ entry.row.provider }}"

    - name: "Plan only (dry run)"
      when: bridge_dry_run | bool
      ansible.builtin.debug:
        msg: >-
          WOULD POST MANUAL VERIFICATION: {{ entry.row.provider }}/{{ entry.row.consumer }}
          [evidence: {{ 'present' if entry.reasons | length == 0 else 'MISSING' }}]
      loop: "{{ bridge_report }}"
      loop_control:
        loop_var: entry
        label: "{{ entry.row.consumer }} -> {{ entry.row.provider }}"

    # `reasons` is truthy exactly when the row failed a check, so
    # rejectattr/selectattr on it partitions the report without a list
    # comparison.
    - name: "Partition the report into earned and unearned rows"
      ansible.builtin.set_fact:
        publishable_bridges: []
        unearned_bridges: "{{ bridge_report | selectattr('reasons') | list }}"

    - name: "Attach each evidence document to the row that earned it"
      ansible.builtin.set_fact:
        publishable_bridges: >-
          {{ publishable_bridges
             + [ entry.row | combine({'evidence': entry.evidence}) ] }}
      loop: "{{ bridge_report | rejectattr('reasons') | list }}"
      loop_control:
        loop_var: entry
        label: "{{ entry.row.consumer }} -> {{ entry.row.provider }}"

    # ------------------------------------------------------------------
    # Publish. Only rows carrying a passing evidence document get here.
    # ------------------------------------------------------------------
    - name: "Publish bridge verifications"
      when: not bridge_dry_run | bool
      ansible.builtin.include_tasks: _publish-bridge.yml
      loop: "{{ publishable_bridges }}"
      loop_control:
        loop_var: bridge
        label: "{{ bridge.consumer }} -> {{ bridge.provider }} ({{ bridge.implementation }})"

    # ------------------------------------------------------------------
    # Loud tail. A row without evidence has published nothing; saying so
    # and exiting non-zero is what keeps "no verification" distinguishable
    # from "verification passed".
    # ------------------------------------------------------------------
    - name: "Fail on bridge rows that published nothing"
      when:
        - not bridge_dry_run | bool
        - unearned_bridges | length > 0
      ansible.builtin.fail:
        msg: |-
          {{ unearned_bridges | length }} bridge row(s) published no
          verification record because no verifier produced evidence for
          them in this run:
          {% for entry in unearned_bridges %}
            - {{ entry.row.consumer }} -> {{ entry.row.provider }}
              ({{ entry.row.implementation }}): {{ entry.reasons | join('; ') }}
          {% endfor %}
          Either wire a verification that emits an alt.pact.evidence.v1
          document for the pair, or delete the row. Publishing success
          without one is what this gate exists to prevent.
