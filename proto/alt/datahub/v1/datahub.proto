// =============================================================================
// RAG Tool Operations (ADR-000617)
// =============================================================================

// FetchTagCloudRequest is the request for FetchTagCloud.
// Wire-identical to
// services.backend.v1.BackendInternalServiceFetchTagCloudRequest — the legacy
// name carried the service name because that package already had a
// FetchTagCloud pair belonging to a different service.
message FetchTagCloudRequest {
  // Maximum number of tags to return (default: 300, max: 500)
  int32 limit = 1;
}

// FetchTagCloudResponse contains tag cloud entries.
// Wire-identical to
// services.backend.v1.BackendInternalServiceFetchTagCloudResponse.
message FetchTagCloudResponse {
  repeated TagCloudItem tags = 1;
}

// TagCloudItem represents a tag with its article count.
// Wire-identical to services.backend.v1.TagCloudInternalItem.
message TagCloudItem {
  string tag_name = 1;
  int32 article_count = 2;
}

// FetchArticlesByTagRequest is the request for FetchArticlesByTag.
// Wire-identical to
// services.backend.v1.BackendInternalServiceFetchArticlesByTagRequest.
message FetchArticlesByTagRequest {
  string tag_name = 1;
  int32 limit = 2;
}

// FetchArticlesByTagResponse contains articles matching the tag.
// Wire-identical to
// services.backend.v1.BackendInternalServiceFetchArticlesByTagResponse.
message FetchArticlesByTagResponse {
  repeated ArticleByTagItem articles = 1;
}

// ArticleByTagItem represents a minimal article returned by tag search.
message ArticleByTagItem {
  string id = 1;
  string title = 2;
  string url = 3;
  string published_at = 4;
}

// =============================================================================
// ListRecapArticles — service-to-service paginated article window fetch
// =============================================================================

// ListRecapArticlesRequest is the request for paginated article fetch in a window
message ListRecapArticlesRequest {
  // Lower bound of the time window (RFC3339)
  string from = 1;
  // Upper bound of the time window (RFC3339)
  string to = 2;
  // 1-indexed page number (default 1)
  optional int32 page = 3;
  // Articles per page (default server-side)
  optional int32 page_size = 4;
  // Optional projection: "title" / "fulltext"; empty = all fields
  repeated string fields = 5;
  // Optional language filter: "ja" / "en"
  optional string lang_hint = 6;
}

// RecapArticleRange echoes the window bounds in the response
message RecapArticleRange {
  string from = 1;
  string to = 2;
}

// RecapArticleItem is a single article entry in the response
message RecapArticleItem {
  // Article UUID
  string article_id = 1;
  // Optional title
  optional string title = 2;
  // Full article text (may be empty if fields=title)
  string fulltext = 3;
  // Optional publication timestamp (RFC3339)
  optional string published_at = 4;
  // Optional source URL
  optional string source_url = 5;
  // Optional detected language
  optional string lang_hint = 6;
}

// ListRecapArticlesResponse is the paginated response
message ListRecapArticlesResponse {
  // Echo of requested window
  RecapArticleRange range = 1;
  // Total matching articles in the window
  int32 total = 2;
  // Current page (1-indexed)
  int32 page = 3;
  // Page size used
  int32 page_size = 4;
  // Whether additional pages exist
  bool has_more = 5;
  // Articles on this page
  repeated RecapArticleItem articles = 6;
}

// =============================================================================
// Absorbed REST surface (ADR-000954 D6)
//
// The two /v1/internal REST routes are capabilities of the same owner, reached
// over a different protocol only because ADR-000945 judged the extraction cost
// too high at the time. They get RPCs here so that Wave 2-C can delete the
// REST group rather than move it. Field names mirror the JSON bodies those
// routes answer with, so a peer porting from REST to RPC changes the transport
// and not the shape it parses.
//
// These two have no legacy BackendInternalService counterpart, so — unlike
// every other message in this file — they are exempt from the wire-identity
// test in datahubapi/wirecompat_test.go.
// =============================================================================

message GetSystemUserRequest {}

message GetSystemUserResponse {
  // Kratos identity id of the first identity, as GET /v1/internal/system-user
  // returns in its `user_id` field.
  string user_id = 1;
}

// RecentArticleItem mirrors one entry of GET /v1/internal/articles/recent.
// published_at is an RFC3339 string rather than a Timestamp because that is
// what the REST route emits and rag-orchestrator parses today; converting it
// would make the RPC a re-shaping as well as a re-protocolling.
message RecentArticleItem {
  string id = 1;
  string title = 2;
  string url = 3;
  string published_at = 4;
  string feed_id = 5;
  repeated string tags = 6;
}

message ListRecentArticlesRequest {
  // Time window in hours. Unset means the server default (24); the maximum is
  // 168. Explicitly optional so that "unset" stays distinguishable from a
  // caller that means to send 0 — proto3 cannot tell those apart otherwise,
  // and the REST route's zero handling differs between the two parameters.
  optional int32 within_hours = 1;
  // Maximum articles to return. Unset means the server default (100); an
  // explicit 0 means "no count limit, time window only", which is the mode
  // rag-orchestrator uses. That distinction is the reason for optional.
  optional int32 limit = 2;
}

message ListRecentArticlesResponse {
  repeated RecentArticleItem articles = 1;
  // Window lower bound (RFC3339)
  string since = 2;
  // Window upper bound (RFC3339)
  string until = 3;
  int32 count = 4;
}

// =============================================================================
// Outbox — the transactional outbox alt-harvester drains (ADR-000954 Wave 3,
// catalog §2.A)
// =============================================================================
//
// Three capabilities, four procedures. The extra procedure is deliberate: the
// driver these replace took a bare `status string` and let the caller write
// any of the four values, which is how "release an unattempted claim" and
// "record a terminal outcome" ended up as the same call with different
// arguments. They have different preconditions — a release is only ever legal
// from PROCESSING, and only the terminal statuses stamp processed_at — so they
// are separated here and the status is an enum rather than a string.

// OutboxEventStatus is the outbox row's position in its state machine.
//
// PENDING → PROCESSING is ClaimOutboxBatch. PROCESSING → PROCESSED/FAILED is
// MarkOutboxProcessed. PROCESSING → PENDING is ReleaseOutboxEvent. No other
// transition exists, and none of them can be requested by name — the caller
// picks a procedure, not a status string.
enum OutboxEventStatus {
  OUTBOX_EVENT_STATUS_UNSPECIFIED = 0;
  OUTBOX_EVENT_STATUS_PENDING = 1;
  OUTBOX_EVENT_STATUS_PROCESSING = 2;
  OUTBOX_EVENT_STATUS_PROCESSED = 3;
  OUTBOX_EVENT_STATUS_FAILED = 4;
}

// OutboxEvent is one claimed row of outbox_events.
message OutboxEvent {
  string id = 1;
  string event_type = 2;
  // Opaque to alt-data-hub. The producer wrote it inside the article-upsert
  // transaction and the consumer parses it; the data hub only moves it.
  bytes payload = 3;
  OutboxEventStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ClaimOutboxBatchRequest {
  // Page size. Bounded server-side; 0 means the server default.
  int32 limit = 1;
}

message ClaimOutboxBatchResponse {
  // Rows this call — and no concurrent call — now owns. Already PROCESSING.
  repeated OutboxEvent events = 1;
}

message MarkOutboxProcessedRequest {
  string id = 1;
  // PROCESSED or FAILED. Any other value is InvalidArgument: PENDING belongs
  // to ReleaseOutboxEvent and PROCESSING belongs to ClaimOutboxBatch.
  OutboxEventStatus status = 2;
  string error_message = 3;
}

message MarkOutboxProcessedResponse {}

message ReleaseOutboxEventRequest {
  string id = 1;
}

message ReleaseOutboxEventResponse {}

message PruneOutboxEventsRequest {
  // Retention window. The caller owns this number — it is an operational
  // policy of the pruning job, not an invariant of the table.
  int64 older_than_seconds = 1;
}

message PruneOutboxEventsResponse {
  int64 pruned_count = 1;
}

// =============================================================================
// OG image / article_heads (catalog §2.D)
// =============================================================================

// ArticleHead is one row of article_heads: the scraped <head> of an article
// page plus the og:image URL extracted from it.
message ArticleHead {
  string id = 1;
  string article_id = 2;
  string head_html = 3;
  // Empty when the row exists but carries no og:image.
  string og_image_url = 4;
}

message GetArticleHeadRequest {
  string article_id = 1;
}

message GetArticleHeadResponse {
  // Absent when no row exists. Distinct from a present head with empty
  // fields, which means "scraped, nothing found" — the backfill job uses the
  // difference to decide whether to re-scrape.
  optional ArticleHead head = 1;
}

message BatchGetOgImageURLsRequest {
  repeated string article_ids = 1;
}

message BatchGetOgImageURLsResponse {
  // article_id → og:image URL. Article ids with no row, or with an empty
  // og_image_url, are absent from the map rather than present-and-empty.
  map<string, string> og_image_urls = 1;
}

// OgImageBackfillCandidate is an article whose feed has no RSS-supplied
// og:image and which has not been scraped yet.
message OgImageBackfillCandidate {
  string article_id = 1;
  string url = 2;
}

message ListFeedsMissingOgImageRequest {
  // Per-run scraping budget. The caller owns it: this bounds outbound HTTP
  // load on publishers, which is alt-harvester's concern, not the table's.
  int32 limit = 1;
}

message ListFeedsMissingOgImageResponse {
  repeated OgImageBackfillCandidate candidates = 1;
}

message ListUnwarmedOgImageURLsRequest {
  int32 limit = 1;
}

message ListUnwarmedOgImageURLsResponse {
  repeated string urls = 1;
}

message PurgeExpiredArticleHeadsRequest {
  // Copyright retention window, owned by the caller (og-image-retention).
  int64 ttl_seconds = 1;
}

message PurgeExpiredArticleHeadsResponse {
  int64 purged_count = 1;
}

// =============================================================================
// Image proxy cache (catalog §2.E)
// =============================================================================

// ImageProxyCacheEntry is one row of image_proxy_cache, image bytes included.
//
// The bytes travel over the RPC. That is the cost of the data hub owning
// alt_db: the alternative — a capability that returns a handle the caller then
// resolves against the database itself — is the thing ADR-000954 D3 exists to
// remove. Entries are single processed images (a few hundred KB after the
// resize and WebP encode the proxy applies before it saves), not originals.
message ImageProxyCacheEntry {
  string url_hash = 1;
  string original_url = 2;
  bytes data = 3;
  string content_type = 4;
  int32 width = 5;
  int32 height = 6;
  int64 size_bytes = 7;
  string etag = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message GetImageProxyCacheRequest {
  string url_hash = 1;
}

message GetImageProxyCacheResponse {
  // Absent on both "no row" and "row expired". The caller treats them the
  // same — it re-fetches — and collapsing them here keeps the TTL comparison
  // on the side that owns the clock the rows were written against.
  optional ImageProxyCacheEntry entry = 1;
}

message PutImageProxyCacheRequest {
  ImageProxyCacheEntry entry = 1;
}

message PutImageProxyCacheResponse {}

message EvictExpiredImageProxyCacheRequest {}

message EvictExpiredImageProxyCacheResponse {
  int64 evicted_count = 1;
}

message PurgeImageProxyCacheOlderThanRequest {
  // Retention by first acquisition (created_at), independent of each entry's
  // TTL. Copyright compliance, owned by the caller.
  int64 ttl_seconds = 1;
}

message PurgeImageProxyCacheOlderThanResponse {
  int64 purged_count = 1;
}

// =============================================================================
// Scraping policy (catalog §2.L)
// =============================================================================

// ScrapingDomain is one row of scraping_domains: the cached robots.txt for a
// publisher plus the local policy overlaid on it.
//
// Fetching robots.txt is an external HTTP call and stays in alt-harvester
// (ADR-000954 D4). What crosses this boundary is only the result.
message ScrapingDomain {
  string id = 1;
  string domain = 2;
  string scheme = 3;
  bool allow_fetch_body = 4;
  bool allow_ml_training = 5;
  int32 allow_cache_days = 6;
  bool force_respect_robots = 7;
  optional string robots_txt_url = 8;
  optional string robots_txt_content = 9;
  optional google.protobuf.Timestamp robots_txt_fetched_at = 10;
  optional int32 robots_txt_last_status = 11;
  optional int32 robots_crawl_delay_sec = 12;
  repeated string robots_disallow_paths = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message GetScrapingDomainByDomainRequest {
  string domain = 1;
}

message GetScrapingDomainByDomainResponse {
  // Absent when the domain has never been seen. Callers treat that as "no
  // policy recorded", which is not the same as a recorded permissive policy.
  optional ScrapingDomain scraping_domain = 1;
}

message GetScrapingDomainByIDRequest {
  string id = 1;
}

message GetScrapingDomainByIDResponse {
  optional ScrapingDomain scraping_domain = 1;
}

message SaveScrapingDomainRequest {
  ScrapingDomain scraping_domain = 1;
}

message SaveScrapingDomainResponse {
  // The row as persisted. id, created_at and updated_at are assigned by the
  // provider on insert, so the caller cannot know them from the request; the
  // driver this replaces mutated the caller's struct in place, which stops
  // working the moment there is a process boundary in between.
  ScrapingDomain scraping_domain = 1;
}

message ListScrapingDomainsRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message ListScrapingDomainsResponse {
  repeated ScrapingDomain scraping_domains = 1;
}

// ScrapingPolicyUpdate is a partial update: an absent field leaves the stored
// value alone (COALESCE), it does not clear it.
message ScrapingPolicyUpdate {
  optional bool allow_fetch_body = 1;
  optional bool allow_ml_training = 2;
  optional int32 allow_cache_days = 3;
  optional bool force_respect_robots = 4;
}

message UpdateScrapingDomainPolicyRequest {
  string id = 1;
  ScrapingPolicyUpdate update = 2;
}

message UpdateScrapingDomainPolicyResponse {}

message SaveDeclinedDomainRequest {
  string user_id = 1;
  string domain = 2;
}

message SaveDeclinedDomainResponse {}

message IsDomainDeclinedRequest {
  string user_id = 1;
  string domain = 2;
}

message IsDomainDeclinedResponse {
  bool declined = 1;
}

// =============================================================================
// Automatic full-text fetch groundwork (catalog §2.O)
// =============================================================================

message ListSubscribedUserIDsByFeedLinkIDRequest {
  string feed_link_id = 1;
}

message ListSubscribedUserIDsByFeedLinkIDResponse {
  repeated string user_ids = 1;
}

message CheckArticleExistsByURLForUserRequest {
  string url = 1;
  string user_id = 2;
}

message CheckArticleExistsByURLForUserResponse {
  bool exists = 1;
  string article_id = 2;
}

// =============================================================================
// DataHubService — every capability backed by alt_db
// =============================================================================

// DataHubService is the contract alt-data-hub serves behind mutual TLS.
//
// Authentication is the peer certificate; there is no per-RPC credential and
// no tenant argument. Callers are the 10 principals on the provider's
// allowlist (ADR-000954 D5), not end users.
service DataHubService {
  // ── Article reads (search-indexer) ──

  // ListArticlesWithTags returns articles with tags using backward keyset pagination.
  // Used by search-indexer for backfill indexing.
  // Origin: services.backend.v1.BackendInternalService/ListArticlesWithTags
  rpc ListArticlesWithTags(ListArticlesWithTagsRequest) returns (ListArticlesWithTagsResponse);

  // ListArticlesWithTagsForward returns articles with tags using forward keyset pagination.
  // Used by search-indexer for incremental indexing.
  // Origin: services.backend.v1.BackendInternalService/ListArticlesWithTagsForward
  rpc ListArticlesWithTagsForward(ListArticlesWithTagsForwardRequest) returns (ListArticlesWithTagsForwardResponse);

  // ListDeletedArticles returns deleted articles for syncing deletions.
  // Origin: services.backend.v1.BackendInternalService/ListDeletedArticles
  rpc ListDeletedArticles(ListDeletedArticlesRequest) returns (ListDeletedArticlesResponse);

  // GetLatestArticleTimestamp returns the latest article created_at timestamp.
  // Origin: services.backend.v1.BackendInternalService/GetLatestArticleTimestamp
  rpc GetLatestArticleTimestamp(GetLatestArticleTimestampRequest) returns (GetLatestArticleTimestampResponse);

  // GetArticleByID returns a single article with tags.
  // Origin: services.backend.v1.BackendInternalService/GetArticleByID
  rpc GetArticleByID(GetArticleByIDRequest) returns (GetArticleByIDResponse);

  // ── Article writes (pre-processor) ──

  // CheckArticleExists checks if an article already exists by URL and feed.
  // Origin: services.backend.v1.BackendInternalService/CheckArticleExists
  rpc CheckArticleExists(CheckArticleExistsRequest) returns (CheckArticleExistsResponse);

  // CreateArticle creates a new article and publishes ArticleCreated event.
  // Origin: services.backend.v1.BackendInternalService/CreateArticle
  rpc CreateArticle(CreateArticleRequest) returns (CreateArticleResponse);

  // SaveArticleSummary saves an article summary.
  // Origin: services.backend.v1.BackendInternalService/SaveArticleSummary
  rpc SaveArticleSummary(SaveArticleSummaryRequest) returns (SaveArticleSummaryResponse);

  // GetArticleContent returns article content for summarization.
  // Origin: services.backend.v1.BackendInternalService/GetArticleContent
  rpc GetArticleContent(GetArticleContentRequest) returns (GetArticleContentResponse);

  // ── Feed operations (pre-processor, pre-processor-sidecar) ──

  // GetFeedID returns the feed ID for a given feed URL.
  // Origin: services.backend.v1.BackendInternalService/GetFeedID
  rpc GetFeedID(GetFeedIDRequest) returns (GetFeedIDResponse);

  // ListFeedURLs returns feed URLs with cursor pagination.
  // Origin: services.backend.v1.BackendInternalService/ListFeedURLs
  rpc ListFeedURLs(ListFeedURLsRequest) returns (ListFeedURLsResponse);

  // ── Tag operations (tag-generator) ──

  // UpsertArticleTags upserts tags for an article.
  // Origin: services.backend.v1.BackendInternalService/UpsertArticleTags
  rpc UpsertArticleTags(UpsertArticleTagsRequest) returns (UpsertArticleTagsResponse);

  // BatchUpsertArticleTags upserts tags for multiple articles.
  // Origin: services.backend.v1.BackendInternalService/BatchUpsertArticleTags
  rpc BatchUpsertArticleTags(BatchUpsertArticleTagsRequest) returns (BatchUpsertArticleTagsResponse);

  // ListUntaggedArticles returns articles without tags.
  // Origin: services.backend.v1.BackendInternalService/ListUntaggedArticles
  rpc ListUntaggedArticles(ListUntaggedArticlesRequest) returns (ListUntaggedArticlesResponse);

  // BatchGetTagsByArticleIDs returns tags for a batch of article ids.
  // Replaces tag-generator /api/v1/tags/batch (ADR-000241 / ADR-000397)
  // so recap-worker fetches tags directly from the data owner instead
  // of reading alt_db tables through tag-generator.
  // Origin: services.backend.v1.BackendInternalService/BatchGetTagsByArticleIDs
  rpc BatchGetTagsByArticleIDs(BatchGetTagsByArticleIDsRequest) returns (BatchGetTagsByArticleIDsResponse);

  // ── Summary quality operations (quality checker) ──

  // DeleteArticleSummary deletes an article summary by article ID.
  // Origin: services.backend.v1.BackendInternalService/DeleteArticleSummary
  rpc DeleteArticleSummary(DeleteArticleSummaryRequest) returns (DeleteArticleSummaryResponse);

  // CheckArticleSummaryExists checks if an article summary exists.
  // Origin: services.backend.v1.BackendInternalService/CheckArticleSummaryExists
  rpc CheckArticleSummaryExists(CheckArticleSummaryExistsRequest) returns (CheckArticleSummaryExistsResponse);

  // FindArticlesWithSummaries returns articles with summaries for quality checking.
  // Origin: services.backend.v1.BackendInternalService/FindArticlesWithSummaries
  rpc FindArticlesWithSummaries(FindArticlesWithSummariesRequest) returns (FindArticlesWithSummariesResponse);

  // ── Summarization polling (pre-processor) ──

  // ListUnsummarizedArticles returns articles without summaries for polling-based summarization.
  // Origin: services.backend.v1.BackendInternalService/ListUnsummarizedArticles
  rpc ListUnsummarizedArticles(ListUnsummarizedArticlesRequest) returns (ListUnsummarizedArticlesResponse);

  // HasUnsummarizedArticles checks if any articles lack summaries.
  // Origin: services.backend.v1.BackendInternalService/HasUnsummarizedArticles
  rpc HasUnsummarizedArticles(HasUnsummarizedArticlesRequest) returns (HasUnsummarizedArticlesResponse);

  // ── Backfill operations (pre-processor split-DB) ──

  // GetEmptyFeedID returns a feed ID that has no articles for the given feed URL.
  // Returns empty feed_id if all feeds for this URL already have articles.
  // Origin: services.backend.v1.BackendInternalService/GetEmptyFeedID
  rpc GetEmptyFeedID(GetEmptyFeedIDRequest) returns (GetEmptyFeedIDResponse);

  // ── RAG tool operations (ADR-000617: rag-orchestrator synthesis) ──

  // FetchTagCloud returns tag names with article counts for topic exploration.
  // Origin: services.backend.v1.BackendInternalService/FetchTagCloud
  rpc FetchTagCloud(FetchTagCloudRequest) returns (FetchTagCloudResponse);

  // FetchArticlesByTag returns articles filtered by tag name.
  // Origin: services.backend.v1.BackendInternalService/FetchArticlesByTag
  rpc FetchArticlesByTag(FetchArticlesByTagRequest) returns (FetchArticlesByTagResponse);

  // ── Recap article window (recap-worker) ──

  // ListRecapArticles returns paginated articles within a time window.
  // Service-to-service only; auth is established at the mTLS transport layer.
  // Origin: services.backend.v1.BackendInternalService/ListRecapArticles
  rpc ListRecapArticles(ListRecapArticlesRequest) returns (ListRecapArticlesResponse);

  // ── Absorbed REST surface (ADR-000954 D6) ──

  // GetSystemUser returns the first Kratos identity id.
  // Origin: GET /v1/internal/system-user (REST). Called by pre-processor.
  rpc GetSystemUser(GetSystemUserRequest) returns (GetSystemUserResponse);

  // ListRecentArticles returns articles published within a time window.
  // Origin: GET /v1/internal/articles/recent (REST). Called by
  // rag-orchestrator for its temporal topics feature.
  rpc ListRecentArticles(ListRecentArticlesRequest) returns (ListRecentArticlesResponse);

  // ── Outbox (alt-harvester: outbox-worker, outbox-prune) ──

  // ClaimOutboxBatch takes ownership of up to `limit` PENDING rows and marks
  // them PROCESSING, in one transaction, with FOR UPDATE SKIP LOCKED.
  //
  // The lock and the commit are both inside this RPC, and that is the whole
  // point of the capability: exposing "select pending" and "mark processing"
  // as two procedures would put a network round trip between them and let two
  // harvesters claim the same event (ADR-000954 D3, case against the
  // port-mirror shape).
  rpc ClaimOutboxBatch(ClaimOutboxBatchRequest) returns (ClaimOutboxBatchResponse);

  // MarkOutboxProcessed records a terminal outcome for a claimed row and
  // stamps processed_at.
  rpc MarkOutboxProcessed(MarkOutboxProcessedRequest) returns (MarkOutboxProcessedResponse);

  // ReleaseOutboxEvent returns a claimed-but-unattempted row to PENDING.
  //
  // Callers invoke it on a context detached from the one that was cancelled,
  // because the row is only reachable through this call: ClaimOutboxBatch
  // reads PENDING only, so a PROCESSING row nobody releases is never fetched
  // again by anyone.
  rpc ReleaseOutboxEvent(ReleaseOutboxEventRequest) returns (ReleaseOutboxEventResponse);

  // PruneOutboxEvents deletes PROCESSED rows older than the given window.
  rpc PruneOutboxEvents(PruneOutboxEventsRequest) returns (PruneOutboxEventsResponse);

  // ── OG image / article_heads (alt-backend reads, alt-harvester pipeline) ──

  // GetArticleHead returns the scraped <head> record for an article.
  rpc GetArticleHead(GetArticleHeadRequest) returns (GetArticleHeadResponse);

  // BatchGetOgImageURLs resolves og:image URLs for many articles at once.
  rpc BatchGetOgImageURLs(BatchGetOgImageURLsRequest) returns (BatchGetOgImageURLsResponse);

  // ListFeedsMissingOgImage returns the og-image-backfill work list.
  rpc ListFeedsMissingOgImage(ListFeedsMissingOgImageRequest) returns (ListFeedsMissingOgImageResponse);

  // ListUnwarmedOgImageURLs returns feed og:image URLs with no live cache entry.
  rpc ListUnwarmedOgImageURLs(ListUnwarmedOgImageURLsRequest) returns (ListUnwarmedOgImageURLsResponse);

  // PurgeExpiredArticleHeads enforces the article_heads retention window.
  rpc PurgeExpiredArticleHeads(PurgeExpiredArticleHeadsRequest) returns (PurgeExpiredArticleHeadsResponse);

  // ── Image proxy cache (alt-backend serving path, alt-harvester retention) ──

  // GetImageProxyCache returns a live cache entry, or nothing.
  rpc GetImageProxyCache(GetImageProxyCacheRequest) returns (GetImageProxyCacheResponse);

  // PutImageProxyCache upserts a cache entry by url_hash.
  rpc PutImageProxyCache(PutImageProxyCacheRequest) returns (PutImageProxyCacheResponse);

  // EvictExpiredImageProxyCache deletes entries past their own TTL.
  rpc EvictExpiredImageProxyCache(EvictExpiredImageProxyCacheRequest) returns (EvictExpiredImageProxyCacheResponse);

  // PurgeImageProxyCacheOlderThan deletes entries past the copyright
  // retention window, regardless of TTL.
  rpc PurgeImageProxyCacheOlderThan(PurgeImageProxyCacheOlderThanRequest) returns (PurgeImageProxyCacheOlderThanResponse);

  // ── Scraping policy (alt-harvester refresh, alt-backend enforcement) ──

  // GetScrapingDomainByDomain returns the recorded policy for a hostname.
  rpc GetScrapingDomainByDomain(GetScrapingDomainByDomainRequest) returns (GetScrapingDomainByDomainResponse);

  // GetScrapingDomainByID returns the recorded policy by row id.
  rpc GetScrapingDomainByID(GetScrapingDomainByIDRequest) returns (GetScrapingDomainByIDResponse);

  // SaveScrapingDomain upserts a scraping domain by hostname.
  rpc SaveScrapingDomain(SaveScrapingDomainRequest) returns (SaveScrapingDomainResponse);

  // ListScrapingDomains pages through the recorded policies.
  rpc ListScrapingDomains(ListScrapingDomainsRequest) returns (ListScrapingDomainsResponse);

  // UpdateScrapingDomainPolicy applies a partial policy update. Unknown id is
  // NotFound rather than a silent zero-row update.
  rpc UpdateScrapingDomainPolicy(UpdateScrapingDomainPolicyRequest) returns (UpdateScrapingDomainPolicyResponse);

  // SaveDeclinedDomain records that a user declined full-text fetch for a
  // domain. Idempotent.
  rpc SaveDeclinedDomain(SaveDeclinedDomainRequest) returns (SaveDeclinedDomainResponse);

  // IsDomainDeclined reports whether a user declined full-text fetch for a
  // domain.
  rpc IsDomainDeclined(IsDomainDeclinedRequest) returns (IsDomainDeclinedResponse);

  // ── Automatic full-text fetch groundwork ──

  // ListSubscribedUserIDsByFeedLinkID returns the users subscribed to a feed
  // link, so a fetched article can be fanned out to each of them.
  rpc ListSubscribedUserIDsByFeedLinkID(ListSubscribedUserIDsByFeedLinkIDRequest) returns (ListSubscribedUserIDsByFeedLinkIDResponse);

  // CheckArticleExistsByURLForUser is the tenant-scoped existence check.
  rpc CheckArticleExistsByURLForUser(CheckArticleExistsByURLForUserRequest) returns (CheckArticleExistsByURLForUserResponse);
}
