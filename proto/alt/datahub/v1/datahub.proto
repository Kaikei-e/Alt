syntax = "proto3";

// Package alt.datahub.v1 is the contract alt-data-hub serves — the single
// owner of alt_db (ADR-000954 D3).
//
// It supersedes services.backend.v1.BackendInternalService. That name was
// accurate while the internal API lived inside the alt-backend process; after
// the three-way split (ADR-000954 D1) the provider is a different binary with
// a different failure domain, and "backend internal" describes neither the
// owner nor the boundary. ADR-000954 D7 chose one namespace over a
// keep-both split precisely so that "which package does a new capability go
// in" stops being a per-PR judgement call: every alt_db capability goes here.
//
// MIGRATION STATE (ADR-000954 D7, Wave 2-A):
// alt-data-hub serves this service *and* the legacy
// services.backend.v1.BackendInternalService at the same time. Every RPC below
// carries an `Origin:` comment naming the legacy procedure it replaces, and
// every request/response message is wire-identical to its legacy counterpart —
// same field numbers, same field names, same types, same cardinality. Only the
// package and (where the legacy name was awkward) the message name differ.
// That is what lets Wave 2-B move one peer at a time: a peer switches the URL
// path and nothing else about the bytes it sends changes.
//
// alt-backend/app/dataplane/connect/datahubapi enforces the wire-identity
// claim as a test rather than a promise — see wirecompat_test.go, which walks
// both descriptor sets field by field. If you add a field here without adding
// it to the legacy message, that test fails; that is deliberate for as long as
// both namespaces are served. Wave 2-C deletes the legacy proto, the adapter
// and that test together, and this file becomes free to evolve on its own.
package alt.datahub.v1;

option go_package = "alt/gen/proto/alt/datahub/v1;datahubv1";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Article Types
// =============================================================================

// ArticleWithTags represents an article with its associated tags.
// Wire-identical to services.backend.v1.ArticleWithTags.
message ArticleWithTags {
  string id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  google.protobuf.Timestamp created_at = 5;
  string user_id = 6;
  string feed_id = 7;
  // BCP-47 short code ("ja", "en") or "und" when detection is unavailable.
  string language = 8;
  // Source publication timestamp from the feed. Unset when the article row
  // has no published_at; consumers that need a date fall back to created_at.
  google.protobuf.Timestamp published_at = 9;
}

// DeletedArticle represents a deleted article.
// Wire-identical to services.backend.v1.DeletedArticle.
message DeletedArticle {
  string id = 1;
  google.protobuf.Timestamp deleted_at = 2;
}

// =============================================================================
// ListArticlesWithTags - Backward pagination for backfill
// =============================================================================

message ListArticlesWithTagsRequest {
  // Cursor: last created_at from previous page (omit for first page)
  optional google.protobuf.Timestamp last_created_at = 1;
  // Cursor: last article ID from previous page
  string last_id = 2;
  // Page size (max 500)
  int32 limit = 3;
}

message ListArticlesWithTagsResponse {
  repeated ArticleWithTags articles = 1;
  // Cursor for next page
  optional google.protobuf.Timestamp next_created_at = 2;
  string next_id = 3;
}

// =============================================================================
// ListArticlesWithTagsForward - Forward pagination for incremental indexing
// =============================================================================

message ListArticlesWithTagsForwardRequest {
  // Incremental mark: only return articles created after this timestamp
  google.protobuf.Timestamp incremental_mark = 1;
  // Cursor: last created_at from previous page (omit for first page)
  optional google.protobuf.Timestamp last_created_at = 2;
  // Cursor: last article ID from previous page
  string last_id = 3;
  // Page size (max 500)
  int32 limit = 4;
}

message ListArticlesWithTagsForwardResponse {
  repeated ArticleWithTags articles = 1;
  // Cursor for next page
  optional google.protobuf.Timestamp next_created_at = 2;
  string next_id = 3;
}

// =============================================================================
// ListDeletedArticles - For syncing deletions
// =============================================================================

message ListDeletedArticlesRequest {
  // Cursor: last deleted_at from previous page (omit for first page)
  optional google.protobuf.Timestamp last_deleted_at = 1;
  // Page size (max 500)
  int32 limit = 2;
}

message ListDeletedArticlesResponse {
  repeated DeletedArticle articles = 1;
  // Cursor for next page
  optional google.protobuf.Timestamp next_deleted_at = 2;
}

// =============================================================================
// GetLatestArticleTimestamp - For determining incremental mark
// =============================================================================

message GetLatestArticleTimestampRequest {}

message GetLatestArticleTimestampResponse {
  // Latest created_at timestamp, absent if no articles exist
  optional google.protobuf.Timestamp latest_created_at = 1;
}

// =============================================================================
// GetArticleByID
// =============================================================================

message GetArticleByIDRequest {
  string article_id = 1;
}

message GetArticleByIDResponse {
  ArticleWithTags article = 1;
}

