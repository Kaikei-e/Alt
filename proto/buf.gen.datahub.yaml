version: v2
# Code generation for services.datahub.v1 — the contract alt-data-hub serves
# (ADR-000954 D3/D7).
#
# This lives in its own template because the default one (buf.gen.yaml) covers
# the alt/ root and emits TypeScript into alt-frontend-sv, and DataHubService is
# reachable only over mutual TLS from a listener with no published port, so a
# browser bundle can never call it; shipping client stubs for it would advertise
# a surface that does not exist from the browser's side of the network. That is
# the same distinction the root convention of ADR-000955 encodes — alt.* is
# browser-reachable, services.* is east-west — so the separation is now
# structural rather than an exclusion the default template has to remember.
#
# Only alt-backend is a target today because Wave 2-A only makes alt-data-hub
# *serve* the new namespace. Wave 2-B adds one consumer target per peer PR
# (rag-orchestrator, pre-processor, search-indexer, …) as each peer is moved,
# so that a service acquires the generated client in the same commit that
# starts calling it.
inputs:
  - directory: .
    paths:
      - services/datahub
plugins:
  # ============================================================================
  # alt-backend / alt-data-hub (server implementation)
  # ============================================================================
  - local: protoc-gen-go
    out: ../alt-backend/app/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../alt-backend/app/gen/proto
    opt: paths=source_relative
