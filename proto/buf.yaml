version: v2
modules:
  - path: .
    name: buf.build/alt/proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # No ignores. The Knowledge Loop retire ([[000940]]) once needed three, to
  # suppress a one-time report against the pre-retire baseline; that landed on
  # main, so the baseline already matches and the entries only hid future
  # breaks. buf's `breaking.ignore` exempts a file from every breaking rule,
  # and two of the three were sovereign.proto and augur.proto — the contracts
  # alt-backend speaks over binary protobuf, where a field number is the wire
  # identity of a field.
