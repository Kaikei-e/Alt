version: v2
modules:
  - path: .
    name: buf.build/alt/proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # One ignore, for a file that no longer exists.
  #
  # ADR-000954 Wave 2-C deleted services/backend/v1/internal.proto after all
  # five consumers moved to alt.datahub.v1.DataHubService. That deletion is the
  # point of the wave, and FILE_NO_DELETE reports it against the main baseline
  # until this branch is main.
  #
  # The Knowledge Loop retire ([[000940]]) once carried three entries here and
  # they were wrong, so it is worth saying why this one is not the same
  # mistake. Those named files that still existed — sovereign.proto and
  # augur.proto among them — and `breaking.ignore` exempts a file from *every*
  # breaking rule, so they went on hiding real field-number changes on live
  # contracts long after the one report they were added for. This entry names a
  # path with nothing at it. There is no future break it can conceal, because
  # there is nothing left to break.
  #
  # It is still garbage, and the same garbage as last time in one respect: once
  # this lands on main the baseline matches and the entry does nothing. Delete
  # it in the first PR after the merge.
  ignore:
    - services/backend/v1/internal.proto
