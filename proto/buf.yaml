version: v2
modules:
  - path: .
    name: buf.build/alt/proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # Three ignores, all for paths that no longer exist.
  #
  # ADR-000955 moved alt/datahub to services/datahub — alt.* is the public,
  # browser-reachable root and services.* is east-west, and DataHubService is
  # mTLS-only — and deleted alt/preprocessor, a dead duplicate of
  # services/preprocessor with no callers. alt/tts went with the tts-speaker
  # retirement: the service, its provider verification and every consumer of
  # alt.tts.v1 are gone. FILE_NO_DELETE reports all three against the main
  # baseline until this branch is main.
  #
  # Nothing lives at any of the three paths, so no entry can conceal a future
  # break: `breaking.ignore` exempts a file from every breaking rule, which is
  # why the three entries the Knowledge Loop retire ([[000940]]) once carried
  # were wrong — they named files that still existed and hid real field-number
  # changes on live contracts for months.
  #
  # All three do nothing the moment this lands on main and the baseline
  # matches. Delete them in the first PR after the merge.
  ignore:
    - alt/datahub/v1/datahub.proto
    - alt/preprocessor/v2/preprocessor.proto
    - alt/tts/v1/tts.proto
  # Intentional, coordinated rename of the topic cards RPC and request/response
  # messages in RecapService. Every consumer ships in the same deploy through
  # Compose (no compat aliases). Delete this entry in the first PR after the
  # rename reaches main.
  ignore_only:
    MESSAGE_NO_DELETE:
      - alt/recap/v2/recap.proto
    RPC_NO_DELETE:
      - alt/recap/v2/recap.proto
