version: v2
# Python client stubs for services.datahub.v1 — acolyte-orchestrator's half of
# the notification outbox relay. The relay forwards notification_outbox rows
# (acolyte-db) to DataHubService/EnqueueNotification, which owns
# push_deliveries in alt-db.
#
# Separate template rather than a target added to buf.gen.datahub.yaml for the
# same reason buf.gen.datahub-taggen.yaml is separate: that file's plugin list
# is Go-only and resolved from the local $PATH, while these stubs come from
# buf's *remote* plugins. Splitting per language keeps each `buf generate`
# invocation all-or-nothing.
#
# Separate from buf.gen.datahub-taggen.yaml rather than a second `out:` on it
# because the two consumers regenerate independently: one shared template would
# make a tag-generator proto bump silently rewrite acolyte-orchestrator's tree.
#
# Regenerate with:
#   PATH=/home/koko/go/bin:$PATH
#   cd proto && buf generate --template buf.gen.datahub-acolyte.yaml
inputs:
  - directory: .
    paths:
      - services/datahub
plugins:
  # Python protobuf messages (pinned to v33.5 for protobuf 6.x runtime compatibility)
  - remote: buf.build/protocolbuffers/python:v33.5
    out: ../acolyte-orchestrator/acolyte/gen/proto
  # Python protobuf type stubs
  - remote: buf.build/protocolbuffers/pyi:v33.5
    out: ../acolyte-orchestrator/acolyte/gen/proto
  # Connect-RPC Python service stubs (pinned to the connect-python runtime
  # version in acolyte-orchestrator's pyproject.toml — an unpinned plugin
  # generates against unreleased runtime APIs such as connectrpc.codec)
  - remote: buf.build/connectrpc/python:v0.9.0
    out: ../acolyte-orchestrator/acolyte/gen/proto
