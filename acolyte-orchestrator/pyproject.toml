[project]
name = "acolyte-orchestrator"
version = "0.1.0"
description = "Versioned report generation orchestrator with LangGraph pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework (ASGI)
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.34.0",
    # Data validation & configuration
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    # Logging
    "structlog>=25.4.0",
    # Connect-RPC (typed service boundary)
    "connect-python>=0.9.0",
    "protobuf>=6.33.5,<7.0",
    # Database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # HTTP client (for news-creator, search-indexer)
    "httpx>=0.28.0,<0.29",
    # LangGraph orchestration
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.3,<3.2",
    # OpenTelemetry
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "cryptography>=50.0.0,<51",
    "jwcrypto>=1.5.8,<2",
    "pyjwt>=2.15.1",
    "prometheus-client>=0.26.0,<1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "httpx>=0.28.0,<0.29",

    # Code Quality
    "ruff>=0.12.0",
    "pyrefly>=0.42.0",
    "bandit>=1.9.0",

    # Contract testing (Pact CDC)
    "pact-python>=3.2.1",
]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "protobuf>=6.33.5,<7.0",
    "cryptography>=50.0.0,<51",
    "jwcrypto>=1.5.8,<2",
    "prometheus-client>=0.26.0,<1",
    "httpx>=0.28.0,<0.29",
    "langgraph-checkpoint-postgres>=3.1.3,<3.2",
    "urllib3>=2.8.0",
    "langgraph-sdk>=0.4.6",
    "multidict>=6.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evaluation/tests"]
addopts = [
    "--cov=acolyte",
    "--cov-report=term-missing",
    "-v",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist", "acolyte/gen"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "S",     # bandit (security)
    "N",     # pep8-naming
    "ANN",   # annotations
    "PTH",   # use-pathlib
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
]
ignore = [
    "E501",   # Line too long (handled by formatter when possible)
    "RUF001", # ambiguous unicode chars in strings — intentional Japanese text
    "RUF002", # ambiguous unicode chars in docstrings — intentional Japanese text
    "RUF003", # ambiguous unicode chars in comments — intentional Japanese text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]
"evaluation/tests/**" = ["S101"]

[tool.pyrefly]
project-includes = ["."]
project-excludes = [
    "**/__pycache__",
    "**/.venv",
    "acolyte/gen/**",
]
python-version = "3.14"

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false
