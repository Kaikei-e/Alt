[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "."]
addopts = [
    "--cov=.",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--junit-xml=tests/results.xml",
    "-v",
]

[project]
name = "tag-generator"
version = "0.1.0"
description = "Ultra-minimal tag generator (external models required)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Japanese Text Processing (self-contained)
    "fugashi[unidic-lite]>=1.5.1", # includes unidic-lite, no external MecAB needed
    # Language Processing (minimal)
    # >=3.10.4: CVE-2026-109956 WekaClassifier model path bypass, on top of
    # CVE-2026-79675 Stanford JVM argument injection and the 3.10.x batch.
    "nltk>=3.10.4",
    "langdetect>=1.0.9",
    # Database
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Logging and Data Validation
    "structlog>=25.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Security
    "nh3>=0.2.18",
    # HTML readability extraction
    "readability-lxml>=0.8.4.1",
    "lxml>=5.3.0",
    # Connect-RPC (typed backend API client)
    "connect-python>=0.9.0",
    "protobuf>=6.33.5,<7.0",
    # Authentication and API
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "aiohttp>=3.14.5",
    "redis>=5.0.0",  # Redis Streams consumer
    "PyJWT>=2.15.1",
    "python-multipart>=0.0.27",
    # OpenTelemetry
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    # NOTE: Heavy ML packages removed for ultra-minimal build
    # keybert, sentence-transformers, transformers must be installed in external models
    # or use runtime installation with lazy loading
    "cryptography>=50.0.0,<51",
    "jwcrypto>=1.5.8,<2",
    "prometheus-client>=0.26.0,<1",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    # Testing Framework
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.4.0",
    # Code Quality Tools
    "ruff>=0.12.1",
    "bandit>=1.8.0",
    "pytest-asyncio>=0.24.0",
    # Property-based testing
    "hypothesis>=6.100.0",
    # Type Checking
    "pyrefly>=0.42.0",
    "types-psycopg2>=2.9.21.20250516",
    # Additional test dependencies for CI
    "langdetect>=1.0.9",
    "psutil>=5.9.0",
    "httpx>=0.28.1",
    # Contract testing
    "pact-python>=3.2.1",
]

# ML dependencies. Installed via `uv sync --group ml` in Dockerfile.
# torch is pinned to the CPU-only wheel index via [tool.uv.sources] below
# so transitive installs stay CPU-only (ADR-000762 / ADR-000812 pattern).
ml = [
    "torch>=2.1.0",
    "sentence-transformers>=5.0.0",
    "keybert>=0.8.5",
    "transformers>=5.8.2",
    "scikit-learn>=1.5.2",
    "numpy>=1.26.0",
    "onnxruntime>=1.21.0",
    "unidic",
]

# Extended ML dependencies including GiNZA for improved Japanese NLP.
# Install with: uv sync --group ml-extended
ml-extended = [
    "torch>=2.1.0",
    "sentence-transformers>=5.0.0",
    "keybert>=0.8.5",
    "transformers>=5.8.2",
    "scikit-learn>=1.5.2",
    "numpy>=1.26.0",
    "onnxruntime>=1.21.0",
    "unidic",
    "ginza>=5.2.0",
    "ja-ginza>=5.2.0",
    "spacy>=3.8.0",
]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "protobuf>=6.33.5,<7.0",
    "Pygments>=2.20.0",
    "cryptography>=50.0.0,<51",
    "jwcrypto>=1.5.8,<2",
    "prometheus-client>=0.26.0,<1",
    "httpx>=0.28.1,<0.29",
    "urllib3>=2.8.0",
    "multidict>=6.9.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages]
find = { include = [
    "tag_generator",
    "tag_generator.*",
    "tag_extractor",
    "tag_extractor.*",
    "tag_inserter",
    "tag_inserter.*",
] }

# Ultra-minimal optimization notes:
# - Removed ALL heavy ML packages from core dependencies
# - Created separate 'ml' group for ML dependencies
# - Reduced to absolute minimum for basic functionality
# - ML models must be provided externally or installed at runtime

[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info", "tag_generator/gen", "test_unit.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "N",     # pep8-naming
    "ANN",   # annotations
    "S",     # bandit (security)
    "PTH",   # use-pathlib
    "C4",    # flake8-comprehensions
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
    "FAST",  # FastAPI
]
ignore = [
    "E501",   # Line too long (handled by formatter when possible)
    "RUF001", # ambiguous unicode chars in strings — intentional Japanese text
    "RUF002", # ambiguous unicode chars in docstrings — intentional Japanese text
    "RUF003", # ambiguous unicode chars in comments — intentional Japanese text
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__", "*.egg-info", "build", "dist"]
skips = [
    "B101",
    "B404",
    "B603",
    "B110",
    "B104",
    "B108",
    "B602",
] # Skip assert_used, subprocess import, subprocess execution, try_except_pass, hardcoded_bind_all_interfaces, hardcoded_tmp_directory, and subprocess_popen_with_shell_equals_true tests

[tool.pyrefly]
project-includes = ["."]
project-excludes = [
    "**/__pycache__",
    "**/.venv",
    "**/build",
    "**/dist",
    "**/*.egg-info",
    "tag_generator/gen/**",
    "**/test_unit.py",
]
python-version = "3.14"

# Suppress errors for optional ML dependencies (installed separately in Docker)
[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false
