[project]
name = "rerank-server"
version = "0.1.0"
description = "MLX-based rerank server for cross-encoder reranking"
requires-python = ">=3.14"
dependencies = [
    # 6.x is unreachable: it requires transformers>=5.0.0, which the onnx
    # group's optimum-onnx 0.1.0 caps at <4.58.0.
    "sentence-transformers>=5.7.0,<6.0.0",
    "fastapi>=0.133.0",
    "uvicorn>=0.41.0",
    "torch>=2.0.0",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
    "pyrefly>=0.42.0",
    "pytest>=8.0.0",
    # starlette's TestClient imports httpx2; without it the whole suite fails
    # to collect.
    "httpx2>=2.12.0",
]
# CPU int8 ONNX backend, used only by the Docker container (RERANK_BACKEND=onnx).
# Not needed on the Mac deploy target, which stays on requirements.txt + torch/MPS.
onnx = [
    "onnxruntime==1.27.0",
    "optimum[onnxruntime]==2.1.0",
    "optimum-onnx==0.1.0",
]

[tool.uv]
constraint-dependencies = ["Pygments>=2.20.0"]

# CPU-only index for torch: avoids pulling ~5GB of unused CUDA/nvidia/triton
# packages into local `uv sync` on non-GPU Linux dev machines (this service
# actually deploys to a Mac via rsync + pip, not via this lockfile).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
python-version = "3.14"

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false
