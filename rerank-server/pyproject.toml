[project]
name = "rerank-server"
version = "0.1.0"
description = "MLX-based rerank server for cross-encoder reranking"
requires-python = ">=3.14"
dependencies = [
    # 6.x is unreachable: it requires transformers>=5.0.0, which the onnx
    # group's optimum-onnx 0.1.0 caps at <4.58.0.
    "sentence-transformers>=5.7.0,<6.0.0",
    "fastapi>=0.133.0",
    "uvicorn>=0.41.0",
    "torch>=2.0.0",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
    "pyrefly>=0.42.0",
    "pytest>=8.0.0",
    # starlette's TestClient imports httpx2; without it the whole suite fails
    # to collect.
    "httpx2>=2.12.0",
    "ruff>=0.15.20,<0.16",
]
# CPU int8 ONNX backend, used only by the Docker container (RERANK_BACKEND=onnx).
# Not needed on the Mac deploy target, which stays on requirements.txt + torch/MPS.
onnx = [
    "onnxruntime==1.27.0",
    "optimum[onnxruntime]==2.1.0",
    "optimum-onnx==0.1.0",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19", "Pygments>=2.20.0", "urllib3>=2.8.0"]

# CPU-only index for torch: avoids pulling ~5GB of unused CUDA/nvidia/triton
# packages into local `uv sync` on non-GPU Linux dev machines (this service
# actually deploys to a Mac via rsync + pip, not via this lockfile).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
python-version = "3.14"

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false

[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "S",     # bandit (security)
    "N",     # pep8-naming
    "ANN",   # annotations
    "PTH",   # use-pathlib
    "BLE",   # blind-except
    "ASYNC", # async best practices
    "TRY",   # tryceratops
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "DTZ",   # flake8-datetimez
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "PERF",  # perflint
    "FAST",  # FastAPI
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "RUF001", # ambiguous unicode character in string
    "RUF002", # ambiguous unicode character in docstring
    "RUF003", # ambiguous unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses bare assert
"test_*.py" = ["S101"] # pytest uses bare assert
