# services.yaml — single source of truth for service registration.
#
# Regenerated artifacts (scripts/regen-service-registry.py --write):
#   1. .github/workflows/docker-build.yaml SERVICES=(...) block
#   2. c2quay.yml environments.production.services block
#   3. .github/generated/alt-deploy-service-paths.js (snippet to paste
#      into alt-deploy's release-deploy.yaml SERVICE_PATHS)
#
# CI lint (.github/workflows/services-registry-lint.yaml) fails when
# those files drift from this registry. Edit here, run the regen
# script, and commit all four changes together.
#
# The three fields that drive the regen:
#   name          — directory name under the repo root; also the ghcr
#                   image suffix (ghcr.io/kaikei-e/alt-<name>)
#   kind          — pacticipant | runtime | external
#                   * pacticipant: enters c2quay.yml + alt-deploy matrix,
#                     plus docker-build SERVICES[]
#                   * runtime: built via docker-build but not a Pact
#                     pacticipant (no alt-deploy deploy gate)
#                   * external: Pact pacticipant that lives on another
#                     host (e.g. a service on a dedicated GPU box) —
#                     enters c2quay.yml only, no local build
#   compose_files — production compose include files that define or
#                   reference this service; their paths seed alt-deploy
#                   SERVICE_PATHS so compose-layer edits trigger the
#                   right rebuild. Omitted for `runtime` and `external`.
#
# Optional fourth field:
#   build         — build inputs, when they are NOT derived from `name`.
#                     dir        source directory + change-detection prefix
#                     dockerfile path relative to the repo root
#                     args       extra --build-arg pairs
#                   Omit it and everything falls back to the historical
#                   name-is-the-directory rule: dir = name, Dockerfile
#                   discovered under that directory, no build args. Only the
#                   alt-backend trio needs it — three images out of one
#                   directory, which is exactly the case the old rule cannot
#                   express. Several services then share a `dir`, so a change
#                   under alt-backend/ rebuilds all three.

services:
  # --- 13 Pact pacticipants deployed locally via pull-deploy ---
  - name: alt-backend
    kind: pacticipant
    compose_files: [bff.yaml, core.yaml]
    build:
      dir: alt-backend
      dockerfile: alt-backend/Dockerfile.backend
      args: {BINARY: backend}

  - name: alt-butterfly-facade
    kind: pacticipant
    compose_files: [bff.yaml]
  - name: auth-hub
    kind: pacticipant
    compose_files: [auth.yaml]
  - name: pre-processor
    kind: pacticipant
    compose_files: [ai.yaml]
  - name: search-indexer
    kind: pacticipant
    compose_files: [workers.yaml]
  - name: mq-hub
    kind: pacticipant
    compose_files: [mq.yaml]
  - name: rag-orchestrator
    kind: pacticipant
    compose_files: [rag.yaml]
  - name: recap-worker
    kind: pacticipant
    compose_files: [recap.yaml]
  - name: recap-subworker
    kind: pacticipant
    compose_files: [recap.yaml]
  - name: recap-evaluator
    kind: pacticipant
    compose_files: [recap.yaml]
  - name: news-creator
    kind: pacticipant
    compose_files: [ai.yaml]
  - name: tag-generator
    kind: pacticipant
    compose_files: [workers.yaml]
  - name: acolyte-orchestrator
    kind: pacticipant
    compose_files: [acolyte.yaml]
  - name: knowledge-sovereign
    kind: pacticipant
    compose_files: [sovereign.yaml]

  # --- Runtime images built via docker-build but not Pact pacticipants ---
  #
  # alt-harvester / alt-data-hub are the other two binaries of the alt-backend
  # Go module — same directory, same Dockerfile, different ./cmd target. Images
  # follow the existing convention (ghcr.io/<owner>/alt-<name>), so they land
  # as alt-alt-harvester / alt-alt-data-hub, the same intentional doubling as
  # alt-alt-backend. No new naming rule.
  #
  # `runtime`, not `pacticipant`, for wave 1 on purpose. The pacts these
  # binaries will own (the ones alt-backend holds today against
  # pre-processor / search-indexer / knowledge-sovereign, and the internal
  # listener contracts other services hold against alt-backend) are still
  # published under the `alt-backend` pacticipant. Registering two new
  # pacticipants before any verification exists for them makes can-i-deploy
  # either block the whole all_or_nothing production gate or wave them
  # through on an empty history — neither answers the question the gate is
  # asked. Promote both to `pacticipant` in wave 3, after a release cycle of
  # dual-publishing the verifications under old and new names.
  - name: alt-harvester
    kind: runtime
    build:
      dir: alt-backend
      dockerfile: alt-backend/Dockerfile.backend
      args: {BINARY: harvester}
  - name: alt-data-hub
    kind: runtime
    build:
      dir: alt-backend
      dockerfile: alt-backend/Dockerfile.backend
      args: {BINARY: datahub}
  # alt-notifier is the fourth binary of the same module — the Web Push
  # dispatcher. `runtime` for the same reason as its two siblings: it owns no
  # pact of its own. It claims deliveries from alt-data-hub over mTLS, and that
  # contract is published under the alt-backend / alt-data-hub pacticipants
  # that already exist.
  #
  # Registering it here is what makes the image exist at all. compose refers to
  # ghcr.io/<owner>/alt-alt-notifier, so without this entry docker-build never
  # produces one, alt-deploy never rolls it, and the container fails to pull —
  # a notification path that is absent rather than broken, which is the shape
  # this whole feature is built to avoid.
  - name: alt-notifier
    kind: runtime
    build:
      dir: alt-backend
      dockerfile: alt-backend/Dockerfile.backend
      args: {BINARY: notifier}

  - name: alt-frontend-sv
    kind: runtime
  - name: pre-processor-sidecar
    kind: runtime
  - name: auth-token-manager
    kind: runtime
  - name: rask-log-aggregator
    kind: runtime
  - name: rask-log-forwarder
    kind: runtime
  - name: pki-agent
    kind: runtime
  - name: dashboard
    kind: runtime
