[project]
name = "recap-evaluator"
version = "0.1.0"
description = "RecapJob精度評価マイクロサービス - 7日間Recapの品質を多角的に評価"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "asyncpg>=0.30.0",

    # HTTP Client (Ollama連携)
    "httpx>=0.28.0",

    # Data Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Evaluation Libraries
    # NOTE: torch is declared directly so [tool.uv.sources] routes it to the
    # CPU wheel index. Without a direct declaration the pin does not apply to
    # transitive requests (bert-score -> torch) and uv falls back to PyPI,
    # pulling the full CUDA stack into the image.
    "torch>=2.11.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "transformers>=4.40.0",

    # Report Generation
    "jinja2>=3.1.0",

    # Logging
    "structlog>=25.1.0",

    # OpenTelemetry
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",

    # Scheduling
    "apscheduler>=3.10.0",

    # In-process step-ca enrollment + outbound mTLS
    "cryptography>=44.0.0,<51",
    "jwcrypto>=1.5.6,<2",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",

    # Contract Testing (Pact CDC)
    "pact-python>=3.2.1",

    # Code Quality
    "ruff>=0.8.0",

    # Type Checking
    "pyrefly>=0.42.0",
]

[tool.uv]
# nltk arrives through rouge-score; >=3.10.4 clears CVE-2026-109956,
# CVE-2026-79675, and the 3.10.x path-traversal / DoS batch.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "protobuf>=6.33.5",
    "Pillow>=13.0.0",
    "Pygments>=2.20.0",
    "nltk>=3.10.4",
    "urllib3>=2.8.0",
    "multidict>=6.9.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF",
    "ANN",    # annotations
    "S",      # bandit
    "BLE",    # blind-except
    "SIM",    # simplify
    "ASYNC",  # async best practices
    "TRY",    # tryceratops
    "PTH",    # pathlib
    "PL",     # pylint
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "T20",    # flake8-print
    "RET",    # flake8-return
    "PERF",   # perflint
    "FAST",   # fastapi
]
ignore = [
    "E501",   # Line too long (handled by formatter when possible)
    "RUF001", # ambiguous unicode chars in strings — intentional Japanese text
    "RUF002", # ambiguous unicode chars in docstrings — intentional Japanese text
    "RUF003", # ambiguous unicode chars in comments — intentional Japanese text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# py314 formatting drops the parentheses from multi-type except clauses; the
# shared enrollment copy and mtls_client stay 3.13-parseable
# (tests/unit/infra/pki/test_compileall.py).
exclude = ["src/recap_evaluator/infra/pki/**", "src/recap_evaluator/infra/mtls_client.py"]

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist", "tests/**"]
search-path = ["src"]
python-version = "3.14"
replace-imports-with-any = [
    "rouge_score.*", "bert_score.*", "transformers.*",
    "sklearn.*", "numpy.*", "pandas.*",
]

[tool.pyrefly.errors]
missing-import = false
missing-module-attribute = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--cov=src/recap_evaluator",
    "--cov-report=term-missing",
]
